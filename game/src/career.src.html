<html lang="en-GB">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<meta name="claude:viewport-fit-sides" content="cover">

<script>document.documentElement.lang = "en-GB"; if (matchMedia("(pointer: coarse)").matches || Math.min(screen.width, screen.height) < 700) document.documentElement.classList.add("lite"); document.documentElement.classList.add("career"); document.documentElement.style.setProperty("--horse", "url(\"%%HORSE%%\")");</script>
<!-- Thoroughbred, the full game's home (prototype, 20 Nov 2026): the Newmarket board is the hub. Every place on it is a
     part of the stable (the same screens are on the tab bar), a card on the board says what needs doing this week, and one
     gold button moves the week on. The races themselves are not in this prototype: a week's runners are settled at once.
     Built by game/tools/build_career.py from src/career.src.html; the screens are js/career/ui.js, the rules js/career/core.js. -->

<header class="bar" id="bar">
  <button class="brand" data-act="open" data-sheet="more" type="button" aria-label="Menu">
    <span class="mark" aria-hidden="true"></span><span class="brand-t"><b>THOROUGHBRED</b><i id="brandWhere">Newmarket</i></span>
  </button>
  <!-- the five ways in: along the bottom on a phone, in the bar on a computer -->
  <nav class="cnav" id="nav" aria-label="Main"></nav>
  <div class="cstats" id="stats" aria-live="polite"></div>
</header>

<main class="view" id="view" aria-label="The Newmarket board">
  <div class="holder" id="holder">
    <div class="lean" id="lean"><div class="stage" id="stage">
      <img src="assets/newmarket/newmarket-board.webp" alt="The Newmarket board: the town, the gallops, Tattersalls, the stables and the National Stud" width="1448" height="1086">
      <canvas id="clouds" width="362" height="272" aria-hidden="true"></canvas>
      <canvas id="mist" width="362" height="272" aria-hidden="true"></canvas>
      <canvas id="life" aria-hidden="true"></canvas>
      <canvas id="banners" aria-hidden="true"></canvas>
      <div id="shade" hidden></div>
      <div id="warm"></div>
      <svg id="glow" viewBox="0 0 1448 1086">
        <defs>
          <filter id="halo" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="6"/></filter>
          <filter id="rim" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="0.9"/></filter>
          <filter id="inkglow" x="-10%" y="-10%" width="120%" height="120%"><feGaussianBlur stdDeviation="3.2"/></filter>
          <radialGradient id="washGrad" cx="50%" cy="50%" r="65%"><stop offset="0" stop-color="#ffe2a0" stop-opacity=".55"/><stop offset=".7" stop-color="#ffc870" stop-opacity=".3"/><stop offset="1" stop-color="#ffb050" stop-opacity=".55"/></radialGradient>
        </defs>
      </svg>
      <canvas id="lamps" width="724" height="543" aria-hidden="true"></canvas>
      <canvas id="smoke" width="1086" height="815" aria-hidden="true"></canvas>
      <canvas id="wisps" width="2896" height="600" aria-hidden="true"></canvas>
    </div></div>
  </div>
</main>

<button class="to-races" id="races" type="button"><span class="hz" aria-hidden="true"></span><span class="pill">To the Races</span><svg class="arr" viewBox="0 0 10 16" aria-hidden="true"><path d="M1.6 0 0 1.6 6.4 8 0 14.4 1.6 16l8-8z"/></svg><span class="nexttag" aria-hidden="true">Next</span></button>

<!-- the board's own card for a place: the career hub goes straight to the place's screen, so this stays hidden -->
<aside class="card" id="card" hidden>
  <header><div class="card-t"><span class="kicker" id="cardKicker"></span><h2 id="cardTitle"></h2></div><button class="x" id="cardClose" type="button" aria-label="Close">&times;</button></header>
  <div class="pic" id="cardPic" role="img" aria-label=""></div>
  <p class="status" id="cardStatus" hidden></p>
  <p class="text" id="cardText"></p>
  <button class="go" id="cardGo" type="button"><span id="cardCta">Enter</span></button>
  <p class="knote" id="cardNote" hidden></p>
</aside>

<!-- on a phone: pointers at the sides of the board to places that need something -->
<div class="edges" id="edges"></div>

<!-- this week: what needs doing, and the button that moves the week on -->
<aside class="dock" id="dock" aria-live="polite"></aside>

<!-- a place's screen: a sheet over the board -->
<div class="sheet-wrap" id="sheetWrap" hidden>
  <section class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="shTitle">
    <header class="sh-head" id="shHead">
      <div class="sh-pic" id="shPic" aria-hidden="true"></div>
      <div class="sh-medal" id="shMedal" aria-hidden="true"></div>
      <div class="sh-t"><div class="sh-k" id="shKicker"></div><h1 id="shTitle"></h1></div>
      <button class="sh-x" data-act="close" type="button"><svg viewBox="0 0 10 16" aria-hidden="true"><path d="M8.4 0 10 1.6 3.6 8 10 14.4 8.4 16l-8-8z"/></svg><span id="shCloseT">Back to the map</span></button>
    </header>
    <nav class="ctabs" id="shTabs" hidden></nav>
    <div class="sh-body" id="shBody"><div class="wrap" id="main"></div></div>
    <footer class="sh-foot" id="shFoot" hidden></footer>
  </section>
</div>

<!-- a choice made over a screen: which horse for a race, which stallion for a mare -->
<div class="picker-wrap" id="pickerWrap" hidden><section class="kpicker" id="picker" role="dialog" aria-modal="true"></section></div>

<div class="tb-toast" id="toast" role="status"></div>
<div class="tumble" id="tumble" aria-hidden="true"></div>

<script>window.ICON = { %%ICONSET%% };</script>
<script src="silks-paint.js"></script>
<script src="js/career/data.js"></script>
<script src="js/career/rules/rules.js"></script>

<script src="js/career/core.js"></script>
<script src="js/board.js"></script>
<script src="js/career/ui.js"></script>
<script type="module">
// The race engine (race-engine/engine.js in the repo) and the courses built for the 3D race view so far. Every career race
// is run by it (js/career/core.js -> engineFor), and the 3D race view (final-furlong.html) loads the very same files, so
// the race watched is the race recorded. A meeting at a course not built yet runs on its stand-in (data.js -> standin).
// If this fails to load, the rules' own roll runs the races instead and "Watch the race" shows the simple 2D version.
import { runRace, expectedPace } from "./assets/engine/engine.js";
const files = ["ascot", "newmarket", "newmarket-july", "york"];
const get = (p) => fetch(p).then((r) => { if (!r.ok) throw new Error(p + " " + r.status); return r.json(); });
const one = (C, settings) => Promise.all([`assets/course/${C}.json`, `assets/course/${C}-stalls.json`, `assets/course/${C}-standards.json`, `assets/course/${C}-view.json`].map(get))
  .then(([course, stalls, standards, view]) => [C, { data: { course, stalls, standards, settings }, view }]);
get("assets/engine/settings.json").then((settings) => Promise.all(files.map((C) => one(C, settings))))
  .then((list) => { window.ENGINE = { runRace, expectedPace, courses: Object.fromEntries(list) }; })
  .catch((e) => { window.ENGINE_FAILED = String(e); console.warn("race engine", e); })
  .finally(() => { window.ENGINE_DONE = 1; dispatchEvent(new Event("engine-ready")); });
</script>
<script type="module" src="js/life.js"></script>
