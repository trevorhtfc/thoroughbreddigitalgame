<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Thoroughbred Career</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500;600&family=Nunito:wght@400;600;700;800&family=Crimson+Pro:ital,wght@0,600;0,700;1,600&display=swap" rel="stylesheet">
<style>
/* Thoroughbred career. Layout idea: one phone-width column; a dark green band top and bottom, cream paper between; one gold button says what to do next. */
:root{
  --band:#446f66; --band-dk:#365a52; --band-xdk:#22403a; --green:#3d7153; --gold:#b79042; --gold-hi:#cfa955; --gold-lt:#e8cf8e;
  --bg:#f3efe7; --panel:#fbf9f4; --line:#d8d2c4; --ink:#33332b; --muted:#6b6a60; --on-dark:#f2eee7;
  --good:#3d7153; --warn:#b97a14; --bad:#a8433a; --info:#2f5f8f;
  --display:"Jost","Futura","Avenir Next",system-ui,sans-serif; --body:"Nunito",system-ui,-apple-system,"Segoe UI",sans-serif; --serif:"Crimson Pro",Georgia,"Times New Roman",serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--band-xdk);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.35;-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0;text-align:inherit}
button:focus-visible,input:focus-visible{outline:2px solid var(--gold-hi);outline-offset:2px}
#app{height:100%;max-width:520px;margin:0 auto;display:flex;flex-direction:column;background:var(--bg);position:relative;overflow:hidden}
.bar{flex:none;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 16px;background:var(--band-dk);color:var(--on-dark)}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand b{display:block;font-family:var(--display);font-weight:500;font-size:15px;letter-spacing:.16em;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand i{display:block;font-style:normal;font-family:var(--display);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;opacity:.8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cash{font-weight:800;font-variant-numeric:tabular-nums;background:var(--band-xdk);padding:6px 11px;border-radius:999px;box-shadow:inset 0 0 0 1px rgba(232,207,142,.45);white-space:nowrap}
.cash.neg{color:#ffb4a8}
main{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:14px 16px 20px;display:flex;flex-direction:column;gap:12px}
.nav{flex:none;display:grid;grid-template-columns:repeat(4,1fr);background:var(--band-dk)}
.nav button{padding:11px 4px 12px;text-align:center;color:rgba(242,238,231,.7);font-family:var(--display);font-size:12px;letter-spacing:.14em;text-transform:uppercase;border-top:3px solid transparent}
.nav button.on{color:#fff;border-top-color:var(--gold-hi)}
.cta{flex:none;display:flex;gap:8px;padding:10px 16px;background:var(--panel);border-top:1px solid var(--line)}
.btn{flex:1;display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:46px;padding:10px 14px;border-radius:10px;font-weight:800;font-size:15px;text-align:center;background:var(--green);color:var(--on-dark)}
.btn.gold{background:linear-gradient(180deg,var(--gold-hi),var(--gold));color:#2b2413;box-shadow:0 2px 0 #8d6b2a}
.btn.ghost{background:none;color:var(--green);box-shadow:inset 0 0 0 1.5px var(--green);flex:0 1 auto}
.btn.sm{min-height:36px;padding:6px 12px;font-size:13.5px;flex:none}
.btn.bad{background:var(--bad)} .btn[disabled]{opacity:.45;cursor:default}
.kick{font-family:var(--display);font-weight:600;font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--gold)}
h1,h2,h3{font-family:var(--serif);font-weight:700;margin:0;text-wrap:balance;color:var(--green);line-height:1.08}
h1{font-size:30px} h2{font-size:23px} h3{font-size:18px;color:var(--ink)}
p{margin:0} .mut{color:var(--muted)} .sm{font-size:13px} .num{font-variant-numeric:tabular-nums}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.hero{background:var(--band);color:var(--on-dark);border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:4px}
.hero h1,.hero h2{color:#fff} .hero .kick{color:var(--gold-lt)} .hero .sm{opacity:.88}
.hero .link{align-self:flex-start;margin-top:6px;color:var(--gold-lt);font-weight:700;font-size:13.5px;text-decoration:underline;text-underline-offset:3px}
.row{display:flex;align-items:center;gap:8px} .row.top{align-items:flex-start} .grow{flex:1;min-width:0} .wrap{flex-wrap:wrap}
.sp{justify-content:space-between}
/* gallops strip */
.gal{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:10px;background:#ece5d3;font-size:13px}
.pips{display:flex;gap:4px} .pips i{width:11px;height:11px;border-radius:50%;background:var(--gold);box-shadow:inset 0 0 0 1.5px #8d6b2a} .pips i.off{background:none;box-shadow:inset 0 0 0 1.5px #b9b09a}
/* horse card */
.hc{display:flex;flex-direction:column;gap:9px}
.hc .top{display:flex;gap:10px;align-items:center;width:100%}
.age{flex:none;width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:var(--band);color:#fff;font-family:var(--serif);font-weight:700;font-size:19px;line-height:1}
.age small{display:block;font-family:var(--display);font-size:8px;letter-spacing:.12em;margin-top:-2px;font-weight:500}
.age.f{background:#8a5a77}
.hn{font-family:var(--serif);font-weight:700;font-size:20px;line-height:1.05;color:var(--ink)}
.or{flex:none;text-align:right;font-family:var(--display)} .or b{display:block;font-size:20px;font-weight:600;line-height:1;font-variant-numeric:tabular-nums} .or i{font-style:normal;font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.stars{font-size:15px;letter-spacing:1.5px;background:linear-gradient(90deg,var(--gold) 0 var(--lo),#e3cf9b var(--lo) var(--hi),#d6d0c2 var(--hi) 100%);-webkit-background-clip:text;background-clip:text;color:transparent;white-space:nowrap}
.stars.big{font-size:26px;letter-spacing:3px}
.fresh{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted)}
.fbar{flex:1;height:7px;border-radius:4px;background:#e2dccd;overflow:hidden;position:relative} .fbar b{display:block;height:100%;border-radius:4px;background:var(--good)} .fbar.w b{background:var(--warn)} .fbar.b b{background:var(--bad)}
.form{font-family:var(--display);letter-spacing:.14em;font-weight:500;color:var(--ink)}
.note{font-family:var(--serif);font-style:italic;font-weight:600;font-size:16px;color:#4d4a3c;line-height:1.2}
.acts{display:flex;gap:8px}
.pickb{flex:1;min-width:0;display:flex;align-items:center;gap:8px;min-height:44px;padding:7px 11px;border-radius:10px;background:#fff;box-shadow:inset 0 0 0 1.5px var(--line);font-size:13.5px}
.pickb.set{box-shadow:inset 0 0 0 2px var(--green);background:#f1f6f1}
.pickb.need{box-shadow:inset 0 0 0 2px var(--gold);background:#fffaf0}
.pickb .t{flex:1;min-width:0} .pickb .t>b{display:block;line-height:1.25} .pickb .t>span{display:block;font-size:12px;color:var(--muted)}
.pickb .go{color:var(--muted);font-size:17px;flex:none}
.galb{flex:none;min-height:44px;padding:7px 12px;border-radius:10px;box-shadow:inset 0 0 0 1.5px var(--line);background:#fff;font-size:13.5px;font-weight:700;color:var(--green)}
.galb[disabled]{opacity:.4}
/* chips */
.cls{display:inline-block;flex:none;min-width:34px;text-align:center;padding:2px 6px;border-radius:5px;font-family:var(--display);font-weight:600;font-size:11px;letter-spacing:.08em;background:#e4e0d4;color:#4b4a40;vertical-align:1px}
.cls-G1{background:var(--gold);color:#fff} .cls-G2,.cls-G3{background:#f4e9c9;color:#7a5c1e;box-shadow:inset 0 0 0 1px var(--gold)} .cls-L{background:var(--green);color:#fff} .cls-HH{background:var(--band-xdk);color:var(--gold-lt)} .cls-H,.cls-C2{background:#c9d6d2;color:#22403a}
.ch{display:inline-block;flex:none;padding:3px 8px;border-radius:999px;font-size:11.5px;font-weight:800;white-space:nowrap;background:#e7e2d6;color:#5b594e}
.ch4{background:var(--gold);color:#fff} .ch3{background:var(--good);color:#fff} .ch2{background:#cfe0d2;color:#274d36} .ch1{background:#efe3c4;color:#6f5416} .ch0{background:#ecd9d5;color:#7c342c}
.fit{display:inline-flex;gap:5px;flex-wrap:wrap} .fit i{font-style:normal;font-size:11px;font-weight:700;padding:1px 6px 1px 5px;border-radius:5px;white-space:nowrap}
.fit i::before{margin-right:3px} .f-y{background:#dcebdd;color:#27583a} .f-y::before{content:"✓"} .f-m{background:#f1e6c6;color:#6f5416} .f-m::before{content:"~"} .f-n{background:#f0d9d5;color:#8a3329} .f-n::before{content:"✗"} .f-q{background:#e7e3d9;color:#6b6a60} .f-q::before{content:"?"}
.fit i.unsure{box-shadow:inset 0 0 0 1px currentColor;background:none}
.tag{display:inline-block;font-family:var(--display);font-size:10px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);margin-right:6px}
.odds{display:inline-block;min-width:44px;text-align:center;padding:2px 6px;border-radius:5px;font-weight:800;font-size:12px;color:#fff;background:#2b2b2b}
.odds.o2{background:#b23a30} .odds.o3{background:#e2b93b;color:#3a2f09} .odds.o4{background:#2f5f8f}
/* lists */
.list{display:flex;flex-direction:column} .li{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line);width:100%} .li:first-child{border-top:0}
.li .t{flex:1;min-width:0} .li .t>b{display:block} .li .t>span{display:block;font-size:12.5px;color:var(--muted)}
.li.me{background:#fbf3dc;margin:0 -14px;padding:10px 14px;width:auto;box-shadow:inset 3px 0 0 var(--gold)}
.sec{font-family:var(--display);font-weight:600;font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--green);margin:6px 0 -4px;display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.sec span{color:var(--muted);letter-spacing:.06em;text-transform:none;font-family:var(--body);font-weight:600;font-size:12.5px}
/* sheets */
.veil{position:absolute;inset:0;background:rgba(20,32,28,.55);display:flex;flex-direction:column;justify-content:flex-end;z-index:20}
.sheet{background:var(--bg);border-radius:16px 16px 0 0;max-height:92%;display:flex;flex-direction:column;box-shadow:0 -8px 30px rgba(0,0,0,.3)}
.sheet.full{height:96%}
.sh-h{flex:none;display:flex;align-items:flex-start;justify-content:space-between;gap:10px;padding:14px 16px 10px;border-bottom:1px solid var(--line)}
.sh-b{overflow-y:auto;padding:12px 16px 20px;display:flex;flex-direction:column;gap:12px}
.x{flex:none;width:34px;height:34px;border-radius:50%;background:#e4dfd2;display:grid;place-items:center;font-size:20px;line-height:1;color:var(--ink)}
.opt{display:flex;flex-direction:column;gap:5px;padding:11px 12px;border-radius:10px;background:#fff;box-shadow:inset 0 0 0 1.5px var(--line);width:100%}
.opt.on{box-shadow:inset 0 0 0 2.5px var(--green);background:#f1f6f1}
.opt .l1{display:flex;align-items:center;gap:8px} .opt .l1 b{flex:1;min-width:0;font-size:15px} .opt .l2{font-size:12.5px;color:var(--muted)}
/* tiles */
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tile{display:flex;flex-direction:column;gap:3px;min-height:62px;padding:8px 9px;border-radius:10px;background:#fff;box-shadow:inset 0 0 0 1.5px var(--line);text-align:left}
.tile i{font-style:normal;font-family:var(--display);font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.tile b{font-size:13.5px;line-height:1.15} .tile.k2{box-shadow:inset 0 0 0 1.5px var(--gold);background:#fffaf0} .tile.k0 b{color:#a9a595;font-size:20px;font-family:var(--serif)} .tile.k1 b{color:#6d6a5a}
.tile.on{box-shadow:inset 0 0 0 2.5px var(--green)}
.gp{display:flex;gap:3px;margin-top:2px} .gp u{flex:1;height:16px;border-radius:4px;background:#ebe7dc;text-decoration:none;font-size:9px;font-weight:800;display:grid;place-items:center;color:#8d8a7b;font-family:var(--display)}
.gp u.g2{background:var(--good);color:#fff} .gp u.g1{background:#e9d9a8;color:#6f5416} .gp u.g0{background:#dfa9a1;color:#6d231b} .gp u.h2{box-shadow:inset 0 0 0 1.5px var(--good);color:var(--good);background:none} .gp u.h1{box-shadow:inset 0 0 0 1.5px #c9ac55;background:none} .gp u.h0{box-shadow:inset 0 0 0 1.5px #d99;background:none}
.explain{font-size:13px;background:#ece5d3;border-radius:10px;padding:9px 12px}
.big3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center} .big3 div{background:#fff;border-radius:10px;padding:10px 4px;box-shadow:inset 0 0 0 1px var(--line)} .big3 b{display:block;font-family:var(--serif);font-size:24px;line-height:1;color:var(--green);font-variant-numeric:tabular-nums} .big3 i{font-style:normal;font-family:var(--display);font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
/* progress */
.prog{height:10px;border-radius:5px;background:#e2dccd;overflow:hidden} .prog b{display:block;height:100%;background:linear-gradient(90deg,var(--gold),var(--gold-hi));border-radius:5px;transition:width .8s ease}
.goal{display:flex;gap:9px;align-items:center;padding:7px 0;border-top:1px solid var(--line)} .goal:first-of-type{border-top:0}
.tick{flex:none;width:20px;height:20px;border-radius:50%;box-shadow:inset 0 0 0 1.5px #b9b09a;display:grid;place-items:center;font-size:12px;color:#fff} .tick.y{background:var(--good);box-shadow:none}
.cal{display:flex;flex-direction:column} .cal .li.now{background:#fbf3dc;margin:0 -14px;padding:10px 14px;width:auto} .cal .li.past{opacity:.55}
.cups{display:grid;grid-template-columns:1fr 1fr;gap:6px 10px} .cup{font-size:12.5px;display:flex;gap:6px;align-items:baseline;color:#9a968a} .cup::before{content:"";flex:none;width:9px;height:9px;border-radius:50%;box-shadow:inset 0 0 0 1.5px #b9b09a;transform:translateY(1px)} .cup.won{color:var(--ink);font-weight:700} .cup.won::before{background:var(--gold);box-shadow:none}
/* race view */
.rv{background:var(--band-xdk);color:var(--on-dark);border-radius:12px;padding:12px 0 10px;overflow:hidden}
.rv .hd{display:flex;justify-content:space-between;gap:8px;padding:0 14px 8px;font-family:var(--display);font-size:11.5px;letter-spacing:.14em;text-transform:uppercase}
.turf{position:relative;overflow:hidden;background:repeating-linear-gradient(90deg,#4f8a5b 0 60px,#488253 60px 120px);border-top:3px solid #f2eee7;border-bottom:3px solid #f2eee7}
.turf.go{animation:turf 1.1s linear infinite} @keyframes turf{to{background-position:-120px 0}}
.lane{position:relative;border-bottom:1px solid rgba(255,255,255,.07)} .lane.me{background:rgba(232,207,142,.22)}
.runner{position:absolute;left:0;top:1px;will-change:transform;display:flex;align-items:center} .runner .nm{position:absolute;right:100%;margin-right:5px;font-size:10.5px;font-weight:800;white-space:nowrap;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.6)}
.post{position:absolute;top:0;bottom:0;width:3px;background:#fff;box-shadow:0 0 0 1px rgba(0,0,0,.25)} .post::after{content:"";position:absolute;top:-2px;left:-4px;width:11px;height:11px;border-radius:50%;background:#c33;box-shadow:0 0 0 2px #fff}
.call{padding:9px 14px 0;min-height:44px;font-family:var(--serif);font-style:italic;font-weight:600;font-size:16.5px;line-height:1.2}
.res1{display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:12px;background:var(--panel);border:1px solid var(--line)} .res1.win{background:linear-gradient(180deg,#f7ecc9,#efdca6);border-color:var(--gold)}
.pos{flex:none;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-family:var(--serif);font-weight:700;font-size:19px;background:#e4dfd2;color:var(--ink)} .pos.p1{background:var(--gold);color:#fff} .pos.p2,.pos.p3{background:var(--band);color:#fff}
.say{font-family:var(--serif);font-style:italic;font-weight:600;font-size:17px;line-height:1.22;color:#3f3c30;padding-left:12px;border-left:3px solid var(--gold)}
.revs{display:flex;flex-wrap:wrap;gap:6px} .rev{font-size:12px;font-weight:700;padding:4px 9px;border-radius:999px;background:#fff;box-shadow:inset 0 0 0 1.5px var(--gold);animation:pop .5s ease both} .rev i{font-style:normal;font-family:var(--display);font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);margin-right:5px}
@keyframes pop{from{transform:scale(.6);opacity:0}}
.seg{display:flex;border-radius:9px;overflow:hidden;box-shadow:inset 0 0 0 1.5px var(--line);background:#fff} .seg button{flex:1;padding:8px 6px;font-size:12.5px;font-weight:800;text-align:center;color:var(--muted)} .seg button.on{background:var(--green);color:#fff} .seg button.on.sell{background:var(--bad)} .seg button.on.stud{background:#8a5a77}
.steps{display:flex;gap:6px} .steps i{flex:1;height:5px;border-radius:3px;background:#dcd5c4} .steps i.on{background:var(--gold)}
.field{display:flex;flex-direction:column;gap:5px} .field label{font-family:var(--display);font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
input[type=text]{font:inherit;font-weight:700;padding:11px 12px;border-radius:10px;border:1.5px solid var(--line);background:#fff;color:var(--ink);width:100%}
.sw{display:flex;flex-wrap:wrap;gap:7px} .sw button{width:30px;height:30px;border-radius:50%;box-shadow:inset 0 0 0 1.5px rgba(0,0,0,.25)} .sw button.on{box-shadow:0 0 0 2.5px var(--bg),0 0 0 4.5px var(--green)}
.pats{display:flex;flex-wrap:wrap;gap:6px} .pats button{padding:3px;border-radius:9px;box-shadow:inset 0 0 0 1.5px var(--line);background:#fff;line-height:0} .pats button.on{box-shadow:inset 0 0 0 2.5px var(--green)}
.toast{position:absolute;left:16px;right:16px;bottom:128px;z-index:30;background:var(--band-xdk);color:var(--on-dark);padding:11px 14px;border-radius:10px;font-weight:700;font-size:13.5px;text-align:center;box-shadow:0 0 0 1px rgba(232,207,142,.5),0 8px 22px rgba(10,20,16,.4);animation:pop .3s ease both}
.silk{flex:none;display:block}
.cele{text-align:center;display:flex;flex-direction:column;gap:10px;align-items:center;padding:8px 0}
.cele h1{font-size:34px;background:linear-gradient(180deg,var(--gold-hi),#8d6b2a);-webkit-background-clip:text;background-clip:text;color:transparent}
ul.plain{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:4px}
@media (prefers-reduced-motion:reduce){.turf.go,.rev,.toast{animation:none}.prog b{transition:none}}
</style>
</head>
<body>

const revs = r => r && r.length ? `<div class="revs">${r.map((x, i) => `<span class="rev" style="animation-delay:${i * 0.15}s"><i>${x[0]}</i>${esc(x[1])}</span>`).join('')}</div>` : '';

}
const CRAFT = ['Green', 'Learning', 'Nearly there', 'Professional'];

  if (mine.length) h += `<div class="card"><div class="list">${mine.map(({ R, m }) => { const hh = T.horse(m.hid); return `<div class="li"><span class="pos p${m.pos}" style="width:36px;height:36px;font-size:15px">${ord(m.pos)}</span><span class="t"><b>${esc(hh ? hh.n : '')}</b><span>${chip(R.cls)} ${esc(R.big ? R.n : T.fLabel(R.f) + ' ' + R.n)} · ${R.co}</span></span><b class="num sm">${m.prize ? mk(m.prize) : ''}</b></div>`; }).join('')}</div></div>`;
  h += `<div class="card sm"><div class="row sp"><span>Prize money</span><b class="num">${money(prize)}</b></div><div class="row sp"><span>Training fees (${S.horses.length} horse${S.horses.length === 1 ? '' : 's'}${S.mares.length ? ', ' + S.mares.length + ' mare' + (S.mares.length > 1 ? 's' : '') : ''})</span><b class="num">${money(-fees)}</b></div><div class="row sp" style="border-top:1px solid var(--line);margin-top:6px;padding-top:6px"><b>The fortnight</b><b class="num" style="color:${prize - fees >= 0 ? 'var(--good)' : 'var(--bad)'}">${prize - fees >= 0 ? '+' : ''}${money(prize - fees)}</b></div></div>`;
  h += ladder() + goalsCard();
  return bar() + `<main>${h}</main><div class="cta"><button class="btn gold" data-a="next">${last ? 'End of the season ▸' : 'On to ' + T.FN[S.f + 1][0] + ' ▸'}</button></div>`;
}

// ---------------------------------------------------------------- winter
function vWinter() {
  const w = S.w, steps = `<div class="steps">${[0, 1, 2, 3].map(i => `<i class="${i <= w.step ? 'on' : ''}"></i>`).join('')}</div>`; let h = '', cta = '';
  if (w.step === 0) { const r = w.review;
    h = `<div class="hero"><span class="kick">Season ${S.season} · the review</span><h1>${r.wins >= 8 ? 'A fine season' : r.wins >= 3 ? 'A solid season' : r.wins ? 'On the board' : 'A hard season'}</h1><p class="sm">${r.best ? `${esc(r.best.n)} was your best horse${r.best.or ? ', rated ' + r.best.or : ''}.` : ''}</p></div>
      <div class="big3"><div><b>${r.runs}</b><i>Runs</i></div><div><b>${r.wins}</b><i>Wins</i></div><div><b>${mk(r.prize)}</b><i>Prize money</i></div></div>
      <div class="card"><span class="kick">Your goals</span>${S.goals.map((g, i) => `<div class="goal"><span class="tick${r.done[i] ? ' y' : ''}">${r.done[i] ? '✓' : ''}</span><span class="grow"><b>${g.t}</b><br><span class="sm mut">${r.done[i] ? `Done: ${mk(g.cash)} and ${g.rep} reputation` : 'Missed'}</span></span></div>`).join('')}</div>
      <div class="card sm"><div class="row sp"><span>Prize money</span><b class="num">${money(r.prize)}</b></div><div class="row sp"><span>Training fees</span><b class="num">${money(-r.fees)}</b></div>${r.gcash ? `<div class="row sp"><span>Goal rewards</span><b class="num">${money(r.gcash)}</b></div>` : ''}</div>` + ladder();
    cta = `<button class="btn gold" data-a="wStep" data-s="1">Decide who stays ▸</button>`;
  } else if (w.step === 1) { const t = T.T(), arr = T.arriving(), keep = S.horses.filter(x => w.plan[x.id] === 'keep').length + arr.filter(y => w.yplan[y.id] === 'keep').length, over = keep > t.boxes;
    h = `<div class="hero"><span class="kick">Winter · step 1 of 3</span><h2>Who stays in training?</h2><p class="sm">Horses turn a year older on 1 January. Sell the ones that have had their day, and retire the best to stud.</p></div>
      <div class="gal" style="${over ? 'background:#f0d9d5' : ''}"><span class="grow"><b>${keep} of ${t.boxes} boxes filled for next season.</b> ${over ? 'Too many. Sell or retire ' + (keep - t.boxes) + '.' : 'Leave room if you want to buy at the sales.'}</span></div>`;
    for (const x of S.horses) { const p = w.plan[x.id], cs = T.canStud(x), old = x.age >= 7, nextAb = x.age >= (x.mat === 'e' ? 4 : x.mat === 'n' ? 5 : 6);
      const adv = old ? `${He(x)} is ${x.age} and has earned ${his(x)} retirement.` : x.age === 2 ? (x.k.mat >= 1 && x.gs.mat !== 'e' ? `Only two. ${He(x)} should be better next year.` : `Forward for ${his(x)} age. Don't expect a big jump.`) : nextAb ? `Past ${his(x)} peak now. ${He(x)} won't get better.` : x.age === 3 && x.mat !== 'e' ? `Should still improve at four.` : `About as good as ${he(x)} will be.`;
      h += `<div class="card hc"><button class="top" data-a="openHorse" data-h="${x.id}"><span class="age${x.sex === 'f' ? ' f' : ''}"><span>${x.age}<small>YO</small></span></span><span class="grow"><span class="hn">${esc(x.n)}</span><br><span class="sm mut">${x.sr} runs, ${x.hist.filter(q => q.s === S.season && q.pos === 1).length} wins this season · ${mk(x.earn)} career</span></span><span class="or"><b>${x.or == null ? '–' : x.or}</b><i>Rating</i></span></button><p class="note">“${adv}”</p>
        <div class="seg">${old ? '' : `<button data-a="plan" data-h="${x.id}" data-p="keep" class="${p === 'keep' ? 'on' : ''}">Keep</button>`}<button data-a="plan" data-h="${x.id}" data-p="sell" class="sell ${p === 'sell' ? 'on' : ''}">Sell ${mk(T.valueOf(x))}</button>${cs ? `<button data-a="plan" data-h="${x.id}" data-p="stud" class="stud ${p === 'stud' ? 'on' : ''}">${x.sex === 'f' ? 'To stud' : 'Stallion +' + mk(T.studFee(x))}</button>` : ''}</div></div>`; }
    if (arr.length) { h += `<div class="sec">Coming into training <span>your homebreds</span></div>`; for (const y of arr) h += `<div class="card hc"><button class="top" data-a="openHorse" data-h="${y.id}"><span class="age${y.sex === 'f' ? ' f' : ''}"><span>2<small>YO</small></span></span><span class="grow"><span class="hn">${esc(y.n)}</span><br><span class="sm mut">By ${esc(y.sire)} out of ${esc(y.dam)}</span></span></button><div class="seg"><button data-a="yplan" data-h="${y.id}" data-p="keep" class="${w.yplan[y.id] === 'keep' ? 'on' : ''}">Into training</button><button data-a="yplan" data-h="${y.id}" data-p="sell" class="sell ${w.yplan[y.id] === 'sell' ? 'on' : ''}">Sell ${mk(T.yearlingValue(y))}</button></div></div>`; }
    const studF = S.horses.filter(x => w.plan[x.id] === 'stud' && x.sex === 'f').length, padOver = S.mares.length + studF > t.pad;
    if (padOver) h += `<div class="card" style="border-color:var(--bad)"><b style="color:var(--bad)">Not enough paddocks.</b> <span class="sm">You have room for ${t.pad - S.mares.length} more mare${t.pad - S.mares.length === 1 ? '' : 's'}.</span></div>`;
    cta = `<button class="btn ghost" data-a="wStep" data-s="0">Back</button><button class="btn gold" data-a="wStable" ${over || padOver ? 'disabled' : ''}>Confirm ▸</button>`;
  } else if (w.step === 2) { const t = T.T(), free = T.boxesFree();
    h = `<div class="hero"><span class="kick">Winter · step 2 of 3</span><h2>The sales</h2><p class="sm">Yearlings race for you next season as two-year-olds. You only know the pedigree, the look of them, and what your trainer whispers.</p></div>
      ${w.loan ? `<div class="card sm">An old friend has lent you enough to buy one cheap horse and start again.</div>` : ''}
      <div class="gal"><span class="grow"><b>${free} box${free === 1 ? '' : 'es'} free</b> · ${t.pad - S.mares.length} paddock${t.pad - S.mares.length === 1 ? '' : 's'} free · ${money(S.cash)} to spend</span></div>`;
    w.lots.forEach((l, i) => h += lotCard(l, i));
    cta = `<button class="btn gold" data-a="wSaleDone">Leave the sales ▸</button>`;
  } else {
    h = `<div class="hero"><span class="kick">Winter · step 3 of 3</span><h2>The covering season</h2><p class="sm">Choose a stallion for each mare. The foal takes after both parents in class, trip, ground and build. It comes into training the season after next.</p></div>`;
    if (!S.mares.length) h += `<div class="card"><p>You have no broodmares yet.</p><p class="sm mut" style="margin-top:4px">Retire a filly to stud next winter, or buy a mare at the sales. Breeding from your best mares is how champions are made.</p></div>`;
    for (const m of S.mares) { const s = m.cover ? T.sireOf(m.cover) : null; h += `<div class="card hc"><div class="row sp"><span class="hn">${esc(m.n)}</span><span class="sm mut">${m.age}yo mare</span></div><p class="sm">${mareLine(m)}</p><button class="pickb ${s ? 'set' : 'need'}" data-a="openSire" data-m="${m.id}"><span class="t"><b>${s ? 'In foal to ' + esc(s.n) : 'Choose a stallion'}</b><span>${s ? starTxt(s.stars) + ' · ' + (s.fee ? money(s.fee) : 'your own stallion, free') : 'Or leave her empty this year'}</span></span><span class="go">▸</span></button></div>`; }
    cta = `<button class="btn gold" data-a="wStart">Start season ${S.season + 1} ▸</button>`;
  }
  return bar() + `<main>${steps}${h}</main><div class="cta">${cta}</div>`;
}
const LOOKS = ['Small and backward', 'Plain, but a good walker', 'Athletic, with a lovely action', 'A real eyecatcher'], WH = ['“Not for me.”', '“Fine. Nothing special.”', '“I like this one.”', '“I love this one. Don’t lose it.”'];
function lotCard(l, i) {
  const nb = T.nextBid(l); let top, mid;
  if (l.ty === 'm') { const m = l.m; top = `<span class="hn">${esc(m.n)}</span><br><span class="sm mut">Broodmare, ${m.age}yo</span>`; mid = `<p class="sm">${mareLine(m)}</p>`; }
  else { const h = l.h, sire = T.sireOf(h.sire); top = `<span class="hn">${esc(h.n)}</span><br><span class="sm mut">${l.ty === 'y' ? 'Yearling ' + (h.sex === 'f' ? 'filly' : 'colt') : h.age + 'yo in training, rated ' + h.or} · by ${esc(h.sire)} (${starTxt(h.ss)}) out of a ${starTxt(h.ds)} mare</span>`;
    mid = l.ty === 'y' ? `<p class="sm">${LOOKS[h.looks]}. Bred for ${T.tripLabel(h.gs.trip)}${sire ? ', by a sire whose stock like ' + T.groundLabel(sire.gr) : ''}.</p><p class="note">${WH[l.wh]}</p>` : `<p class="sm">${h.runs} runs, ${h.wins} wins. Best at ${T.tripLabel(h.trip)}. ${LAB.con[h.con]}, ${LAB.temp[h.temp].toLowerCase()}.</p><p class="note">“You know what you're getting. Ready to run in the spring.”</p>`; }
  let act;
  if (l.done === 'you') act = `<div class="gal" style="background:#dcebdd"><b>Yours for ${money(l.price)}.</b></div>`;
  else if (l.done) act = `<div class="gal"><span class="mut">Sold to ${esc(l.by)} for ${money(l.price)}.</span></div>`;
  else act = `${l.lead === 'riv' ? `<p class="sm"><b>${esc(l.by)}</b> bids ${money(l.price)}.</p>` : ''}<div class="acts"><button class="btn sm" style="flex:1" data-a="bid" data-i="${i}">Bid ${money(nb)}</button><button class="btn sm ghost" data-a="pass" data-i="${i}">${l.lead ? 'Let it go' : 'Pass'}</button></div>`;
  return `<div class="card hc"><div class="row top"><button class="grow" ${l.ty !== 'm' ? `data-a="openLot" data-i="${i}"` : ''} style="text-align:left">${top}</button><span class="or"><b style="font-size:16px">${mk(l.guide)}</b><i>Guide</i></span></div>${mid}${act}</div>`;
}
function shSire(m) {
  const cur = m.cover, budget = S.cash + (cur ? (T.sireOf(cur) || { fee: 0 }).fee : 0), list = T.sires().slice().sort((a, b) => (a.fee > budget) - (b.fee > budget) || (b.own || 0) - (a.own || 0) || b.stars - a.stars || a.fee - b.fee);
  return shead(`For ${esc(m.n)}`, 'Choose a stallion', `She is ${mareLine(m)}. Stars are class. A sire also passes on his trip, his ground and when his stock mature.`) + `<div class="sh-b"><button class="opt${!cur ? ' on' : ''}" data-a="sire" data-m="${m.id}" data-s=""><span class="l1"><b>Leave her empty this year</b></span></button>
    ${list.map(s => `<button class="opt${cur === s.n ? ' on' : ''}" data-a="sire" data-m="${m.id}" data-s="${esc(s.n)}" ${s.fee > budget ? 'disabled style="opacity:.45"' : ''}><span class="l1"><b>${esc(s.n)}</b><span class="stars" style="--lo:${s.stars * 20}%;--hi:${s.stars * 20}%">★★★★★</span></span><span class="l2">${T.tripLabel(s.opt)} · ${T.groundLabel(s.gr)} · stock mature ${{ e: 'early', n: 'at three', l: 'late' }[s.peak]} · <b>${s.own ? 'yours, free' : money(s.fee)}</b></span></button>`).join('')}</div>`;
}

// ---------------------------------------------------------------- taps
const A = {
  tab(d) { UI.tab = d.t; UI.reset = false; render(); },
  close() { UI.sheet = null; if (S && T.tier() > S.seenTier && S.phase !== 'raceday') { S.seenTier = T.tier(); save(); } render(true); },
  col(d) { const sp = UI.setup.silk; sp[d.k] = d.c; if (d.k === 'b2') sp.c = d.c; grabName(); render(true); },
  pat(d) { UI.setup.silk.p = d.p; grabName(); render(true); },
  start() { grabName(); const u = UI.setup; T.newGame({ stable: u.name.trim() || 'Warren Hill Stud', silk: u.silk }); UI.tab = 'yard'; save(); render(); },
  tipOk() { S.tips.intro = 1; save(); render(true); },
  openEntry(d) { UI.sheet = { t: 'entry', h: +d.h }; render(true); },
  showAll() { UI.sheet.all = 1; render(true); },
  pick(d) { T.enter(+d.h, d.r === '' ? null : +d.r); save(); if (!d.stay) UI.sheet = null; render(true); },
  openGallop(d) { UI.sheet = { t: 'gallop', h: +d.h }; render(true); },
  gallop(d) { const h = T.horse(+d.h), r = T.gallop(+d.h, d.g); if (!r) return; save(); UI.sheet = { t: 'msg', k: 'From the gallops', title: h.n, say: r.text, rev: r.rev }; render(true); },
  openHorse(d) { UI.sheet = { t: 'horse', h: +d.h, tile: 'trip' }; render(true); },
  openLot(d) { UI.sheet = { t: 'horse', lot: +d.i, tile: 'trip' }; render(true); },
  tile(d) { UI.sheet.tile = d.k; render(true); },
  rename(d) { const el = document.getElementById('rename'), v = el && el.value.trim(); if (v) { T.horse(+d.h).n = v.slice(0, 20); save(); toast('Renamed.'); render(true); } },
  sell(d) { if (!UI.sheet.sell) { UI.sheet.sell = 1; render(true); return; } const h = T.horse(+d.h), v = T.sell(h.id); UI.sheet = null; save(); toast(`${h.n} sold for ${money(v)}.`); render(true); },
  race(d) { UI.sheet = { t: 'race', r: +d.r }; render(true); },
  auto() { const n = T.autoEnter(); save(); toast(n ? `Your trainer entered ${n} horse${n > 1 ? 's' : ''}.` : 'Your trainer sees nothing worth running in.'); render(true); },
  go() { T.goRacing(); UI.rd = { stage: 'card' }; UI.sheet = null; save(); render(); },
  rdWatch() { UI.rd.stage = 'run'; render(); },
  rdResult() { UI.rd.stage = 'result'; render(); },
  rdNext() { const rd = S.rd; if (rd.i < rd.res.length - 1) { rd.i++; UI.rd = { stage: 'card' }; } else { S.phase = 'summary'; UI.rd = null; tierCheck(); } save(); render(); },
  rdAll() { S.phase = 'summary'; UI.rd = null; tierCheck(); save(); render(); },
  next() { T.endFortnight(); S = T.S; UI.tab = 'yard'; UI.sheet = null; if (S.phase === 'winter') tierCheck(); save(); render(); },
  toWinter() { T.skipToWinter(); S = T.S; UI.sheet = null; tierCheck(); save(); render(); },
  wStep(d) { S.w.step = +d.s; save(); render(); },
  plan(d) { S.w.plan[+d.h] = d.p; save(); render(true); },
  yplan(d) { S.w.yplan[+d.h] = d.p; save(); render(true); },
  wStable() { T.applyStable(); save(); render(); },
  openSire(d) { UI.sheet = { t: 'sire', m: +d.m }; render(true); },
  sire(d) { if (!T.setCover(+d.m, d.s || null)) toast('You can’t afford that fee.'); UI.sheet = null; save(); render(true); },
  wSaleDone() { T.closeSale(); save(); render(); },
  bid(d) { const i = +d.i, l = S.w.lots[i], r = T.bid(i); save(); if (r === 'cash') toast('You can’t afford the next bid.'); else if (r === 'full') toast(l.ty === 'm' ? 'No paddock free for another mare.' : 'No box free. Your yard is full.'); else if (r === 'won') toast(`Sold! ${l.ty === 'm' ? l.m.n : l.h.n} is yours.`); render(true); },
  pass(d) { T.pass(+d.i); save(); render(true); },
  wStart() { T.startSeason(); UI.tab = 'yard'; save(); render(); },
  reset() { if (!UI.reset) { UI.reset = true; render(true); return; } try { localStorage.removeItem(KEY); } catch (e) { } UI.reset = false; UI.setup = null; UI.sheet = null; T.use(null); render(); }
};
function tierCheck() { if (T.tier() > S.seenTier) UI.sheet = { t: 'tier' }; }
function grabName() { const el = document.getElementById('sname'); if (el && UI.setup) UI.setup.name = el.value; }
app.addEventListener('click', e => { const el = e.target.closest('[data-a]'); if (!el) { if (e.target.classList.contains('veil')) A.close(); return; } if (el.disabled) return; const f = A[el.dataset.a]; if (f) f(el.dataset, el); });
app.addEventListener('input', e => { if (e.target.id === 'sname') UI.setup.name = e.target.value; });
load(); render();
window.TBUI = { UI, render, A };
})();
</script>
