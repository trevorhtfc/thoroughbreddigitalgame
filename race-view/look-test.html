<meta charset="utf-8">
<title>Ascot Look Test</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500;600&family=Cormorant+SC:wght@600;700&display=swap">
<style>
/* Look test for the race view: the Ascot home straight, built from courses/ascot-home-straight.json,
   with the illustrated heritage finish. Panels use the board's cream, bottle green and gold. */
:root {
  --cream: #f4ead2;
  --cream-edge: #b8954a;
  --green: #1f5a38;
  --green-ink: #183f2a;
  --ink-soft: #4f5d4a;
  --display: "Cormorant SC", "Times New Roman", serif;
  --body: "Jost", "Helvetica Neue", Arial, sans-serif;
  color-scheme: light;
}
[hidden] { display: none !important; }
html, body { height: 100%; margin: 0; }
body { background: #5f8a44; color: var(--green-ink); font-family: var(--body); overflow: hidden; }
#scene { position: fixed; inset: 0; display: block; width: 100%; height: 100%; }

.plate {
  position: fixed;
  top: calc(env(safe-area-inset-top, 0px) + 14px);
  left: max(16px, env(safe-area-inset-left, 0px));
  background: var(--cream);
  border: 1px solid var(--cream-edge);
  box-shadow: 0 0 0 3px var(--cream), 0 0 0 4px var(--cream-edge), 0 6px 18px rgba(40, 40, 20, 0.25);
  border-radius: 3px;
  padding: 8px 16px 9px;
  display: flex; gap: 18px; align-items: center;
}
.plate h1 { margin: 0; font-family: var(--display); font-size: 1.45rem; letter-spacing: 0.08em; color: var(--green); line-height: 1; }
.plate p { margin: 2px 0 0; font-size: 0.78rem; letter-spacing: 0.04em; color: var(--ink-soft); }
.plate .togo { text-align: right; border-left: 1px solid rgba(184, 149, 74, 0.6); padding-left: 16px; }
.plate .togo strong { display: block; font-family: var(--display); font-size: 1.35rem; color: var(--green); line-height: 1; font-variant-numeric: tabular-nums; }
.plate .togo span { font-size: 0.7rem; letter-spacing: 0.12em; text-transform: uppercase; color: var(--ink-soft); }

.bar {
  position: fixed; left: 50%; transform: translateX(-50%);
  bottom: calc(env(safe-area-inset-bottom, 0px) + 14px);
  max-width: calc(100% - 32px);
  background: var(--cream);
  border: 1px solid var(--cream-edge);
  border-radius: 3px;
  box-shadow: 0 6px 18px rgba(40, 40, 20, 0.25);
  padding: 6px 8px;
  display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: center; justify-content: center;
}
.group { display: flex; gap: 4px; align-items: center; }
.group > span { font-size: 0.68rem; letter-spacing: 0.12em; text-transform: uppercase; color: var(--ink-soft); margin-right: 2px; }
button {
  font: 500 0.82rem var(--body); color: var(--green-ink); cursor: pointer;
  background: transparent; border: 1px solid rgba(31, 90, 56, 0.35); border-radius: 3px; padding: 5px 9px;
}
button[aria-pressed="true"] { background: var(--green); color: var(--cream); border-color: var(--green); }
button:focus-visible { outline: 2px solid var(--cream-edge); outline-offset: 2px; }
.fps { font-variant-numeric: tabular-nums; font-size: 0.75rem; opacity: 0.8; min-width: 6.5em; }
.diag {
  position: fixed; top: 10px; right: 10px; z-index: 5; max-width: 360px; padding: 8px 10px;
  background: rgba(20, 30, 22, 0.86); color: #f3ead2; border-radius: 3px; font: 12px/1.45 ui-monospace, Menlo, monospace;
}
.diag #diagText { white-space: pre-wrap; }
.diag-sw { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px; }
.diag-sw button { font-size: 0.72rem; padding: 3px 6px; }
.loading {
  position: fixed; inset: 0; display: grid; place-items: center; pointer-events: none;
  font-family: var(--display); font-size: 1.4rem; letter-spacing: 0.1em; color: var(--cream);
  text-shadow: 0 1px 3px rgba(0, 0, 0, 0.4);
}
@media (max-width: 600px) {
  .plate { padding: 6px 12px; gap: 12px; }
  .plate h1 { font-size: 1.15rem; }
  .plate p { display: none; }
  .bar { gap: 4px 10px; padding: 5px 6px; }
  .group > span { display: none; }
  button { padding: 5px 7px; font-size: 0.78rem; }
}
</style>

<canvas id="scene"></canvas>
<div class="loading" id="loading">Setting up the course…</div>

<div class="plate">
  <div>
    <h1>Thoroughbred</h1>

  </div>
  <div class="togo"><strong id="toRun">5f</strong><span>to run</span></div>
</div>

<div class="bar">

  <div class="group"><button id="pause" type="button" aria-pressed="false">Pause</button><button id="restart" type="button">Restart</button></div>
</div>

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
} }
</script>
<script type="module">
import * as THREE from "three";
import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";
import * as SkeletonUtils from "three/addons/utils/SkeletonUtils.js";
import { RoomEnvironment } from "three/addons/environments/RoomEnvironment.js";

const params = new URLSearchParams(location.search);

// ---------- Data (all engine-neutral files) ----------
const COURSE = await fetch("assets/course/ascot-home-straight.json").then((r) => r.json());
const SILK_DATA = await fetch("assets/silks-catalogue.json").then((r) => r.json());
const SILKS = SILK_DATA.silks;
const COATS = [
  { name: "Bay",      body: "#7a4a2a", points: "#1d1714" },
  { name: "Brown",    body: "#4a2e1c", points: "#17110d" },
  { name: "Chestnut", body: "#a3552c", points: "#6a3317" },
  { name: "Black",    body: "#2b2523", points: "#141110" },
  { name: "Grey",     body: "#a8a6a0", points: "#6d6b66" },
];
document.getElementById("courseName").textContent = COURSE.name;

const FURLONG = 201.17;
const STRIDE_SPEED = 14.6;   // m/s at which the gallop loop matches the ground at scale 3
const HORSE_SCALE = 3;
const T = COURSE.track;
const HALF_W = T.width / 2;
const X0 = T.centreLine[0][0], X1 = T.centreLine[T.centreLine.length - 1][0];
const POST = COURSE.winningPost.at;

// ---------- Renderer ----------
const canvas = document.getElementById("scene");
const renderer = new THREE.WebGLRenderer({ canvas, antialias: false, powerPreference: "high-performance", preserveDrawingBuffer: params.has("still") });
renderer.info.autoReset = false;
const LAYERS = { horses: [], trees: [], rails: [], kick: [] };   // for the diagnostics panel
renderer.shadowMap.enabled = true;

// Quality presets. Most of the cost is filling pixels: a Retina Mac at full resolution draws four
// times the pixels of a normal screen, each multisampled and shadowed. "Auto" starts at Medium on
// high-resolution screens (High elsewhere) and steps down by itself if the frame rate drops.
const DPR = window.devicePixelRatio || 1;
const QUALITY = {
  high:   { label: "High",   scale: Math.min(DPR, 2),    samples: 4, shadow: 4096, soft: true,  kick: 1,    edges: true, shadowEvery: 1 },
  medium: { label: "Medium", scale: Math.min(DPR, 1.25), samples: 2, shadow: 2048, soft: false, kick: 0.6,  edges: true, shadowEvery: 1 },
  low:    { label: "Low",    scale: Math.min(DPR, 1),    samples: 0, shadow: 1024, soft: false, kick: 0.35, edges: false, shadowEvery: 2 },
};
const ORDER = ["high", "medium", "low"];
let qMode = params.get("quality") || (() => { try { return localStorage.getItem("tb-quality"); } catch { return null; } })() || "auto";
if (qMode !== "auto" && !QUALITY[qMode]) qMode = "auto";
let qLevel = qMode === "auto" ? (DPR > 1.5 ? "medium" : "high") : qMode;
renderer.shadowMap.type = QUALITY[qLevel].soft ? THREE.PCFSoftShadowMap : THREE.PCFShadowMap;
renderer.setPixelRatio(QUALITY[qLevel].scale);
const KICK = { perSecond: 26, maxClods: 1600, share: QUALITY[qLevel].kick };   // turf kick-back

const scene = new THREE.Scene();
const HAZE = new THREE.Color("#d8d7b8");
scene.fog = new THREE.Fog(HAZE, 260, 1500);

// Sky: warm afternoon gradient.
{
  const mat = new THREE.ShaderMaterial({
    side: THREE.BackSide, depthWrite: false, fog: false,
    uniforms: { top: { value: new THREE.Color("#8fb0c8") }, horizon: { value: new THREE.Color("#efe3c2") } },
    vertexShader: "varying vec3 vP; void main(){ vP = normalize(position); gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }",
    fragmentShader: "uniform vec3 top; uniform vec3 horizon; varying vec3 vP; void main(){ float h = clamp(vP.y*2.0, 0.0, 1.0); gl_FragColor = vec4(mix(horizon, top, pow(h,0.8)), 1.0); }",
  });
  const sky = new THREE.Mesh(new THREE.SphereGeometry(2500, 32, 16), mat);
  scene.add(sky);
  scene.userData.sky = sky;
}

// Light: warm late-afternoon sun from behind the stands side, long soft shadows away from the camera,
// a cool fill from the far side to model the horses, and a soft studio reflection for sheen on coats and rails.
scene.add(new THREE.HemisphereLight("#fff0cf", "#566f36", 0.9));
const sun = new THREE.DirectionalLight("#ffd9a0", 3.2);
sun.castShadow = true;
sun.shadow.mapSize.set(QUALITY[qLevel].shadow, QUALITY[qLevel].shadow);
sun.shadow.radius = 3;
Object.assign(sun.shadow.camera, { left: -45, right: 45, top: 45, bottom: -45, near: 1, far: 300 });
const fill = new THREE.DirectionalLight("#c9dcff", 0.55);
fill.position.set(40, 30, -60);
scene.add(fill);
{
  const pm = new THREE.PMREMGenerator(renderer);
  scene.environment = pm.fromScene(new RoomEnvironment(), 0.04).texture;
  scene.environmentIntensity = 0.35;
}
sun.shadow.bias = -0.0005;
sun.shadow.normalBias = 0.03;
scene.add(sun, sun.target);
const SUN_OFFSET = new THREE.Vector3(-55, 80, 60);

// ---------- Textures ----------
// Count textures still loading, so ?still=1 screenshots wait for every image.
let texturesPending = 0;
const texLoader = new THREE.TextureLoader();
const _load = texLoader.load.bind(texLoader);
texLoader.load = (url, onLoad, onProgress, onError) => {
  texturesPending++;
  return _load(url, (t) => { texturesPending--; onLoad && onLoad(t); }, onProgress, (e) => { texturesPending--; onError && onError(e); });
};
function tex(name, repeatX = 1, repeatY = 1) {
  const t = texLoader.load(`assets/course/${name}.jpg`);
  t.colorSpace = THREE.SRGBColorSpace;
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.repeat.set(repeatX, repeatY);
  t.anisotropy = renderer.capabilities.getMaxAnisotropy();
  return t;
}

// ---------- Ground, turf, paths ----------
{
  const G = COURSE.ground;
  const ground = new THREE.Mesh(new THREE.PlaneGeometry(G.size, G.size), new THREE.MeshLambertMaterial({ map: tex(G.texture, G.size / G.tileSize, G.size / G.tileSize) }));
  ground.rotation.x = -Math.PI / 2;
  ground.position.set((X0 + X1) / 2, 0, 0);
  ground.receiveShadow = true;
  scene.add(ground);

  const len = X1 - X0;
  const turf = new THREE.Mesh(new THREE.PlaneGeometry(len, T.width), new THREE.MeshLambertMaterial({ map: tex(T.turfTexture, len / T.turfTileLength, 1) }));
  turf.rotation.x = -Math.PI / 2;
  turf.position.set((X0 + X1) / 2, 0.02, 0);
  turf.receiveShadow = true;
  scene.add(turf);

  for (const p of COURSE.paths) {
    const [ax, az] = p.from, [bx, bz] = p.to;
    const L = Math.hypot(bx - ax, bz - az);
    const m = new THREE.Mesh(new THREE.PlaneGeometry(L, p.width), new THREE.MeshLambertMaterial({ map: tex(p.texture, L / 12, p.width / 12) }));
    m.rotation.x = -Math.PI / 2;
    m.rotation.z = -Math.atan2(bz - az, bx - ax);
    m.position.set((ax + bx) / 2, 0.015, (az + bz) / 2);
    m.receiveShadow = true;
    scene.add(m);
  }
}

// Soft round shadow, used under trees and horses.
const shadowTex = (() => {
  const sc = document.createElement("canvas"); sc.width = sc.height = 128;
  const g = sc.getContext("2d");
  const grad = g.createRadialGradient(64, 64, 4, 64, 64, 62);
  grad.addColorStop(0, "rgba(0,0,0,1)"); grad.addColorStop(0.6, "rgba(0,0,0,0.75)"); grad.addColorStop(1, "rgba(0,0,0,0)");
  g.fillStyle = grad; g.fillRect(0, 0, 128, 128);
  return new THREE.CanvasTexture(sc);
})();

// ---------- Trees: painted cut-outs that turn to face the camera ----------
function seeded(seed) { let s = seed >>> 0; return () => ((s = (s * 1664525 + 1013904223) >>> 0) / 4294967296); }
{
  const rnd = seeded(11);
  const spots = [];
  for (const row of COURSE.trees) {
    const [ax, az] = row.from, [bx, bz] = row.to;
    const L = Math.hypot(bx - ax, bz - az);
    // Clumps of one to a few trees, with gaps, so the line never looks planted in rows.
    const [cMin, cMax] = row.clump || [1, 1];
    for (let r = 0; r < (row.rows || 1); r++) {
      for (let d = 0; d < L; d += row.spacing * (0.7 + rnd() * 0.6)) {
        if (rnd() < (row.skip || 0)) continue;
        const t = d / L;
        const away = Math.sign(az) * r * (row.rowGap || 0);
        const cx = ax + (bx - ax) * t + (rnd() - 0.5) * 2 * row.jitter[0];
        const cz = az + (bz - az) * t + away + (rnd() - 0.5) * 2 * row.jitter[1];
        const n = cMin + Math.floor(rnd() * (cMax - cMin + 1));
        for (let k = 0; k < n; k++) {
          spots.push({
            x: cx + (k ? (rnd() - 0.5) * 16 : 0),
            z: cz + (k ? (rnd() - 0.5) * 8 * Math.sign(az) - Math.sign(az) * 3 : 0),
            h: row.height[0] + rnd() * (row.height[1] - row.height[0]),
            kind: Math.floor(rnd() * 4),
          });
        }
      }
    }
  }
  const atlas = texLoader.load("assets/course/trees.png");
  atlas.colorSpace = THREE.SRGBColorSpace;
  atlas.anisotropy = 8;
  const geo = new THREE.PlaneGeometry(1, 1).translate(0, 0.5, 0);
  const kind = new Float32Array(spots.length);
  const size = new Float32Array(spots.length * 2);
  spots.forEach((s, i) => { kind[i] = s.kind; size[i * 2] = s.h * (s.kind === 3 ? 1.0 : 1.0); size[i * 2 + 1] = s.h; });
  geo.setAttribute("aKind", new THREE.InstancedBufferAttribute(kind, 1));
  geo.setAttribute("aSize", new THREE.InstancedBufferAttribute(size, 2));
  const mat = new THREE.ShaderMaterial({
    uniforms: { atlas: { value: atlas }, fogColor: { value: HAZE }, fogNear: { value: scene.fog.near }, fogFar: { value: scene.fog.far }, bright: { value: 1.3 } },
    vertexShader: `
      attribute float aKind; attribute vec2 aSize;
      varying vec2 vUv; varying float vDepth;
      void main() {
        vec3 c = (instanceMatrix * vec4(0.0, 0.0, 0.0, 1.0)).xyz;
        vec3 right = vec3(viewMatrix[0][0], viewMatrix[1][0], viewMatrix[2][0]);
        right.y = 0.0; right = normalize(right);
        vec3 p = c + right * position.x * aSize.x + vec3(0.0, position.y * aSize.y, 0.0);
        vUv = vec2((uv.x + aKind) / 4.0, uv.y);
        vec4 mv = viewMatrix * vec4(p, 1.0);
        vDepth = -mv.z;
        gl_Position = projectionMatrix * mv;
      }`,
    fragmentShader: `
      uniform sampler2D atlas; uniform vec3 fogColor; uniform float fogNear, fogFar, bright;
      varying vec2 vUv; varying float vDepth;
      void main() {
        vec4 c = texture2D(atlas, vUv);
        if (c.a < 0.5) discard;
        vec3 col = c.rgb * bright;
        col = mix(col, fogColor, smoothstep(fogNear, fogFar, vDepth));
        gl_FragColor = vec4(col, 1.0);
      }`,
  });
  const trees = new THREE.InstancedMesh(geo, mat, spots.length);
  const shadowGeo = new THREE.PlaneGeometry(1, 1);
  const shadows = new THREE.InstancedMesh(shadowGeo, new THREE.MeshBasicMaterial({ map: shadowTex, color: "#1f3318", transparent: true, opacity: 0.5, depthWrite: false }), spots.length);
  shadows.frustumCulled = false;
  const m = new THREE.Matrix4(), q = new THREE.Quaternion(), s = new THREE.Vector3(), p = new THREE.Vector3();
  const sunFlat = new THREE.Vector2(-SUN_OFFSET.x, -SUN_OFFSET.z).normalize();   // shadows fall away from the sun
  const ang = Math.atan2(sunFlat.y, sunFlat.x);
  spots.forEach((t, i) => {
    m.makeTranslation(t.x, 0, t.z); trees.setMatrixAt(i, m);
    const reach = t.h * 0.55;
    p.set(t.x + sunFlat.x * reach * 0.6, 0.03, t.z + sunFlat.y * reach * 0.6);
    q.setFromEuler(new THREE.Euler(-Math.PI / 2, 0, -ang, "YXZ"));
    s.set(t.h * 1.05, t.h * 0.6, 1);
    m.compose(p, q, s); shadows.setMatrixAt(i, m);
  });
  trees.frustumCulled = false;
  scene.add(shadows, trees);
  LAYERS.trees.push(shadows, trees);

  // Woodland: long painted strips of trees behind the course, one quad each (cheap to draw).
  for (const w of COURSE.woodland || []) {
    const t = texLoader.load(`assets/course/${w.texture}.png`);
    t.colorSpace = THREE.SRGBColorSpace;
    t.wrapS = THREE.RepeatWrapping;
    t.anisotropy = 8;
    // A zig-zag ribbon rather than a flat wall: the line wanders in and out every 40 m or so,
    // so it has depth from the side and never lies flat to a camera looking down the course.
    const tile = w.height * (w.aspect || 6.4);           // keep the painting's proportions
    const wr = seeded(Math.round(w.z * 7 + 3));
    const pos = [], uv = [], idx = [];
    let u = w.offset || 0, prev = null;
    for (let x = w.from, i = 0; x <= w.to; x += 34 + wr() * 18, i++) {
      const z = w.z + (wr() - 0.5) * 2 * (w.wander ?? 14);
      if (prev) u += Math.hypot(x - prev[0], z - prev[1]) / tile;
      pos.push(x, 0, z, x, w.height, z); uv.push(u, 0, u, 1);
      if (i) { const k = i * 2; idx.push(k - 2, k, k - 1, k - 1, k, k + 1); }
      prev = [x, z];
    }
    const geo = new THREE.BufferGeometry();
    geo.setAttribute("position", new THREE.Float32BufferAttribute(pos, 3));
    geo.setAttribute("uv", new THREE.Float32BufferAttribute(uv, 2));
    geo.setIndex(idx);
    const strip = new THREE.Mesh(geo,
      new THREE.MeshBasicMaterial({ map: t, alphaTest: 0.5, side: THREE.DoubleSide, color: new THREE.Color(1.1, 1.1, 1.06) }));
    scene.add(strip);
    LAYERS.trees.push(strip);
  }
}

// ---------- Models (glTF, repackaged for the web host) ----------
const loader = new GLTFLoader();
async function loadModel(dir, name) {
  const [json, b64] = await Promise.all([
    fetch(`${dir}/${name}.json`).then((r) => { if (!r.ok) throw new Error(name + " " + r.status); return r.text(); }),
    fetch(`${dir}/${name}-geometry.txt`).then((r) => { if (!r.ok) throw new Error(name + " geometry " + r.status); return r.text(); }),
  ]);
  const raw = atob(b64.trim());
  const bin = new Uint8Array(raw.length);
  for (let i = 0; i < raw.length; i++) bin[i] = raw.charCodeAt(i);
  const pad = (n) => (n + 3) & ~3;
  const jsonBytes = new TextEncoder().encode(json);
  const jLen = pad(jsonBytes.length), bLen = pad(bin.length);
  const glb = new Uint8Array(12 + 8 + jLen + 8 + bLen);
  const dv = new DataView(glb.buffer);
  dv.setUint32(0, 0x46546c67, true); dv.setUint32(4, 2, true); dv.setUint32(8, glb.length, true);
  dv.setUint32(12, jLen, true); dv.setUint32(16, 0x4e4f534a, true);
  glb.fill(0x20, 20, 20 + jLen); glb.set(jsonBytes, 20);
  const b0 = 20 + jLen;
  dv.setUint32(b0, bLen, true); dv.setUint32(b0 + 4, 0x004e4942, true);
  glb.set(bin, b0 + 8);
  return new Promise((resolve, reject) => loader.parse(glb.buffer, dir + "/", resolve, reject));
}

// ---------- Course furniture from Blender ----------
function placeProps(gltf) {
  const byName = (n) => gltf.scene.getObjectByName(n);
  gltf.scene.traverse((o) => { if (o.isMesh) { o.castShadow = true; o.receiveShadow = true; o.material.roughness = 0.6; } });
  // Rails: one instanced module repeated along both sides.
  const R = COURSE.rails;
  const parts = [];
  byName(R.model).traverse((o) => { if (o.isMesh) parts.push(o); });
  const count = Math.ceil((X1 - X0) / R.spacing);
  const m = new THREE.Matrix4(), rot = new THREE.Matrix4().makeRotationY(Math.PI);
  for (const side of R.sides) {
    const z = (HALF_W + R.gap) * (side === "near" ? 1 : -1);
    // In 60 m lengths, so the rail out of shot (and outside the shadow area) isn't drawn at all.
    const CHUNK = 20;
    for (const part of parts) {
      for (let c0 = 0; c0 < count; c0 += CHUNK) {
        const n = Math.min(CHUNK, count - c0);
        const rails = new THREE.InstancedMesh(part.geometry, part.material, n);
        for (let i = 0; i < n; i++) {
          const x = X0 + (c0 + i) * R.spacing;
          if (side === "near") m.makeTranslation(x, 0, z);
          else m.makeTranslation(x + R.spacing, 0, z).multiply(rot);
          rails.setMatrixAt(i, m);
        }
        rails.computeBoundingSphere();
        rails.castShadow = rails.receiveShadow = true;
        scene.add(rails);
        LAYERS.rails.push(rails);
      }
    }
  }
  const sideZ = (side) => (HALF_W + R.gap + 0.7) * (side === "near" ? 1 : -1);
  const wp = byName(COURSE.winningPost.model).clone();
  wp.position.set(POST, 0, sideZ(COURSE.winningPost.side));
  scene.add(wp);
  for (const f of COURSE.furlongPoles.furlongs) {
    const pole = byName(COURSE.furlongPoles.modelPrefix + f).clone();
    pole.position.set(POST - f * FURLONG, 0, sideZ(COURSE.furlongPoles.side));
    scene.add(pole);
  }
}

// ---------- Horses ----------
const silkTextures = new Map();
function silkTexture(id) {
  if (!silkTextures.has(id)) {
    const t = texLoader.load(`assets/silks-3d/${id}.png`);

// ---------- Placeholder race ----------
// The real race sim will hand the viewer a timeline (each horse's distance, lateral position and effort
// over time); this stand-in makes one so the look test has a field to film. The steering below is the
// kind of thing the real sim's timeline should include: horses drift into groups, tuck in behind
// another horse, pull out to pass when they're stuck, keep a body's width apart and wander a little.
// Each frame: [x, z, speed, effort 0..2, heading].
function placeholderTimeline(n, seed) {
  const rnd = seeded(seed);
  const dt = 0.1, out = [];
  const limit = HALF_W - 1.2;
  const nGroups = n > 9 ? 3 : 2;
  const groupBase = Array.from({ length: nGroups }, (_, g) => -limit * 0.7 + (g + 0.5) * (limit * 1.4 / nGroups));
  const horses = Array.from({ length: n }, (_, i) => {
    const stall = -limit + 0.5 + i * ((2 * limit - 1) / Math.max(1, n - 1));
    let g = 0, best = 1e9;
    groupBase.forEach((c, k) => { const dd = Math.abs(c - stall); if (dd < best) { best = dd; g = k; } });
    return {
      base: 16.1 + rnd() * 0.6, kick: 0.5 + rnd() * 1.0, kickAt: 220 + rnd() * 240,
      x: rnd() * 1.2, z: stall, v: 0, vz: 0, group: g,
      wp: rnd() * 6.28, wf: 0.25 + rnd() * 0.35, surge: rnd() * 6.28,
    };
  });
  for (let t = 0; t <= 90; t += dt) {
    // Group centres drift slowly, so the bunches breathe across the course.
    const centres = groupBase.map((c, k) => c + Math.sin(t * 0.07 + k * 2.1) * 2.5);
    const frame = horses.map((h) => {
      const toGo = POST - h.x;
      const past = toGo < 0;
      let want = past ? 6 : h.base + (toGo < h.kickAt ? h.kick : 0) + Math.sin(t * 0.4 + h.surge) * 0.15;
      // Who is just in front, and is there room either side?
      let blocker = null, leftCrowd = 0, rightCrowd = 0;
      for (const o of horses) {
        if (o === h) continue;
        const dx = o.x - h.x, dz = o.z - h.z;
        if (dx > 0 && dx < 4.5 && Math.abs(dz) < 1.3 && (!blocker || dx < blocker.x - h.x)) blocker = o;
        if (Math.abs(dx) < 6) { if (dz > 0 && dz < 3) rightCrowd++; if (dz < 0 && dz > -3) leftCrowd++; }
      }
      let az = (centres[h.group] - h.z) * 0.12;                          // drift towards its group
      az += Math.sin(t * h.wf + h.wp) * 0.25;                           // a little wander
      const kicking = toGo < h.kickAt;
      if (blocker && want > blocker.v) {
        if (kicking) az += (leftCrowd <= rightCrowd ? -1 : 1) * 1.6;    // stuck: pull out to pass
        else want = Math.min(want, blocker.v + 0.05);                   // otherwise sit in behind
      }
      for (const o of horses) {                                         // keep a body's width apart
        if (o === h) continue;
        const dx = o.x - h.x, dz = h.z - o.z;
        if (Math.abs(dx) < 3.4 && Math.abs(dz) < 1.7) az += Math.sign(dz || (rnd() - 0.5)) * (1.7 - Math.abs(dz)) * 2.2;
      }
      if (!kicking && !past) {                                          // tuck in behind the horse ahead
        let lead = null;
        for (const o of horses) { const dx = o.x - h.x; if (o !== h && dx > 3 && dx < 9 && Math.abs(o.z - h.z) < 2.5 && (!lead || dx < lead.x - h.x)) lead = o; }
        if (lead) az += (lead.z - h.z) * 0.3;
      }
      if (h.z > limit - 0.5) az -= (h.z - limit + 0.5) * 4;            // stay off the rails
      if (h.z < -limit + 0.5) az += (-limit + 0.5 - h.z) * 4;
      h.vz = THREE.MathUtils.clamp((h.vz + az * dt) * 0.9, -1.3, 1.3);
      h.v += Math.sign(want - h.v) * Math.min(Math.abs(want - h.v), (h.v < 8 ? 6 : 1.4) * dt);
      h.x += h.v * dt;
      h.z += h.vz * dt;
      const effort = past ? 0 : toGo < h.kickAt * 0.55 ? 2 : kicking ? 1 : 0;
      return [h.x, h.z, h.v, effort, Math.atan2(h.vz, Math.max(h.v, 1))];
    });
    out.push(frame);
  }
  return { dt, frames: out };
}

  });
  clods.count = live.length;
  clods.instanceMatrix.needsUpdate = true;
  if (clods.instanceColor) clods.instanceColor.needsUpdate = true;
}

function sample(t) {
  const f = t / timeline.dt;
  const i = Math.min(Math.floor(f), timeline.frames.length - 2), k = Math.min(1, f - i);
  return timeline.frames[i].map((a, j) => { const b = timeline.frames[i + 1][j]; return a.map((v, n) => v + (b[n] - v) * k); });
}

// ---------- Loop ----------
const toRunEl = document.getElementById("toRun"), toRunLabel = document.querySelector(".togo span");
const clock = new THREE.Clock();
let framesDrawn = 0, stillFrames = 0, kickWarm = false;
function frame() {
  const t0 = performance.now();
  const rawDt = clock.getDelta();
  const dt = Math.min(rawDt, 0.05);
  if (runners.length && !params.has("still")) perf.tick(rawDt);
  if (!state.paused) { state.t += dt; if (state.t > 75) { state.t = 0; snap = true; } }
  const now = sample(state.t);
  let leader = -1e9, sum = 0;
  runners.forEach((r, i) => {
    const [x, z, v, eff, yaw] = now[i];
    r.obj.position.set(x, 0, z);
    r.obj.rotation.y = -yaw;
    _p.set(x - 0.15, 0.04, z); _q.setFromEuler(_e.set(-Math.PI / 2, 0, -yaw, "YXZ")); _s.set(3.0, 1.05, 1);
    contact.setMatrixAt(i, _m.compose(_p, _q, _s));
    r.effort += (eff - r.effort) * Math.min(1, dt * 2);
    const set = (n, w) => r.actions[n] && r.actions[n].setEffectiveWeight(w);
    const e = r.effort;
    set("ride_quiet", Math.max(0, 1 - e)); set("ride_push", e <= 1 ? e : 2 - e); set("ride_drive", Math.max(0, e - 1));
    set("gallop", 1 - e / 4); set("gallop_drive", e / 4);
    r.mixer.timeScale = THREE.MathUtils.clamp(v / STRIDE_SPEED, 0.25, 1.4);
    r.mixer.update(state.paused ? 0 : dt);
    leader = Math.max(leader, x); sum += x;
  });
  if (!runners.length) leader = 0;
  contact.count = runners.length; contact.instanceMatrix.needsUpdate = true;
  if (runners.length) {
    if (!kickWarm) {                     // jumping into the middle of a race: let the air fill with clods first
      kickWarm = true;
      for (let k = 30; k > 0; k--) stepKick(1 / 30, sample(Math.max(0, state.t - k / 30)));
    }
    if (!state.paused) stepKick(dt, now);
    drawKick();
  }
  const packX = runners.length ? sum / runners.length : 0;

  const [pos, look, fov] = cameraTarget(leader, packX);
  const k = snap ? 1 : 1 - Math.exp(-dt * 3);
  camera.position.lerp(pos, k);
  focus.lerp(look, k);
  camera.fov += (fov - camera.fov) * k;
  camera.updateProjectionMatrix();
  camera.lookAt(focus);
  snap = false;
  const sunAt = new THREE.Vector3(packX, 0, 0);
  sun.position.copy(sunAt).add(SUN_OFFSET); sun.target.position.copy(sunAt);
  scene.userData.sky.position.copy(camera.position);

  const left = (POST - leader) / FURLONG;
  toRunEl.textContent = left <= 0 ? "Finished" : left < 1 ? Math.round(left * 220) + " yds" : left.toFixed(1).replace(/\.0$/, "") + "f";
  toRunLabel.hidden = left <= 0;

  const every = QUALITY[qLevel].shadowEvery;
  sun.shadow.autoUpdate = every === 1;
  if (every > 1 && framesDrawn % every === 0) sun.shadow.needsUpdate = true;
  const t1 = performance.now();
  renderer.info.reset();
  renderer.setRenderTarget(rt);
  renderer.render(scene, camera);
  renderer.setRenderTarget(null);
  renderer.render(postScene, postCam);
  framesDrawn++;
  diag.js += t1 - t0; diag.draw += performance.now() - t1; diag.n++;
  // ?still=1 (used for checking screenshots): draw a few frames once loaded, then stop.
  if (params.has("still") && runners.length && texturesPending === 0 && ++stillFrames >= 3) { window.__ready = true; return; }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
