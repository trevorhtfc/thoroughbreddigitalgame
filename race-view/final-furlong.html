<style>
/* The race view's last furlong at Ascot, on the full course (courses/ascot.json, courses/ascot-view.json):
   the 507 m main stand on the horses' left, the planting belts and boards round the far rails.
   Panels use the board's cream, bottle green and gold. */
:root {
  --cream: #f4ead2;
  --cream-edge: #b8954a;
  --green: #1f5a38;
  --green-ink: #183f2a;
  --ink-soft: #4f5d4a;
  --display: "Cormorant SC", "Times New Roman", serif;
  --body: "Jost", "Helvetica Neue", Arial, sans-serif;
  color-scheme: light;
}
[hidden] { display: none !important; }
html, body { height: 100%; margin: 0; }
body { background: #5f8a44; color: var(--green-ink); font-family: var(--body); overflow: hidden; }
#scene { position: fixed; inset: 0; display: block; width: 100%; height: 100%; }

.plate {
  position: fixed;
  top: calc(env(safe-area-inset-top, 0px) + 14px);
  left: max(16px, env(safe-area-inset-left, 0px));
  background: var(--cream);
  border: 1px solid var(--cream-edge);
  box-shadow: 0 0 0 3px var(--cream), 0 0 0 4px var(--cream-edge), 0 6px 18px rgba(40, 40, 20, 0.25);
  border-radius: 3px;
  padding: 8px 16px 9px;
  display: flex; gap: 18px; align-items: center;
}
.plate h1 { margin: 0; font-family: var(--display); font-size: 1.45rem; letter-spacing: 0.08em; color: var(--green); line-height: 1; }
.plate p { margin: 2px 0 0; font-size: 0.78rem; letter-spacing: 0.04em; color: var(--ink-soft); }
.plate .togo { text-align: right; border-left: 1px solid rgba(184, 149, 74, 0.6); padding-left: 16px; }
.plate .togo strong { display: block; font-family: var(--display); font-size: 1.35rem; color: var(--green); line-height: 1; font-variant-numeric: tabular-nums; }
.plate .togo span { font-size: 0.7rem; letter-spacing: 0.12em; text-transform: uppercase; color: var(--ink-soft); }

.bar {
  position: fixed; left: 50%; transform: translateX(-50%);
  bottom: calc(env(safe-area-inset-bottom, 0px) + 14px);
  max-width: calc(100% - 32px);
  background: var(--cream);
  border: 1px solid var(--cream-edge);
  border-radius: 3px;

}
.group { display: flex; gap: 4px; align-items: center; }
.group > span { font-size: 0.68rem; letter-spacing: 0.12em; text-transform: uppercase; color: var(--ink-soft); margin-right: 2px; }
button {
  font: 500 0.82rem var(--body); color: var(--green-ink); cursor: pointer;
  background: transparent; border: 1px solid rgba(31, 90, 56, 0.35); border-radius: 3px; padding: 5px 9px;
}
button[aria-pressed="true"] { background: var(--green); color: var(--cream); border-color: var(--green); }
button:focus-visible { outline: 2px solid var(--cream-edge); outline-offset: 2px; }

.diag {
  position: fixed; top: 10px; right: 10px; z-index: 5; max-width: 360px; padding: 8px 10px;
  background: rgba(20, 30, 22, 0.86); color: #f3ead2; border-radius: 3px; font: 12px/1.45 ui-monospace, Menlo, monospace;
}

.diag-sw button { font-size: 0.72rem; padding: 3px 6px; }
.loading {
  position: fixed; inset: 0; display: grid; place-items: center; pointer-events: none;
  font-family: var(--display); font-size: 1.4rem; letter-spacing: 0.1em; color: var(--cream);
  text-shadow: 0 1px 3px rgba(0, 0, 0, 0.4);
}

{ "imports": {

<script type="module">
import * as THREE from "three";
import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";
import * as SkeletonUtils from "three/addons/utils/SkeletonUtils.js";
import { RoomEnvironment } from "three/addons/environments/RoomEnvironment.js";
import { mergeGeometries } from "three/addons/utils/BufferGeometryUtils.js";

const params = new URLSearchParams(location.search);

// ---------- Data (all engine-neutral files) ----------
const COURSE = await fetch("assets/course/ascot.json").then((r) => r.json());          // the layout (world axes)
const VIEW = await fetch("assets/course/ascot-view.json").then((r) => r.json());        // cameras, director, paths, trees
const SILK_DATA = await fetch("assets/silks-catalogue.json").then((r) => r.json());
const SILKS = SILK_DATA.silks;
const COATS = [
  { name: "Bay",      body: "#7a4a2a", points: "#1d1714" },
  { name: "Brown",    body: "#4a2e1c", points: "#17110d" },
  { name: "Chestnut", body: "#a3552c", points: "#6a3317" },
  { name: "Black",    body: "#2b2523", points: "#141110" },
  { name: "Grey",     body: "#a8a6a0", points: "#6d6b66" },
];
document.getElementById("courseName").textContent = COURSE.name + " · final furlong";

// World axes (courses/ascot.json): x east, z south, y up; the winning post on the inside rail is the origin.
// On the home straight the horses run towards -x between the inside rail (z 0) and the outer rail (z 30);
// the stand's front is on z 45.4, on their left. The race itself is worked out along the course
// (u = metres run, v = across, + towards the stands) and turned into world positions only to draw it.
const FURLONG = COURSE.furlong;
const STRIDE_SPEED = 14.6;   // m/s at which the gallop loop matches the ground at scale 3
const HORSE_SCALE = 3;
const HALF_W = COURSE.trackWidth / 2;
const POST = 1006;                                   // u at the winning post in the placeholder race
const RUN = VIEW.homeStraight.runTowards, MID_Z = VIEW.homeStraight.centreZ;
const DIR = Math.sign(RUN[0]);                       // -1: running towards -x
const toWorldX = (u) => (u - POST) * DIR;            // world x of a point u along the straight (post at x 0)
const toWorldZ = (v) => MID_Z + v;
const FRONT = COURSE.grandstand.frontLine;

// ---------- Renderer ----------
const canvas = document.getElementById("scene");
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, powerPreference: "high-performance", preserveDrawingBuffer: params.has("still") });
renderer.info.autoReset = false;
const LAYERS = { horses: [], trees: [], rails: [], kick: [], buildings: [], crowd: [] };   // for the diagnostics panel
renderer.shadowMap.enabled = true;
// Colour handled as Blender handles the stills: AgX, lifted a third of a stop.
renderer.toneMapping = THREE.AgXToneMapping;
renderer.toneMappingExposure = Math.pow(2, 0.35);

// Quality presets. Most of the cost is filling pixels: a Retina Mac at full resolution draws four
// times the pixels of a normal screen, each multisampled and shadowed. "Auto" starts at Medium on
// high-resolution screens (High elsewhere) and steps down by itself if the frame rate drops.
const DPR = window.devicePixelRatio || 1;
const QUALITY = {
  high:   { label: "High",   scale: Math.min(DPR, 2),    samples: 4, shadow: 4096, soft: true,  kick: 1,    edges: true, shadowEvery: 1, crowd: 0.7, crowdNear: 260, crowdFar: 1200 },
  medium: { label: "Medium", scale: Math.min(DPR, 1.25), samples: 2, shadow: 2048, soft: false, kick: 0.6,  edges: true, shadowEvery: 1, crowd: 0.5, crowdNear: 160, crowdFar: 800 },
  low:    { label: "Low",    scale: Math.min(DPR, 1),    samples: 0, shadow: 1024, soft: false, kick: 0.35, edges: false, shadowEvery: 2, crowd: 0.3, crowdNear: 80, crowdFar: 400 },
};
const ORDER = ["high", "medium", "low"];
let qMode = params.get("quality") || (() => { try { return localStorage.getItem("tb-quality"); } catch { return null; } })() || "auto";
if (qMode !== "auto" && !QUALITY[qMode]) qMode = "auto";
let qLevel = qMode === "auto" ? (DPR > 1.5 ? "medium" : "high") : qMode;
renderer.shadowMap.type = QUALITY[qLevel].soft ? THREE.PCFSoftShadowMap : THREE.PCFShadowMap;
renderer.setPixelRatio(QUALITY[qLevel].scale);
const KICK = { perSecond: 26, maxClods: 1600, share: QUALITY[qLevel].kick };   // turf kick-back

const scene = new THREE.Scene();
// Haze into the distance, as in the stills: up to 55% towards a pale blue, starting 70 m out.
// (three.js mixes fog after its colour handling, so the haze colour is given as it should look on screen.)
const HAZE = new THREE.Color().setRGB(0.81, 0.85, 0.89, THREE.LinearSRGBColorSpace);
scene.fog = new THREE.Fog(HAZE, 70, 800);
THREE.ShaderChunk.fog_fragment = `#ifdef USE_FOG
  float fogFactor = 0.55 * (1.0 - exp(-max(vFogDepth - fogNear, 0.0) / fogFar));
  gl_FragColor.rgb = mix(gl_FragColor.rgb, fogColor, fogFactor);
#endif`;

// Sky: the stills' painted gradient (pale at the horizon to deep blue overhead), through the same colour handling.
{
  const lin = (h) => new THREE.Color(h);
  const mat = new THREE.ShaderMaterial({
    side: THREE.BackSide, depthWrite: false, fog: false,
    uniforms: { c0: { value: lin("#e4e6dc") }, c1: { value: lin("#b8d4ec") }, c2: { value: lin("#6faee6") }, c3: { value: lin("#3a86d6") } },
    vertexShader: "varying vec3 vP; void main(){ vP = normalize(position); gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }",
    fragmentShader: `uniform vec3 c0, c1, c2, c3; varying vec3 vP;
      void main(){
        float h = max(vP.y, 0.0);
        vec3 c = h < 0.04 ? mix(c0, c1, h / 0.04) : h < 0.14 ? mix(c1, c2, (h - 0.04) / 0.10) : mix(c2, c3, clamp((h - 0.14) / 0.31, 0.0, 1.0));
        gl_FragColor = vec4(c * 1.05, 1.0);
        #include <tonemapping_fragment>
        #include <colorspace_fragment>
      }`,
  });
  const sky = new THREE.Mesh(new THREE.SphereGeometry(2500, 32, 16), mat);
  scene.add(sky);
  scene.userData.sky = sky;
  // Puffy clouds over the far side: merged soft balls with flattened undersides.
  const rc = (() => { let s = 77; return () => ((s = (s * 1664525 + 1013904223) >>> 0) / 4294967296); })();
  const cloudMat = new THREE.MeshLambertMaterial({ color: "#f4f2ec", emissive: new THREE.Color("#9fb8d8").multiplyScalar(0.25), fog: false });
  for (let i = 0; i < 16; i++) {
    const W = 110 + rc() * 130, parts = [];
    for (let k = 0, n = 5 + Math.floor(rc() * 4); k < n; k++) {
      const r = W * (0.18 + rc() * 0.14);
      parts.push(new THREE.IcosahedronGeometry(r, 3).translate((rc() - 0.5) * W, r * (0.1 + rc() * 0.6), (rc() - 0.5) * W * 0.3));
    }
    const g = mergeGeometries(parts.map((p) => p.deleteAttribute("uv") || p));
    const p = g.attributes.position;
    for (let k = 0; k < p.count; k++) p.setY(k, Math.max(p.getY(k), -W * 0.03));
    g.computeVertexNormals();
    const c = new THREE.Mesh(g, cloudMat);
    c.position.set(-1400 + rc() * 2800, 260 + rc() * 360, -(1700 + rc() * 900));
    c.scale.z = 0.6;
    scene.add(c);
  }
}

// Light, as in the stills: a warm sun (strength 5, soft-edged) from the far side and to the left,
// and the painted sky all round. Static scenery has this light baked in by Blender; horses, jockeys,
// crowd and rails get it live.
const sky = new THREE.HemisphereLight(new THREE.Color("#7fb2e2"), new THREE.Color("#5c7c38"), 2.4);
scene.add(sky);
const sun = new THREE.DirectionalLight(new THREE.Color().setRGB(1.0, 0.9, 0.76, THREE.LinearSRGBColorSpace), 5.0);
sun.castShadow = true;
sun.shadow.mapSize.set(QUALITY[qLevel].shadow, QUALITY[qLevel].shadow);
sun.shadow.radius = 4;
Object.assign(sun.shadow.camera, { left: -45, right: 45, top: 45, bottom: -45, near: 1, far: 400 });
{
  const pm = new THREE.PMREMGenerator(renderer);
  scene.environment = pm.fromScene(new RoomEnvironment(), 0.04).texture;
  scene.environmentIntensity = 0.2;
}
sun.shadow.bias = -0.0005;
sun.shadow.normalBias = 0.03;
scene.add(sun, sun.target);
const SUN_OFFSET = new THREE.Vector3(-110, 84, -58.5);   // Blender's sun direction, in the course's axes

// ---------- Textures ----------
// Count textures still loading, so ?still=1 screenshots wait for every image.
let texturesPending = 0;
const texLoader = new THREE.TextureLoader();
const _load = texLoader.load.bind(texLoader);
texLoader.load = (url, onLoad, onProgress, onError) => {
  texturesPending++;
  return _load(url, (t) => { texturesPending--; onLoad && onLoad(t); }, onProgress, (e) => { texturesPending--; onError && onError(e); });
};
function tex(name, repeatX = 1, repeatY = 1) {
  const t = texLoader.load(`assets/course/${name}.jpg`);
  t.colorSpace = THREE.SRGBColorSpace;
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.repeat.set(repeatX, repeatY);
  t.anisotropy = renderer.capabilities.getMaxAnisotropy();
  return t;
}

// Soft round shadow, used under trees and horses.
const shadowTex = (() => {
  const sc = document.createElement("canvas"); sc.width = sc.height = 128;
  const g = sc.getContext("2d");
  const grad = g.createRadialGradient(64, 64, 4, 64, 64, 62);
  grad.addColorStop(0, "rgba(0,0,0,1)"); grad.addColorStop(0.6, "rgba(0,0,0,0.75)"); grad.addColorStop(1, "rgba(0,0,0,0)");
  g.fillStyle = grad; g.fillRect(0, 0, 128, 128);
  return new THREE.CanvasTexture(sc);
})();

function seeded(seed) { let s = seed >>> 0; return () => ((s = (s * 1664525 + 1013904223) >>> 0) / 4294967296); }

// ---------- Models (glTF, repackaged for the web host) ----------
const loader = new GLTFLoader();
async function loadModel(dir, name) {
  const [json, b64] = await Promise.all([
    fetch(`${dir}/${name}.json`).then((r) => { if (!r.ok) throw new Error(name + " " + r.status); return r.text(); }),
    fetch(`${dir}/${name}-geometry.txt`).then((r) => { if (!r.ok) throw new Error(name + " geometry " + r.status); return r.text(); }),
  ]);
  const raw = atob(b64.trim());
  const bin = new Uint8Array(raw.length);
  for (let i = 0; i < raw.length; i++) bin[i] = raw.charCodeAt(i);
  const pad = (n) => (n + 3) & ~3;
  const jsonBytes = new TextEncoder().encode(json);
  const jLen = pad(jsonBytes.length), bLen = pad(bin.length);
  const glb = new Uint8Array(12 + 8 + jLen + 8 + bLen);
  const dv = new DataView(glb.buffer);
  dv.setUint32(0, 0x46546c67, true); dv.setUint32(4, 2, true); dv.setUint32(8, glb.length, true);
  dv.setUint32(12, jLen, true); dv.setUint32(16, 0x4e4f534a, true);
  glb.fill(0x20, 20, 20 + jLen); glb.set(jsonBytes, 20);
  const b0 = 20 + jLen;
  dv.setUint32(b0, bLen, true); dv.setUint32(b0 + 4, 0x004e4942, true);
  glb.set(bin, b0 + 8);
  return new Promise((resolve, reject) => loader.parse(glb.buffer, dir + "/", resolve, reject));
}

// ---------- The track, its rails and poles (course data; the pieces from Blender) ----------
// Is a world point (x, z) on the turf? The first ring is the outline, the rest are holes.
function inRing(r, x, z) {
  let inside = false;
  for (let i = 0, j = r.length - 1; i < r.length; j = i++) {
    const [xi, zi] = r[i], [xj, zj] = r[j];
    if ((zi > z) !== (zj > z) && x < ((xj - xi) * (z - zi)) / (zj - zi) + xi) inside = !inside;
  }
  return inside;
}
const SURF = COURSE.track.surface;
const onTrack = (x, z) => inRing(SURF[0], x, z) && !SURF.slice(1).some((h) => inRing(h, x, z));
function distToRails(x, z) {
  let best = Infinity;
  for (const line of COURSE.rails.lines) {
    for (let i = 1; i < line.length; i++) {
      const [ax, az] = line[i - 1], [bx, bz] = line[i];
      const dx = bx - ax, dz = bz - az, L2 = dx * dx + dz * dz || 1;
      const t = Math.max(0, Math.min(1, ((x - ax) * dx + (z - az) * dz) / L2));
      best = Math.min(best, Math.hypot(x - ax - t * dx, z - az - t * dz));
    }
  }
  return best;
}

// The turf right round the course, for wherever the baked ground stops.
function buildTurf(colour) {
  const shape = new THREE.Shape(SURF[0].map(([x, z]) => new THREE.Vector2(x, -z)));
  for (const h of SURF.slice(1)) shape.holes.push(new THREE.Path(h.map(([x, z]) => new THREE.Vector2(x, -z))));
  const g = new THREE.ShapeGeometry(shape).rotateX(-Math.PI / 2);
  const m = new THREE.Mesh(g, new THREE.MeshBasicMaterial({ color: colour }));
  m.position.y = -0.03;
  scene.add(m);
}

function placeProps(gltf) {
  const byName = (n) => gltf.scene.getObjectByName(n);
  gltf.scene.traverse((o) => { if (o.isMesh) { o.castShadow = true; o.receiveShadow = true; o.material.roughness = 0.6; } });
  // Rails: one instanced module (3 m, its track side towards -z) laid along each rail line of the course.
  const SPACING = 3;
  const parts = [];
  byName("rail_module").traverse((o) => { if (o.isMesh) parts.push(o); });
  // The finish-line assembly brings its own 30 m of rail on the far side at the post.
  const gap = (x, z) => Math.abs(z + COURSE.rails.gap) < 1.5 && x > -16.7 && x < 16.3;
  const spots = [];
  for (const line of COURSE.rails.lines) {
    // walk the line in 3 m steps
    const pts = [];
    let carry = 0;
    for (let i = 1; i < line.length; i++) {
      const [ax, az] = line[i - 1], [bx, bz] = line[i];
      const L = Math.hypot(bx - ax, bz - az);
      for (let d = carry; d < L; d += SPACING) pts.push([ax + (bx - ax) * d / L, az + (bz - az) * d / L]);
      carry = (carry - L) % SPACING; if (carry < 0) carry += SPACING;
    }
    // which way round: the module's track side (local -z) must face the turf
    const [p0, p1] = [pts[0], pts[1]];
    const dx = p1[0] - p0[0], dz = p1[1] - p0[1];
    const flip = !onTrack(p0[0] + dx * 0.5 + dz * 1.0, p0[1] + dz * 0.5 - dx * 1.0);
    for (let i = 0; i + 1 < pts.length; i++) {
      let [a, b] = [pts[i], pts[i + 1]];
      if (flip) [a, b] = [b, a];
      if (gap((a[0] + b[0]) / 2, (a[1] + b[1]) / 2)) continue;
      spots.push([a[0], a[1], Math.atan2(-(b[1] - a[1]), b[0] - a[0])]);
    }
  }
  // in chunks of 20, so the rail out of shot isn't drawn
  const m = new THREE.Matrix4(), q = new THREE.Quaternion(), one = new THREE.Vector3(1, 1, 1), up = new THREE.Vector3(0, 1, 0), p = new THREE.Vector3();
  const CHUNK = 20;
  for (const part of parts) {
    for (let c0 = 0; c0 < spots.length; c0 += CHUNK) {
      const n = Math.min(CHUNK, spots.length - c0);
      const rails = new THREE.InstancedMesh(part.geometry, part.material, n);
      for (let i = 0; i < n; i++) {
        const [x, z, yaw] = spots[c0 + i];
        rails.setMatrixAt(i, m.compose(p.set(x, 0, z), q.setFromAxisAngle(up, yaw), one));
      }
      rails.computeBoundingSphere();
      rails.castShadow = rails.receiveShadow = true;
      scene.add(rails);
      LAYERS.rails.push(rails);
    }
  }
  // Furlong poles beyond the inside rail, up the straight mile (the round course shares the first three).
  for (const f of COURSE.straightMile.furlongPoles) {
    const node = byName("furlong_" + f.furlongs);
    if (!node) continue;
    const pole = node.clone();
    pole.position.set(f.at[0], 0, f.at[1] - COURSE.rails.gap - 0.7);
    scene.add(pole);
  }
}

// ---------- Architecture: stand, site components, finish line, crowd (all from Blender, placed from data) ----------
const ARCH = "assets/architecture";

function meshesOf(obj) { const out = []; obj.updateMatrixWorld(true); obj.traverse((o) => { if (o.isMesh) out.push(o); }); return out; }

// Static scenery with Blender's lighting baked in (tools/blender/bake_static_world.py): the stand (its light
// distant version), the site components and the finish line, drawn unlit as material colour x baked light;
// the ground round the last two furlongs holds its own colour and light. All in world axes already.
const BAKED = "assets/baked/";
function bakedTex(file) {
  const t = texLoader.load(BAKED + file);
  t.flipY = false; t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 8;
  return t;
}
function placeBaked(gltf, B) {
  for (const key of ["stand", "site", "finish", "ground"]) {
    const node = gltf.scene.getObjectByName(B[key].mesh);
    if (!node) { console.warn("Baked mesh missing:", key); continue; }
    const info = B[key];
    const tex = bakedTex(info.lightMap || info.map);
    for (const m of meshesOf(node)) {
      const name = m.material.name || "";
      let mat;
      if (key === "ground") mat = new THREE.MeshBasicMaterial({ map: tex, color: new THREE.Color(info.scale, info.scale, info.scale) });
      else if (name.includes("digit")) mat = new THREE.MeshBasicMaterial({ color: m.material.color.clone().multiplyScalar(2.2) });
      else {
        const col = m.material.color.clone();
        if (name.endsWith("glass") && VIEW.glass) col.lerp(new THREE.Color(VIEW.glass.reflect), VIEW.glass.amount);   // sky in the glass
        mat = new THREE.MeshBasicMaterial({ color: col, lightMap: tex, lightMapIntensity: Math.PI * info.scale });
      }
      mat.name = name;
      m.material = mat;
      m.castShadow = false; m.receiveShadow = false;
      if (key !== "ground") LAYERS.buildings.push(m);
    }
    scene.add(node);
  }
  // Beyond the baked ground: plain grass, and the turf right round the course, in the same light.
  const o = B.ground.outside, tf = B.ground.turf || [0.12, 0.3, 0.06];
  const far = new THREE.Mesh(new THREE.PlaneGeometry(9000, 9000), new THREE.MeshBasicMaterial({ color: new THREE.Color(o[0], o[1], o[2]) }));
  far.rotation.x = -Math.PI / 2; far.position.set(700, -0.06, -400);
  scene.add(far);
  buildTurf(new THREE.Color(tf[0], tf[1], tf[2]));
  // Live shadows of the field, laid over the baked turf of the home straight.
  const catcher = new THREE.Mesh(new THREE.PlaneGeometry(420, 34), new THREE.ShadowMaterial({ color: "#1d2c14", opacity: 0.38 }));
  catcher.rotation.x = -Math.PI / 2; catcher.position.set(60, 0.03, MID_Z);
  catcher.receiveShadow = true;
  scene.add(catcher);
}

// Planting belts (tools/blender/build_planting.py, placed from courses/ascot-planting.json): Thoroughbred
// boards just behind the far rails, a low dense hedge closing the view at eye level, and rows of the
// leafy trees behind and above it. Lit live like the loose trees.
const TD = VIEW.treeDetail;
const isNear = (x, z) => Math.hypot(x - TD.centre[0], z - TD.centre[1]) < TD.nearRadius;
function placeBelts(gltf, planting, treeLib) {
  const hedge = gltf.scene.getObjectByName("planting_hedge");
  if (hedge) {
    for (const m of meshesOf(hedge)) {
      m.material = new THREE.MeshLambertMaterial({ vertexColors: true });
      LAYERS.trees.push(m);
    }
    scene.add(hedge);
  }
  if (!planting) return;
  const m4 = new THREE.Matrix4(), q = new THREE.Quaternion(), one = new THREE.Vector3(1, 1, 1), sc = new THREE.Vector3(), p = new THREE.Vector3(), up = new THREE.Vector3(0, 1, 0);
  const byDesign = new Map();
  for (const b of planting.boards) { if (!byDesign.has(b[3])) byDesign.set(b[3], []); byDesign.get(b[3]).push(b); }
  for (const [design, list] of byDesign) {
    const node = gltf.scene.getObjectByName("board_" + design);
    if (!node) continue;
    for (const part of meshesOf(node)) {
      const mat = new THREE.MeshLambertMaterial({ color: part.material.color, map: part.material.map || null });
      const inst = new THREE.InstancedMesh(part.geometry, mat, list.length);
      list.forEach(([x, z, turn], i) => inst.setMatrixAt(i, m4.compose(p.set(x, 0, z), q.setFromAxisAngle(up, turn * Math.PI / 180), one)));
      inst.computeBoundingSphere();
      scene.add(inst);
      LAYERS.trees.push(inst);
    }
  }
  if (treeLib) instanceTrees(treeLib, planting.trees.map(([x, z, tree, s, turn]) => ({ x, z, tree, s, turn, belt: true })));
}

// Instance tree models: full crowns near the action, light crowns further off (see treeDetail).
const treeMat = new THREE.MeshLambertMaterial({ vertexColors: true });
function instanceTrees(gltf, list) {
  const groups = new Map();
  for (const t of list) {
    const near = isNear(t.x, t.z);
    const parts = [near ? "_crown" : "_crown_far"].concat(near || !t.belt ? ["_trunk"] : []);
    for (const part of parts) {
      const key = t.tree + part;
      if (!groups.has(key)) groups.set(key, []);
      groups.get(key).push(t);
    }
  }
  const m4 = new THREE.Matrix4(), q = new THREE.Quaternion(), sc = new THREE.Vector3(), p = new THREE.Vector3(), up = new THREE.Vector3(0, 1, 0);
  for (const [key, ts] of groups) {
    const node = gltf.scene.getObjectByName(key) || gltf.scene.getObjectByName(key.replace("_far", ""));
    if (!node) continue;
    for (const mesh of meshesOf(node)) {
      const inst = new THREE.InstancedMesh(mesh.geometry, treeMat, ts.length);
      ts.forEach((t, i) => { q.setFromAxisAngle(up, (t.turn || 0) * Math.PI / 180); sc.set(t.s, t.s * (t.sy || 1), t.s); inst.setMatrixAt(i, m4.compose(p.set(t.x, 0, t.z), q, sc)); });
      inst.computeBoundingSphere();
      scene.add(inst);
      LAYERS.trees.push(inst);
    }
  }
}

// The stills' leafy trees (tools/blender/export_trees.py), scattered where courses/ascot-view.json says:
// behind the stand, round the enclosures, in the infield and beyond the bend. Vertex colours carry the
// stills' dark-base-to-sunlit-top colouring; normals are bent out from each crown's centre.
function placeTrees(gltf, dressing) {
  const names = ["oak_a", "oak_b", "oak_c", "wide_a", "wide_b", "poplar_a"];
  const rnd = seeded(11);
  const CL = VIEW.clearOf, S = CL.stand;
  const pieces = (dressing && dressing.pieces) || [];
  const clear = (x, z) => (x > S[0] && x < S[2] && z > S[1] && z < S[3])
    || onTrack(x, z) || distToRails(x, z) < CL.track
    || pieces.some((p) => Math.abs(p.x - x) < CL.pieces && Math.abs(p.z - z) < CL.pieces);
  const spots = [];
  for (const a of VIEW.trees) {
    const [x0, x1] = [Math.min(a.area[0], a.area[2]), Math.max(a.area[0], a.area[2])];
    const [z0, z1] = [Math.min(a.area[1], a.area[3]), Math.max(a.area[1], a.area[3])];
    for (let z = z0; z < z1; z += a.spacing) {
      for (let x = x0 + rnd() * a.spacing; x < x1; x += a.spacing * (0.7 + rnd() * 0.6)) {
        if (rnd() < (a.skip || 0)) continue;
        const n = a.clump ? a.clump[0] + Math.floor(rnd() * (a.clump[1] - a.clump[0] + 1)) : 1;
        for (let k = 0; k < n; k++) {
          const tx = x + (rnd() - 0.5) * (n > 1 ? 14 : a.spacing * 0.6), tz = z + (rnd() - 0.5) * (n > 1 ? 10 : a.spacing * 0.6);
          if (!clear(tx, tz)) spots.push({ x: tx, z: tz, s: a.scale[0] + rnd() * (a.scale[1] - a.scale[0]) });
        }
      }
    }
  }
  for (const sp of spots) { sp.tree = names[Math.floor(rnd() * names.length)]; sp.turn = rnd() * 360; sp.sy = 0.92 + rnd() * 0.18; }
  instanceTrees(gltf, spots);
  const m4 = new THREE.Matrix4(), q = new THREE.Quaternion(), sc = new THREE.Vector3(), p = new THREE.Vector3();
  // Soft shadows on the grass, falling away from the sun.
  console.log("trees:", spots.length);
  const shadows = new THREE.InstancedMesh(new THREE.PlaneGeometry(1, 1), new THREE.MeshBasicMaterial({ map: shadowTex, color: "#1f3318", transparent: true, opacity: 0.45, depthWrite: false }), spots.length);
  const sunFlat = new THREE.Vector2(-SUN_OFFSET.x, -SUN_OFFSET.z).normalize();
  const ang = Math.atan2(sunFlat.y, sunFlat.x);
  spots.forEach((t, i) => {
    const h = 11 * t.s;
    p.set(t.x + sunFlat.x * h * 0.35, 0.04, t.z + sunFlat.y * h * 0.35);
    q.setFromEuler(new THREE.Euler(-Math.PI / 2, 0, -ang, "YXZ"));
    shadows.setMatrixAt(i, m4.compose(p, q, sc.set(h * 0.95, h * 0.6, 1)));
  });
  shadows.frustumCulled = false;
  scene.add(shadows);
  LAYERS.trees.push(shadows);
}

// ---------- Crowd (tools/blender/build_crowd.py; dressed from crowd_looks.json) ----------
// Racegoers from the crowd kit: modular bodies and hats, each vertex tagged with its colour slot (_slot)
// and the bone that moves it (_bone). One instanced mesh per body or hat type, in a near version and a
// light far version, plus a silhouette for people a long way off; who gets which is redone whenever the
// camera has moved a few metres. Arms and
// heads move in the vertex shader from the actions baked in Blender (crowd_anims.json); people switch to
// cheering, clapping or waving as the leader comes within about 60 m.
const CROWD_FULL = [-110, 410];   // full crowd along this stretch of x (the whole stand)
// Three versions of every figure, by distance from the camera: detailed, light, and a silhouette.
const CROWD = { groups: [], people: [], share: 1, nearDist: 55, nearMax: 350, farDist: 170, farMax: 2200, last: -1, uniforms: null };

function weighted(rnd, table) {

  const ACT = Object.keys(anims.rigs.gent.actions);

  const nf = ACT.map((a) => anims.rigs.gent.actions[a].frames.length);
  const u = {
    uAnim: { value: animTex }, uPalette: { value: paletteTex }, uTime: { value: 0 }, uLeaderX: { value: 1e6 },
    uDur: { value: dur }, uFrames: { value: nf }, uRows: { value: paletteTex.image.height },

        uniform sampler2D uAnim; uniform float uTime, uLeaderX, uRows;
        uniform float uDur[${ACT.length}]; uniform float uFrames[${ACT.length}];
        varying vec2 vPal;
        vec3 qrot(vec4 q, vec3 v) { return v + 2.0 * cross(q.xyz, cross(q.xyz, v) + q.w * v); }
        // one bone's transform at time t of an action (frames: 2 texels each, quaternion then translation)
        void boneAt(float rig, float act, float bone, float phase, out vec4 q, out vec3 t) {
          int ai = int(act);

          float f = fract(uTime / d + phase) * n;
          float f0 = floor(f), f1 = mod(f0 + 1.0, n), k = f - f0;
          int row = int((rig * ${ACT.length}.0 + act) * 6.0 + bone);
          vec4 qa = texelFetch(uAnim, ivec2(int(f0) * 2, row), 0), qb = texelFetch(uAnim, ivec2(int(f1) * 2, row), 0);
          if (dot(qa, qb) < 0.0) qb = -qb;
          q = normalize(mix(qa, qb, k));
          t = mix(texelFetch(uAnim, ivec2(int(f0) * 2 + 1, row), 0).xyz, texelFetch(uAnim, ivec2(int(f1) * 2 + 1, row), 0).xyz, k);
        }`)
      .replace("#include <beginnormal_vertex>", `
        // aCrowd: look row, rig (0 gent, 1 lady), phase, unused; aAct: base action, excited action
        float px = (modelMatrix * instanceMatrix * vec4(0.0, 0.0, 0.0, 1.0)).x;
        // each person reacts at their own distance (45-75 m), quickly, so the cheer ripples along the rail
        float reach = 45.0 + 30.0 * fract(aCrowd.z * 7.13);

        vec4 q1, q2; vec3 t1, t2;
        boneAt(aCrowd.y, aAct.x, _bone, aCrowd.z, q1, t1);
        boneAt(aCrowd.y, aAct.y, _bone, aCrowd.z * 1.7, q2, t2);
        if (dot(q1, q2) < 0.0) q2 = -q2;

        #ifdef USE_TANGENT
        vec3 objectTangent = vec3(tangent.xyz);
        #endif
        vPal = vec2((_slot + 0.5) / 10.0, (aCrowd.x + 0.5) / uRows);`)
      .replace("#include <begin_vertex>", `vec3 transformed = qrot(bq, position) + bt;`);
    sh.fragmentShader = sh.fragmentShader
      .replace("#include <common>", "#include <common>\nuniform sampler2D uPalette; varying vec2 vPal;")
      .replace("#include <map_fragment>", "#include <map_fragment>\n diffuseColor.rgb *= texture2D(uPalette, vPal).rgb;");
  };

  CROWD.uniforms = u;
  return mat;
}

function buildCrowd(gltf, data, pieceAt) {
  const rnd = seeded(21);
  const L = data.looks, A = data.anims;
  const ACT = Object.keys(A.rigs.gent.actions);
  const pick = (a) => a[Math.floor(rnd() * a.length)];
  // ---- the animation table: one row per rig x action x bone, two texels per frame
  const maxF = Math.max(...ACT.map((a) => A.rigs.gent.actions[a].frames.length));
  const RIGS = ["gent", "lady"];
  const H = RIGS.length * ACT.length * 6, W = maxF * 2;
  const ad = new Float32Array(W * H * 4);
  RIGS.forEach((rig, ri) => ACT.forEach((act, ai) => {
    A.rigs[rig].actions[act].frames.forEach((frame, fi) => frame.forEach(([qw, qx, qy, qz, tx, ty, tz], b) => {
      const row = (ri * ACT.length + ai) * 6 + b, o = (row * W + fi * 2) * 4;
      ad.set([qx, qy, qz, qw, tx, ty, tz, 0], o);
    }));
  }));
  const animTex = new THREE.DataTexture(ad, W, H, THREE.RGBAFormat, THREE.FloatType);
  animTex.needsUpdate = true;
  // ---- looks: 48 per body-and-hat pairing, one colour per slot
  const SLOTS = A.slots;
  const looks = [], lookRows = new Map();
  const col = (h) => new THREE.Color(h);
  for (const [sex, bodies] of Object.entries(L.bodies)) {
    for (const body of Object.keys(bodies)) {
      for (const hat of Object.keys(L.hats[body])) {
        const rows = [];
        for (let i = 0; i < 48; i++) {
          const pal = sex === "lady" ? L.colours.lady : (L.colours[body] || L.colours.gent_lounge);
          const lk = { skin: pick(L.colours.skin), hair: pick(L.colours.hair), shirt: pick(L.colours.shirt), dark: L.colours.dark[0],
            prop: pick(L.colours.prop), main: pick(pal.main), second: pick(pal.second), accent: pick(pal.accent) };
          if (lk.second === lk.main) lk.second = pal.second[(pal.second.indexOf(lk.second) + 1) % pal.second.length];
          const hc = hat !== "none" ? pick(L.colours.hat[hat]) : ["#000000", "#000000"];
          lk.hat = hc[0].startsWith("@") ? lk[hc[0].slice(1)] : hc[0];
          lk.band = hc[1].startsWith("@") ? lk[hc[1].slice(1)] : hc[1];
          rows.push(looks.length); looks.push(SLOTS.map((s) => col(lk[s])));
        }
        lookRows.set(body + "|" + hat, rows);
      }
    }
  }
  const pd = new Float32Array(SLOTS.length * looks.length * 4);
  looks.forEach((row, r) => row.forEach((c, k) => pd.set([c.r, c.g, c.b, 1], (r * SLOTS.length + k) * 4)));
  const paletteTex = new THREE.DataTexture(pd, SLOTS.length, looks.length, THREE.RGBAFormat, THREE.FloatType);
  paletteTex.needsUpdate = true;
  const mat = crowdMaterial(animTex, paletteTex, null, A);

  // ---- where people stand
  const spots = [];
  const add = (x, y, z, o = {}) => spots.push({ x, y, z, ...o });
  const S0 = -102.5, S1 = 405;                                   // the stand's west and east ends
  const nearRail = COURSE.trackWidth + COURSE.rails.gap;
  // the lawn between the outer rail and the stand: packed at the rail and thinning back, in clusters
  // with gaps and ragged edges (a smooth noise sets the local density)
  const noise = (x, z) => 0.5 + 0.25 * Math.sin(x * 0.13 + Math.sin(z * 0.4) * 2.1) + 0.25 * Math.sin(x * 0.047 + 1.3 + z * 0.21);
  for (let z = nearRail + 1.4; z < FRONT - 1.4; z += 0.68) {
    const d = z - nearRail;
    const base = d < 2.2 ? 0.95 : d < 4.5 ? 0.7 : d < 8 ? 0.36 : 0.1;
    for (let x = S0 - 6; x < S1; x += 0.6) {
      const n = noise(x, z);
      const keep = d < 2.2 ? 0.88 + 0.12 * n : base * Math.min(1, n * 1.35) * (0.4 + n * 0.8);   // packed along the rail
      if (rnd() < (d < 2.2 ? base * keep : keep)) add(x + (rnd() - 0.5) * 0.36, 0, z + (rnd() - 0.5) * 0.36);
    }
  }
  for (let g = 0; g < 60; g++) {                                 // knots of friends on the lawn
    const gx = S0 + rnd() * 380, gz = nearRail + 5 + rnd() * (FRONT - nearRail - 7);
    const n = 3 + Math.floor(rnd() * 5), r = 0.7 + n * 0.12;
    for (let k = 0; k < n; k++) {
      const a = (k / n) * 6.28 + rnd() * 0.5;
      add(gx + Math.cos(a) * r, 0, gz + Math.sin(a) * r * 0.8, { yaw: Math.atan2(-Math.cos(a), -Math.sin(a)) });
    }
  }
  // the stand's verandas, balconies, galleries and steps (areas relative to the clock tower on the front line)
  for (const a of data.areas || []) {
    if (a.kind === "lawn_front_line") continue;
    const rows = a.z1 - a.z0 < 1.4 ? 1 : 2;
    for (let r = 0; r < rows; r++) {
      const lz = a.z0 + 0.2 + r * 0.75;
      for (let x = a.x0 + 0.3; x < a.x1 - 0.3; x += 0.6) {
        if (rnd() >= (a.kind === "steps" ? 0.35 : r === 0 ? 0.8 : 0.42) * (0.55 + noise(x, a.floor * 3) * 0.6)) continue;
        let y = a.floor;
        if (a.kind === "steps") y = 3.0 * (lz - a.z0 + 0.3) / (a.z1 - a.z0 + 0.6);
        add(x + (rnd() - 0.5) * 0.15, y, FRONT + lz);
      }
    }
  }
  // seats and floors on the site pieces, facing the way each piece faces
  const v = new THREE.Vector3();
  for (const p of data.dressing?.pieces || []) {
    const sp = data.spots?.[p.piece];
    if (!sp) continue;
    const at = pieceAt(p);
    for (const [kind, fill] of [["seats", 0.62], ["stand", 0.7]]) {
      for (const [lx, ly, lz] of sp[kind] || []) {
        if (rnd() >= fill) continue;
        v.set(lx, lz, -ly).applyMatrix4(at);                       // Blender (x, y, z) -> glTF (x, z, -y)
        add(v.x, v.y, v.z, { yaw: Math.PI + (p.turn || 0) * Math.PI / 180, seated: kind === "seats" });
      }
    }
  }
  for (const c of data.dressing?.crowds || []) {
    const n = Math.floor((c.x[1] - c.x[0]) * (c.z[1] - c.z[0]) * c.density);
    for (let i = 0; i < n; i++) add(c.x[0] + rnd() * (c.x[1] - c.x[0]), 0, c.z[0] + rnd() * (c.z[1] - c.z[0]));
  }
  // full along the final furlong and round the post; thinner up the straight, seen only from afar
  const kept = spots.filter((s) => (s.x >= CROWD_FULL[0] && s.x <= CROWD_FULL[1]) || rnd() < 0.2);
  // shuffle, so lowering the quality thins the crowd evenly instead of emptying whole areas
  for (let i = kept.length - 1; i > 0; i--) { const j = Math.floor(rnd() * (i + 1)); [kept[i], kept[j]] = [kept[j], kept[i]]; }

  // ---- who they are and what they do
  const actIndex = Object.fromEntries(ACT.map((a, i) => [a, i]));
  const groupOf = new Map();
  const group = (name) => {
    if (!groupOf.has(name)) {
      const node = (suffix) => gltf.scene.getObjectByName(name + suffix) || gltf.scene.getObjectByName(name);
      const g = { name, near: meshesOf(node(""))[0].geometry, far: meshesOf(node("_far"))[0].geometry, tiny: meshesOf(node("_tiny"))[0].geometry, members: [] };
      groupOf.set(name, g); CROWD.groups.push(g);
    }
    return groupOf.get(name);
  };
  for (const s of kept) {
    const sex = rnd() < L.ladyShare ? "lady" : "gent";
    const body = weighted(rnd, L.bodies[sex]);
    const hat = weighted(rnd, L.hats[body]);
    const fixed = L.actions.fixed[body];
    let base = fixed ? fixed.base : weighted(rnd, L.actions.base);
    if (L.actions.gentOnly.includes(base) && (sex !== "gent" || hat === "none")) base = "idle";
    const excited = fixed ? fixed.excited : weighted(rnd, L.actions.excited);
    const facing = s.yaw != null ? s.yaw : (s.z < 0 ? 0 : Math.PI) + (rnd() - 0.5) * 0.9;   // towards the track
    const p = {
      x: s.x, y: s.y, z: s.z, yaw: facing, s: 0.94 + rnd() * 0.12, sy: s.seated ? 0.72 : 0.96 + rnd() * 0.08,
      look: pick(lookRows.get(body + "|" + hat)), rig: sex === "lady" ? 1 : 0, phase: rnd(),
      base: actIndex[base], excited: actIndex[excited],
    };
    CROWD.people.push(p);
    group(body).members.push(p);
    if (hat !== "none") group("hat_" + sex + "_" + hat).members.push(p);
  }
  // ---- one near and one far instanced mesh per group
  for (const g of CROWD.groups) {
    for (const lod of ["near", "far", "tiny"]) {
      const n = g.members.length;
      const geo = g[lod].clone();
      const im = new THREE.InstancedMesh(geo, mat, n);
      im.geometry.setAttribute("aCrowd", new THREE.InstancedBufferAttribute(new Float32Array(n * 4), 4));
      im.geometry.setAttribute("aAct", new THREE.InstancedBufferAttribute(new Float32Array(n * 2), 2));
      im.count = 0; im.frustumCulled = false;
      im.castShadow = false; im.receiveShadow = false;
      scene.add(im); LAYERS.crowd.push(im);
      g[lod + "Mesh"] = im;
    }
  }
  console.log("crowd:", CROWD.people.length, "people,", CROWD.groups.length, "kinds,", looks.length, "looks");
  setCrowdShare(QUALITY[qLevel].crowd);
}
// The near/far split, redone when the camera has moved. Each person's matrix and attributes go to the
// near mesh of their body (and hat) if close, else the far one.
const _cm = new THREE.Matrix4(), _cq = new THREE.Quaternion(), _cs = new THREE.Vector3(), _cp = new THREE.Vector3(), _cu = new THREE.Vector3(0, 1, 0);
function updateCrowd(cam) {

  const n = Math.round(CROWD.people.length * CROWD.share);
  const near2 = CROWD.nearDist * CROWD.nearDist, far2 = CROWD.farDist * CROWD.farDist;
  // the closest few hundred get the detailed version, the next couple of thousand the light one
  const cx = cam.position.x, cy = cam.position.y, cz = cam.position.z;
  const on = [];

// ---------- Placeholder race ----------
// The real race sim will hand the viewer a timeline (each horse's distance, lateral position and effort
// over time); this stand-in makes one so the look test has a field to film. The steering below is the
// kind of thing the real sim's timeline should include: horses drift into groups, tuck in behind
// another horse, pull out to pass when they're stuck, keep a body's width apart and wander a little.
// Each frame: [x, z, speed, effort 0..2, heading].
function placeholderTimeline(n, seed) {
  const rnd = seeded(seed);
  const dt = 0.1, out = [];
  const limit = HALF_W - 1.2;
  const nGroups = n > 9 ? 3 : 2;
  const groupBase = Array.from({ length: nGroups }, (_, g) => -limit * 0.7 + (g + 0.5) * (limit * 1.4 / nGroups));
  const horses = Array.from({ length: n }, (_, i) => {
    const stall = -limit + 0.5 + i * ((2 * limit - 1) / Math.max(1, n - 1));
    let g = 0, best = 1e9;
    groupBase.forEach((c, k) => { const dd = Math.abs(c - stall); if (dd < best) { best = dd; g = k; } });
    return {
      base: 16.1 + rnd() * 0.6, kick: 0.5 + rnd() * 1.0, kickAt: 220 + rnd() * 240,
      x: rnd() * 1.2, z: stall, v: 0, vz: 0, group: g,
      wp: rnd() * 6.28, wf: 0.25 + rnd() * 0.35, surge: rnd() * 6.28,
    };
  });
  for (let t = 0; t <= 90; t += dt) {
    // Group centres drift slowly, so the bunches breathe across the course.
    const centres = groupBase.map((c, k) => c + Math.sin(t * 0.07 + k * 2.1) * 2.5);
    const frame = horses.map((h) => {
      const toGo = POST - h.x;
      const past = toGo < 0;
      let want = past ? 6 : h.base + (toGo < h.kickAt ? h.kick : 0) + Math.sin(t * 0.4 + h.surge) * 0.15;
      // Who is just in front, and is there room either side?
      let blocker = null, leftCrowd = 0, rightCrowd = 0;
      for (const o of horses) {
        if (o === h) continue;
        const dx = o.x - h.x, dz = o.z - h.z;
        if (dx > 0 && dx < 4.5 && Math.abs(dz) < 1.3 && (!blocker || dx < blocker.x - h.x)) blocker = o;
        if (Math.abs(dx) < 6) { if (dz > 0 && dz < 3) rightCrowd++; if (dz < 0 && dz > -3) leftCrowd++; }
      }
      let az = (centres[h.group] - h.z) * 0.12;                          // drift towards its group
      az += Math.sin(t * h.wf + h.wp) * 0.25;                           // a little wander
      const kicking = toGo < h.kickAt;
      if (blocker && want > blocker.v) {
        if (kicking) az += (leftCrowd <= rightCrowd ? -1 : 1) * 1.6;    // stuck: pull out to pass
        else want = Math.min(want, blocker.v + 0.05);                   // otherwise sit in behind
      }
      for (const o of horses) {                                         // keep a body's width apart
        if (o === h) continue;
        const dx = o.x - h.x, dz = h.z - o.z;
        if (Math.abs(dx) < 3.4 && Math.abs(dz) < 1.7) az += Math.sign(dz || (rnd() - 0.5)) * (1.7 - Math.abs(dz)) * 2.2;
      }
      if (!kicking && !past) {                                          // tuck in behind the horse ahead
        let lead = null;
        for (const o of horses) { const dx = o.x - h.x; if (o !== h && dx > 3 && dx < 9 && Math.abs(o.z - h.z) < 2.5 && (!lead || dx < lead.x - h.x)) lead = o; }
        if (lead) az += (lead.z - h.z) * 0.3;
      }
      if (h.z > limit - 0.5) az -= (h.z - limit + 0.5) * 4;            // stay off the rails
      if (h.z < -limit + 0.5) az += (-limit + 0.5 - h.z) * 4;
      h.vz = THREE.MathUtils.clamp((h.vz + az * dt) * 0.9, -1.3, 1.3);
      h.v += Math.sign(want - h.v) * Math.min(Math.abs(want - h.v), (h.v < 8 ? 6 : 1.4) * dt);
      h.x += h.v * dt;
      h.z += h.vz * dt;
      const effort = past ? 0 : toGo < h.kickAt * 0.55 ? 2 : kicking ? 1 : 0;
      return [h.x, h.z, h.v, effort, Math.atan2(h.vz, Math.max(h.v, 1))];
    });
    out.push(frame);
  }
  return { dt, frames: out };
}

    const u = {
      mask: { value: maskTex }, coatCol: { value: new THREE.Color(coat.body) },
      pointsCol: { value: new THREE.Color(coat.points) }, silkCol: { value: new THREE.Color(silk.colour) },
    };
    obj.traverse((o) => {
      if (!o.isMesh) return;
      o.castShadow = true; o.frustumCulled = false;
      o.material = o.material.clone();
      if (o.material.name === "silks") { o.material.map = silkTexture(silk.id); o.material.roughness = 0.6; }
      else makeTintable(o.material, u);
    });
    const mixer = new THREE.AnimationMixer(obj);
    const actions = {};
    for (const c of clips) { actions[c.name] = mixer.clipAction(c); actions[c.name].play(); }
    mixer.setTime((i * 0.137) % 0.48);
    scene.add(obj);
    LAYERS.horses.push(obj);
    runners.push({ obj, mixer, actions, effort: 0 });
  }
  document.getElementById("loading").hidden = true;
} catch (err) {
  console.error(err);
  document.getElementById("loading").textContent = "The course didn't load. Refresh to try again.";
}

// ---------- Contact shadows under the horses ----------
const contact = new THREE.InstancedMesh(new THREE.PlaneGeometry(1, 1), new THREE.MeshBasicMaterial({ map: shadowTex, color: "#1a2410", transparent: true, opacity: 0.55, depthWrite: false }), 64);
contact.frustumCulled = false; contact.count = 0; contact.renderOrder = 1;
scene.add(contact);

// ---------- Turf kick-back: clods of earth and grass thrown up behind the hooves ----------
const clods = new THREE.InstancedMesh(new THREE.IcosahedronGeometry(1, 0), new THREE.MeshLambertMaterial({ color: "#ffffff" }), KICK.maxClods);
clods.frustumCulled = false; clods.count = 0; clods.castShadow = false;
scene.add(clods);
LAYERS.kick.push(clods);
const CLOD_COLOURS = ["#5a4430", "#6d5238", "#567e36", "#44702e", "#5f8a3c", "#7a9a48"].map((c) => new THREE.Color(c));
const live = [];
const kickRnd = seeded(99);
const _m = new THREE.Matrix4(), _q = new THREE.Quaternion(), _s = new THREE.Vector3(), _p = new THREE.Vector3(), _e = new THREE.Euler();
function stepKick(dt, field) {
  // Emit: from the hind and fore hooves, thrown up and back; they leave the horse behind as it gallops on.
  for (const [x, z, v, , yaw] of field) {
    if (v < 6) continue;
    let n = KICK.perSecond * KICK.share * (v / 16) * dt;
    while (n > 0 && live.length < KICK.maxClods) {
      if (n < 1 && kickRnd() > n) break;
      n -= 1;
      const hind = kickRnd() < 0.7;
      const lx = hind ? -1.1 + kickRnd() * 0.5 : 0.7 + kickRnd() * 0.4, lz = (kickRnd() - 0.5) * 0.7;
      const c = Math.cos(yaw), s = Math.sin(yaw);
      const big = kickRnd() < 0.25;
      live.push({
        x: x + lx * c - lz * s, y: 0.05, z: z + lx * s + lz * c,
        vx: v * (0.25 + kickRnd() * 0.35), vy: 1.0 + kickRnd() * (big ? 1.4 : 2.6), vz: (kickRnd() - 0.5) * 1.6,
        size: big ? 0.035 + kickRnd() * 0.03 : 0.012 + kickRnd() * 0.02,
        rot: kickRnd() * 6.28, spin: (kickRnd() - 0.5) * 20, age: 0, landed: -1,
        col: CLOD_COLOURS[Math.floor(kickRnd() * CLOD_COLOURS.length)],
      });
    }
  }
  // Fly, fall, land, then settle into the turf.
  for (let i = live.length - 1; i >= 0; i--) {
    const c = live[i];
    c.age += dt;
    if (c.landed < 0) {
      c.vy -= 9.8 * dt; c.x += c.vx * dt; c.y += c.vy * dt; c.z += c.vz * dt; c.rot += c.spin * dt;
      if (c.y <= c.size * 0.5) { c.y = c.size * 0.5; c.landed = c.age; }
    }
    if ((c.landed >= 0 && c.age - c.landed > 0.35) || c.age > 3) live.splice(i, 1);
  }
}
function drawKick() {
  live.forEach((c, i) => {
    const fade = c.landed >= 0 ? Math.max(0, 1 - (c.age - c.landed) / 0.35) : 1;
    _p.set(toWorldX(c.x), c.y, toWorldZ(c.z)); _q.setFromEuler(_e.set(c.rot, c.rot * 0.7, 0)); _s.setScalar(c.size * (0.4 + 0.6 * fade));
    clods.setMatrixAt(i, _m.compose(_p, _q, _s));
    clods.setColorAt(i, c.col);
  });
  clods.count = live.length;
  clods.instanceMatrix.needsUpdate = true;
  if (clods.instanceColor) clods.instanceColor.needsUpdate = true;
}

function sample(t) {
  const f = t / timeline.dt;
  const i = Math.min(Math.floor(f), timeline.frames.length - 2), k = Math.min(1, f - i);
  return timeline.frames[i].map((a, j) => { const b = timeline.frames[i + 1][j]; return a.map((v, n) => v + (b[n] - v) * k); });
}

// ---------- Loop ----------
const toRunEl = document.getElementById("toRun"), toRunLabel = document.querySelector(".togo span");
const clock = new THREE.Clock();
let framesDrawn = 0, stillFrames = 0, kickWarm = false;
function frame() {
  const t0 = performance.now();
  const rawDt = clock.getDelta();
  const dt = Math.min(rawDt, 0.05);
  if (runners.length && !params.has("still")) perf.tick(rawDt);
  if (!state.paused) { state.t += dt; if (state.t > T_END) { state.t = T_START; snap = true; } }
  const now = sample(state.t);
  let leader = -1e9, sum = 0;
  runners.forEach((r, i) => {
    const [x, z, v, eff, yaw] = now[i];
    const wx = toWorldX(x), wz = toWorldZ(z);                 // along the course -> world
    r.obj.position.set(wx, 0, wz);
    r.obj.rotation.y = DIR < 0 ? Math.PI + yaw : -yaw;        // the model faces +x; turned to run towards -x
    _p.set(toWorldX(x - 0.15), 0.04, wz); _q.setFromEuler(_e.set(-Math.PI / 2, 0, DIR < 0 ? yaw : -yaw, "YXZ")); _s.set(3.0, 1.05, 1);
    contact.setMatrixAt(i, _m.compose(_p, _q, _s));
    r.effort += (eff - r.effort) * Math.min(1, dt * 2);
    const set = (n, w) => r.actions[n] && r.actions[n].setEffectiveWeight(w);
    const e = r.effort;
    set("ride_quiet", Math.max(0, 1 - e)); set("ride_push", e <= 1 ? e : 2 - e); set("ride_drive", Math.max(0, e - 1));
    set("gallop", 1 - e / 4); set("gallop_drive", e / 4);
    r.mixer.timeScale = THREE.MathUtils.clamp(v / STRIDE_SPEED, 0.25, 1.4);
    r.mixer.update(state.paused ? 0 : dt);
    leader = Math.max(leader, x); sum += x;
  });
  if (!runners.length) leader = 0;
  contact.count = runners.length; contact.instanceMatrix.needsUpdate = true;
  if (runners.length) {
    if (!kickWarm) {                     // jumping into the middle of a race: let the air fill with clods first
      kickWarm = true;
      for (let k = 30; k > 0; k--) stepKick(1 / 30, sample(Math.max(0, state.t - k / 30)));
    }
    if (!state.paused) stepKick(dt, now);
    drawKick();
  }
  const packX = runners.length ? sum / runners.length : 0;

  const [pos, look, fov] = cameraTarget(toWorldX(leader), toWorldX(packX));
  const k = snap ? 1 : 1 - Math.exp(-dt * 3);
  camera.position.lerp(pos, k);
  focus.lerp(look, k);
  camera.fov += (fov - camera.fov) * k;
  camera.updateProjectionMatrix();
  camera.lookAt(focus);
  snap = false;
  const sunAt = new THREE.Vector3(toWorldX(packX), 0, MID_Z);
  sun.position.copy(sunAt).add(SUN_OFFSET); sun.target.position.copy(sunAt);
  scene.userData.sky.position.copy(camera.position);
  if (CROWD.uniforms) {
    CROWD.uniforms.uTime.value = performance.now() / 1000;
    CROWD.uniforms.uLeaderX.value = runners.length ? toWorldX(leader) : 1e6;
    // who gets the detailed figure: redone when the camera has moved a few metres, or the quality changed
    const moved = CROWD.lastPos ? CROWD.lastPos.distanceTo(camera.position) : Infinity;
    if (CROWD.last < 0 || moved > 6) { updateCrowd(camera); CROWD.last = 1; CROWD.lastPos = camera.position.clone(); }
  }

  const left = (POST - leader) / FURLONG;
  toRunEl.textContent = left <= 0 ? "Finished" : left < 1 ? Math.round(left * 220) + " yds" : left.toFixed(1).replace(/\.0$/, "") + "f";
  toRunLabel.hidden = left <= 0;

  const every = QUALITY[qLevel].shadowEvery;
  sun.shadow.autoUpdate = every === 1;
  if (every > 1 && framesDrawn % every === 0) sun.shadow.needsUpdate = true;
  const t1 = performance.now();
  renderer.info.reset();
  renderer.render(scene, camera);
  framesDrawn++;
  diag.js += t1 - t0; diag.draw += performance.now() - t1; diag.n++;
  // ?still=1 (used for checking screenshots): draw a few frames once loaded, then stop.
  if (params.has("still") && runners.length && texturesPending === 0 && ++stillFrames >= 3) {
    window.__count = (key) => {                               // checking aid: triangles drawn with one layer hidden
      const L = key ? LAYERS[key] : []; L.forEach((o) => (o.visible = false));
      renderer.info.reset(); renderer.render(scene, camera); const t = renderer.info.render.triangles;
      L.forEach((o) => (o.visible = true)); return t;
    };
    window.__ready = true; window.__info = `${renderer.info.render.calls} draw calls, ${(renderer.info.render.triangles / 1000).toFixed(0)}k triangles`; return;
  }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
