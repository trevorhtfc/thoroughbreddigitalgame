<!doctype html>
<meta charset="utf-8">
<title>Final Furlong</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500;600&family=Cormorant+SC:wght@600;700&display=swap">
<style>
/* The race view's last furlong at Ascot, on the full course (courses/ascot.json, courses/ascot-view.json):
   the 507 m main stand on the horses' left, the planting belts and boards round the far rails.
   Panels use the board's cream, bottle green and gold. */
:root {
  --cream: #f4ead2;
  --cream-edge: #b8954a;
  --green: #1f5a38;
  --green-ink: #183f2a;
  --ink-soft: #4f5d4a;
  --display: "Cormorant SC", "Times New Roman", serif;
  --body: "Jost", "Helvetica Neue", Arial, sans-serif;
  color-scheme: light;
}
[hidden] { display: none !important; }
html, body { height: 100%; margin: 0; }
body { background: #5f8a44; color: var(--green-ink); font-family: var(--body); overflow: hidden; }
#scene { position: fixed; inset: 0; display: block; width: 100%; height: 100%; }

.plate {
  position: fixed;
  top: calc(env(safe-area-inset-top, 0px) + 14px);
  left: max(16px, env(safe-area-inset-left, 0px));
  background: var(--cream);
  border: 1px solid var(--cream-edge);
  box-shadow: 0 0 0 3px var(--cream), 0 0 0 4px var(--cream-edge), 0 6px 18px rgba(40, 40, 20, 0.25);
  border-radius: 3px;
  padding: 8px 16px 9px;
  display: flex; gap: 18px; align-items: center;
}
.plate h1 { margin: 0; font-family: var(--display); font-size: 1.45rem; letter-spacing: 0.08em; color: var(--green); line-height: 1; }
.plate p { margin: 2px 0 0; font-size: 0.78rem; letter-spacing: 0.04em; color: var(--ink-soft); }
.plate .togo { text-align: right; border-left: 1px solid rgba(184, 149, 74, 0.6); padding-left: 16px; }
.plate .togo strong { display: block; font-family: var(--display); font-size: 1.35rem; color: var(--green); line-height: 1; font-variant-numeric: tabular-nums; }
.plate .togo span { font-size: 0.7rem; letter-spacing: 0.12em; text-transform: uppercase; color: var(--ink-soft); }

/* The race dock along the bottom: the running order, the course map and the pace (reads only the timeline). */
:root { --dock-h: 0px; }
.dock {
  position: fixed; left: max(12px, env(safe-area-inset-left, 0px)); right: max(12px, env(safe-area-inset-right, 0px));
  bottom: calc(env(safe-area-inset-bottom, 0px) + 10px);
  display: grid; grid-template-columns: 176px minmax(0, 1fr) 196px; gap: 10px; align-items: stretch;
  background: var(--cream); border: 1px solid var(--cream-edge); border-radius: 3px;
  box-shadow: 0 0 0 3px var(--cream), 0 0 0 4px var(--cream-edge), 0 6px 18px rgba(40, 40, 20, 0.25);
  padding: 8px 10px;
}
.dock h2 { margin: 0 0 4px; font: 600 0.62rem var(--body); letter-spacing: 0.14em; text-transform: uppercase; color: var(--ink-soft); }
.dock-map svg { display: block; width: 100%; height: 86px; }
.dock-order { min-width: 0; display: flex; flex-direction: column; }
.order-strip { position: relative; height: 70px; overflow-x: auto; overflow-y: hidden; scrollbar-width: thin; }
.chip {
  position: absolute; top: 0; left: 0; width: 50px; height: 64px; box-sizing: border-box;
  display: grid; justify-items: center; align-content: start; gap: 1px; padding-top: 2px;
  border: 1px solid rgba(184, 149, 74, 0.55); border-radius: 3px; background: #fbf5e4;
  transition: transform 0.45s ease; font-variant-numeric: tabular-nums;
}
.in-game #races { display: none; }
.chip.mine { box-shadow: inset 0 0 0 2px #b79042; }
.chip.lead { border-color: var(--cream-edge); box-shadow: inset 0 0 0 1px var(--cream-edge); background: #fff8e2; }
.chip .pos { font: 600 0.62rem var(--body); color: var(--ink-soft); line-height: 1; }
.chip img { width: 24px; height: 30px; object-fit: contain; display: block; }
.chip .no { position: absolute; top: 15px; right: 2px; min-width: 14px; height: 14px; border-radius: 2px; background: var(--green); color: var(--cream); font: 600 0.6rem/14px var(--body); text-align: center; padding: 0 2px; }
.chip .gap { font: 500 0.66rem var(--body); color: var(--green-ink); line-height: 1; white-space: nowrap; }
.dock-pace { display: flex; flex-direction: column; gap: 3px; }
.pace-verdict { display: flex; align-items: baseline; gap: 8px; }
.pace-verdict strong { font-family: var(--display); font-size: 1.3rem; color: var(--green); line-height: 1; }
.pace-verdict span { font-size: 0.68rem; color: var(--ink-soft); }
.sections { display: flex; gap: 2px; height: 16px; align-items: stretch; }
.sections i { display: block; border-radius: 2px; background: rgba(31, 90, 56, 0.12); }
.sections i[data-band="Fast"] { background: #b5523b; }
.sections i[data-band="Strong"] { background: #d39a3d; }
.sections i[data-band="Even"] { background: #4f8a5c; }
.sections i[data-band="Slow"] { background: #6f88a6; }
.pace-key { display: flex; flex-wrap: wrap; gap: 2px 8px; font-size: 0.6rem; color: var(--ink-soft); }
.pace-key b { display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin-right: 3px; vertical-align: -1px; }
.going { font-size: 0.7rem; color: var(--green-ink); }
@media (max-width: 700px) {
  .dock { grid-template-columns: 96px minmax(0, 1fr); grid-template-areas: "map pace" "order order"; gap: 4px 10px; padding: 6px 8px; left: 8px; right: 8px; bottom: calc(env(safe-area-inset-bottom, 0px) + 8px); }
  .dock-map { grid-area: map; } .dock-pace { grid-area: pace; gap: 2px; } .dock-order { grid-area: order; }
  .dock h2 { display: none; }
  .dock-map svg { height: 52px; }
  .order-strip { height: 58px; }
  .chip { width: 42px; height: 56px; }
  .chip img { width: 20px; height: 24px; }
  .chip .no { top: 12px; }
  .pace-verdict strong { font-size: 1.05rem; }
  .pace-verdict span, .going { font-size: 0.64rem; }
  .sections { height: 10px; }
  .pace-key { display: none; }
}
.bar {
  position: fixed; left: 50%; transform: translateX(-50%);
  bottom: calc(env(safe-area-inset-bottom, 0px) + 14px + var(--dock-h));
  max-width: calc(100% - 32px);
  background: var(--cream);
  border: 1px solid var(--cream-edge);
  border-radius: 3px;
  box-shadow: 0 6px 18px rgba(40, 40, 20, 0.25);
  padding: 6px 8px;
  display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: center; justify-content: center;
}
.showbar {
  position: fixed; right: max(12px, env(safe-area-inset-right, 0px)); bottom: calc(env(safe-area-inset-bottom, 0px) + 12px + var(--dock-h));
  background: var(--cream); border: 1px solid var(--cream-edge); box-shadow: 0 4px 12px rgba(40, 40, 20, 0.25); opacity: 0.85;
}
.group { display: flex; gap: 4px; align-items: center; }
.group > span { font-size: 0.68rem; letter-spacing: 0.12em; text-transform: uppercase; color: var(--ink-soft); margin-right: 2px; }
button {
  font: 500 0.82rem var(--body); color: var(--green-ink); cursor: pointer;
  background: transparent; border: 1px solid rgba(31, 90, 56, 0.35); border-radius: 3px; padding: 5px 9px;
}
button[aria-pressed="true"] { background: var(--green); color: var(--cream); border-color: var(--green); }
/* the race card: which race, the going, how many runners and the race's seed (each reloads the page) */
select, .seed {
  font: 500 0.82rem var(--body); color: var(--green-ink); background: transparent;
  border: 1px solid rgba(31, 90, 56, 0.35); border-radius: 3px; padding: 4px 4px; height: 28px; box-sizing: border-box;
}
.seed { width: 4.6em; padding: 4px 6px; font-variant-numeric: tabular-nums; }
#races { flex-wrap: wrap; justify-content: center; }
select:focus-visible, .seed:focus-visible { outline: 2px solid var(--cream-edge); outline-offset: 2px; }
button:focus-visible { outline: 2px solid var(--cream-edge); outline-offset: 2px; }
.fps { font-variant-numeric: tabular-nums; font-size: 0.75rem; opacity: 0.8; min-width: 6.5em; }
.diag {
  position: fixed; top: 10px; right: 10px; z-index: 5; max-width: 360px; padding: 8px 10px;
  background: rgba(20, 30, 22, 0.86); color: #f3ead2; border-radius: 3px; font: 12px/1.45 ui-monospace, Menlo, monospace;
}
.diag #diagText { white-space: pre-wrap; }
.diag-sw { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px; }
.diag-sw button { font-size: 0.72rem; padding: 3px 6px; }
.loading {
  position: fixed; inset: 0; display: grid; place-items: center; pointer-events: none;
  font-family: var(--display); font-size: 1.4rem; letter-spacing: 0.1em; color: var(--cream);
  text-shadow: 0 1px 3px rgba(0, 0, 0, 0.4);
}
@media (max-width: 600px) {
  .plate { padding: 6px 12px; gap: 12px; }
  .plate h1 { font-size: 1.15rem; }
  .plate p { display: none; }
  .bar { gap: 4px 10px; padding: 5px 6px; }
  .group > span { display: none; }
  button { padding: 5px 7px; font-size: 0.78rem; }
  select, .seed { font-size: 0.78rem; height: 27px; }
  .seed { width: 4em; }
}
</style>

<script>
// If the page can't start (an older browser, a blocked download), say so on screen instead of hanging, with
// what to pass on. The module code below clears window.__started when it runs.
(function () {
  const show = (msg) => {
    const el = document.getElementById("loading");
    if (!el || el.hidden) return;
    el.style.pointerEvents = "auto"; el.style.font = "500 15px/1.5 Jost, Helvetica, Arial, sans-serif";
    el.style.letterSpacing = "0"; el.style.textAlign = "center"; el.style.padding = "0 24px";
    el.textContent = msg + " Browser: " + navigator.userAgent;
  };
  window.addEventListener("error", (e) => {
    if (e.target && e.target !== window && e.target.tagName !== "SCRIPT") return;        // an image or font: not fatal
    if (e.target && e.target.src && e.target.src.includes("es-module-shims")) return;     // the shim itself is optional
    show("The course didn't start: " + (e.message || "a script failed to load") + ".");
  }, true);
  window.addEventListener("unhandledrejection", (e) => show("The course didn't start: " + ((e.reason && e.reason.message) || e.reason) + "."));
  setTimeout(() => {
    if (window.__started) return;
    const maps = typeof HTMLScriptElement !== "undefined" && HTMLScriptElement.supports && HTMLScriptElement.supports("importmap");
    show(maps ? "The course is taking a long time to start. If nothing changes, send Claude a screenshot." : "This browser is too old for the 3D race view (it can't load the 3D library). Updating Safari, or using Chrome, will fix it.");
  }, 20000);
})();
</script>

<script type="module">
import * as THREE from "three";
import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";
import { MeshoptDecoder } from "three/addons/libs/meshopt_decoder.module.js";
import * as SkeletonUtils from "three/addons/utils/SkeletonUtils.js";
import { RoomEnvironment } from "three/addons/environments/RoomEnvironment.js";
import { mergeGeometries, mergeVertices } from "three/addons/utils/BufferGeometryUtils.js";
import { SimplifyModifier } from "three/addons/modifiers/SimplifyModifier.js";
import * as HorseV2 from "./horse-v2.js";
// The race engine (race-engine/ in the repo; a copy lives in assets/engine/): it decides the race, the view plays it back.
import { runRace } from "./assets/engine/engine.js";
import { randomField } from "./assets/engine/field.js";

window.__started = true;
const params = new URLSearchParams(location.search);
// In the game (Thoroughbred Ascot opens this page with ?game=1): ask the game for the race and wait for it. The game
// sends the race (a key of courses/ascot-view.json -> races), the going, the seed and every runner's racecard in stall
// order, plus names, 3D silks and coats; the view runs the race engine on exactly those, so it gives the game's result.
const GAME = params.has("game");
const GP = GAME ? await new Promise((res) => {
  addEventListener("message", (e) => { if (e.data && e.data.type === "race") res(e.data); });
  parent.postMessage({ type: "ready" }, "*");
}) : null;
if (GP) {
  params.set("race", GP.race); params.set("going", GP.going); params.set("seed", String(GP.seed)); params.set("runners", String(GP.runners.length));
  document.documentElement.classList.add("in-game");
}
const toGame = (msg) => { if (GAME) parent.postMessage(msg, "*"); };

// ---------- Data (all engine-neutral files) ----------
const COURSE = await fetch("assets/course/ascot.json").then((r) => r.json());          // the layout (world axes)
const VIEW = await fetch("assets/course/ascot-view.json").then((r) => r.json());        // cameras, director, paths, trees
const SILK_DATA = await fetch("assets/silks-catalogue.json").then((r) => r.json());
const SILKS = SILK_DATA.silks;
const silkFor = (i) => (GP && SILKS.find((s) => s.id === GP.runners[i].silk)) || SILKS[(i * 5 + 2) % SILKS.length];   // runner i (stall i + 1) wears these colours
// Par times and the going (courses/ascot-standards.json, shared with the race engine): the dock's pace reading.
const STANDARDS = await fetch("assets/course/ascot-standards.json").then((r) => r.json());
const GOING = STANDARDS.going[params.get("going")] ? params.get("going") : "Good";
const COATS = [
  { name: "Bay",      body: "#7a4a2a", points: "#1d1714" },
  { name: "Brown",    body: "#4a2e1c", points: "#17110d" },
  { name: "Chestnut", body: "#a3552c", points: "#6a3317" },
  { name: "Black",    body: "#2b2523", points: "#141110" },
  { name: "Grey",     body: "#a8a6a0", points: "#6d6b66" },
];
const coatFor = (i) => (GP && GP.runners[i].coat) || COATS[(i * 3 + 1) % COATS.length];
const RACE_ID = VIEW.races[params.get("race")] ? params.get("race") : "long";
const RACE = VIEW.races[RACE_ID];
const ROUND = RACE.course !== "straight";            // round course or round mile: the TV director's round-course rules
// Where the stalls stand and each stall's draw (courses/ascot-stalls.json, tools/course/place_stalls.py); the race
// engine reads the same file. The race starts as the gates open: race time 0, distance 0.
const STALLS = await fetch("assets/course/ascot-stalls.json").then((r) => r.json());
const START = STALLS.starts[RACE.start];
const PRE = VIEW.startSequence;
document.getElementById("courseName").textContent = GP ? `${COURSE.name} · ${GP.title}` : COURSE.name + " · " + RACE.label.toLowerCase();

// World axes (courses/ascot.json): x east, z south, y up; the winning post on the inside rail is the origin.
// On the home straight the horses run towards -x between the inside rail (z 0) and the outer rail (z 30);
// the stand's front is on z 45.4, on their left. The race itself is worked out along the course
// (u = metres run since the start, v = across the track, 0 in the middle, + towards the outer rail) and
// turned into world positions only to draw it, along the race's course path:
//   round: the round course's inside rail, a closed loop in running order from the post, so a race longer
//          than the loop passes the post more than once; straight: the straight mile's inside rail (z 0).
const FURLONG = COURSE.furlong;
const STRIDE_SPEED = 14.6;   // m/s at which the gallop loop matches the ground at scale 3
// Which horse and jockey: the current one (v1, the default) or the quality test (?horse=v2, horse-v2.js).
const HORSE_V = params.get("horse") === "v2" ? "v2" : "v1";
const HORSE_SCALE = 3;
const HALF_W = COURSE.trackWidth / 2;
const MID_Z = VIEW.homeStraight.centreZ;
const DIST = RACE.distance;                          // u at the winning line
const LOOP = (() => {
  const pts = COURSE.roundCourse.insideRail.points, n = pts.length, sp = COURSE.roundCourse.insideRail.spacing;
  const tan = pts.map((_, i) => {                                     // direction at each sample: across its neighbours
    const [px, pz] = pts[(i - 1 + n) % n], [qx, qz] = pts[(i + 1) % n], l = Math.hypot(qx - px, qz - pz) || 1;
    return [(qx - px) / l, (qz - pz) / l];
  });
  return { pts, n, sp, length: n * sp, tan };
})();
// The round mile starts up the chute (roundMileSpur), a straight run that joins the loop.
const SPUR = (() => {
  const s = COURSE.roundMileSpur, [fx, fz] = s.from, [tx, tz] = s.to, l = Math.hypot(tx - fx, tz - fz);
  return { join: s.distanceToGoAtJoin, len: l, to: s.to, dir: [(tx - fx) / l, (tz - fz) / l] };
})();
// A race longer than the loop passes its own start again (2 miles): its stalls are towed away after the off.
const STALLS_COME_BACK = RACE.course === "round" && DIST > LOOP.length - 50;
// Point on the race's inside rail with d metres still to run, and the running direction there.
function railAt(d) {
  if (RACE.course === "straight") return { x: d, z: 0, tx: -1, tz: 0 };
  if (RACE.course === "roundMile" && d > SPUR.join - 15) {
    const [dx, dz] = SPUR.dir, k = d - SPUR.join;
    if (k >= 15) return { x: SPUR.to[0] - dx * k, z: SPUR.to[1] - dz * k, tx: dx, tz: dz };
    // the last 15 m of the chute and the first 15 m of the loop blend one line into the other
    const a = loopAt(d), w = THREE.MathUtils.smoothstep(k, -15, 15), cx = SPUR.to[0] - dx * k, cz = SPUR.to[1] - dz * k;
    const tx = a.tx + (dx - a.tx) * w, tz = a.tz + (dz - a.tz) * w, tl = Math.hypot(tx, tz) || 1;
    return { x: a.x + (cx - a.x) * w, z: a.z + (cz - a.z) * w, tx: tx / tl, tz: tz / tl };
  }
  return loopAt(d);
}
function loopAt(d) {
  const L = LOOP.length, s = (((-d) % L) + L) % L, f = s / LOOP.sp, i = Math.floor(f) % LOOP.n, j = (i + 1) % LOOP.n, k = f - Math.floor(f);
  const [ax, az] = LOOP.pts[i], [bx, bz] = LOOP.pts[j];
  // the running direction blends smoothly from one 5 m sample to the next: a direction that stepped at
  // each sample made the horses, the tracking car and the camera's aim twitch every third of a second on the bends
  const ta = LOOP.tan[i], tb = LOOP.tan[j];
  let tx = ta[0] + (tb[0] - ta[0]) * k, tz = ta[1] + (tb[1] - ta[1]) * k;
  const tl = Math.hypot(tx, tz) || 1;
  return { x: ax + (bx - ax) * k, z: az + (bz - az) * k, tx: tx / tl, tz: tz / tl };
}
// u along, v across -> world x, z (the outer side is on the horses' left: clockwise course)
function toWorld(u, v) {
  const r = railAt(DIST - u), w = HALF_W + v;
  return [r.x + r.tz * w, r.z - r.tx * w];
}
// the model faces +x; turned to run along the course, plus its own drift across (yaw)
const headingAt = (u, yaw) => { const r = railAt(DIST - u); return Math.atan2(-r.tz, r.tx) + yaw; };
const FRONT = COURSE.grandstand.frontLine;

// ---------- Renderer ----------
const canvas = document.getElementById("scene");
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, powerPreference: "high-performance", preserveDrawingBuffer: params.has("still") });
renderer.info.autoReset = false;
const LAYERS = { horses: [], trees: [], rails: [], kick: [], buildings: [], crowd: [], stalls: [] };   // for the diagnostics panel
renderer.shadowMap.enabled = true;
// Colour handled as Blender handles the stills: AgX, lifted a third of a stop.
renderer.toneMapping = THREE.AgXToneMapping;
renderer.toneMappingExposure = Math.pow(2, 0.35);

// Quality presets. Most of the cost is filling pixels: a Retina Mac at full resolution draws four
// times the pixels of a normal screen, each multisampled and shadowed. "Auto" starts at Medium on
// high-resolution screens (High elsewhere) and steps down by itself if the frame rate drops.
const DPR = window.devicePixelRatio || 1;
const QUALITY = {
  high:   { label: "High",   scale: Math.min(DPR, 2),    samples: 4, shadow: 4096, soft: true,  kick: 1,    edges: true, shadowEvery: 1, crowd: 0.7 },

const loader = new GLTFLoader().setMeshoptDecoder(MeshoptDecoder);   // the baked scenery is meshopt-compressed
async function loadModel(dir, name) {
  const text = (f) => fetch(`${dir}/${f}`).then((r) => { if (!r.ok) throw new Error(f + " " + r.status); return r.text(); });
  // Big geometry comes in parts (tools/web/glb_to_web.py notes how many in extras.geometryParts).
  const json = await text(`${name}.json`);
  const parts = (JSON.parse(json).extras || {}).geometryParts;
  const b64 = parts ? (await Promise.all(Array.from({ length: parts }, (_, k) => text(`${name}-geometry-${k}.txt`)))).map((s) => s.trim()).join("")
                    : await text(`${name}-geometry.txt`);
  const raw = atob(b64.trim());
  const bin = new Uint8Array(raw.length);
  for (let i = 0; i < raw.length; i++) bin[i] = raw.charCodeAt(i);
  const pad = (n) => (n + 3) & ~3;
  const jsonBytes = new TextEncoder().encode(json);
  const jLen = pad(jsonBytes.length), bLen = pad(bin.length);
  const glb = new Uint8Array(12 + 8 + jLen + 8 + bLen);
  const dv = new DataView(glb.buffer);
  dv.setUint32(0, 0x46546c67, true); dv.setUint32(4, 2, true); dv.setUint32(8, glb.length, true);
  dv.setUint32(12, jLen, true); dv.setUint32(16, 0x4e4f534a, true);
  glb.fill(0x20, 20, 20 + jLen); glb.set(jsonBytes, 20);
  const b0 = 20 + jLen;
  dv.setUint32(b0, bLen, true); dv.setUint32(b0 + 4, 0x004e4942, true);
  glb.set(bin, b0 + 8);

}

// ---------- The track, its rails and poles (course data; the pieces from Blender) ----------
// Is a world point (x, z) on the turf? The first ring is the outline, the rest are holes.
function inRing(r, x, z) {
  let inside = false;
  for (let i = 0, j = r.length - 1; i < r.length; j = i++) {
    const [xi, zi] = r[i], [xj, zj] = r[j];
    if ((zi > z) !== (zj > z) && x < ((xj - xi) * (z - zi)) / (zj - zi) + xi) inside = !inside;
  }
  return inside;
}
const SURF = COURSE.track.surface;
const onTrack = (x, z) => inRing(SURF[0], x, z) && !SURF.slice(1).some((h) => inRing(h, x, z));
function distToRails(x, z) {
  let best = Infinity;
  for (const line of COURSE.rails.lines) {
    for (let i = 1; i < line.length; i++) {
      const [ax, az] = line[i - 1], [bx, bz] = line[i];
      const dx = bx - ax, dz = bz - az, L2 = dx * dx + dz * dz || 1;
      const t = Math.max(0, Math.min(1, ((x - ax) * dx + (z - az) * dz) / L2));
      best = Math.min(best, Math.hypot(x - ax - t * dx, z - az - t * dz));
    }
  }
  return best;
}

// The turf right round the course, for wherever the baked ground stops, with the soft mown lanes along the
// running line (courses/ascot-view.json -> lanes; the ground bake draws the same stripes).
// The ground layers (plain grass, this turf, the baked ground) lie a few centimetres apart: far off the depth
// buffer can't tell them apart and they flashed. So the two underneath are drawn first and write no depth,
// and the baked ground simply paints over them.
function lanesMaterial(mat) {
  const L = VIEW.lanes;

  const lt = texLoader.load("assets/course/" + L.map);
  lt.flipY = false; lt.colorSpace = THREE.NoColorSpace; lt.minFilter = THREE.LinearFilter; lt.generateMipmaps = false;
  mat.onBeforeCompile = (sh) => {
    sh.uniforms.lanesMap = { value: lt };
    sh.uniforms.lanesArea = { value: new THREE.Vector4(...L.area) };
    sh.uniforms.lanesK = { value: new THREE.Vector3(L.maxDist, Math.PI * L.lanes / L.width, L.strength) };
    sh.vertexShader = sh.vertexShader
      .replace("#include <common>", "#include <common>\nuniform vec4 lanesArea; varying vec2 vLaneUv;")
      .replace("#include <fog_vertex>", `#include <fog_vertex>
        { vec4 wp = modelMatrix * vec4(transformed, 1.0); vLaneUv = (wp.xz - lanesArea.xy) / (lanesArea.zw - lanesArea.xy); }`);
    sh.fragmentShader = sh.fragmentShader
      .replace("#include <common>", "#include <common>\nuniform sampler2D lanesMap; uniform vec3 lanesK; varying vec2 vLaneUv;")
      .replace("#include <color_fragment>", `#include <color_fragment>
        { float d = texture2D(lanesMap, vLaneUv).r * lanesK.x; diffuseColor.rgb *= 1.0 + lanesK.z * cos(lanesK.y * d); }`);
  };

  for (const h of SURF.slice(1)) shape.holes.push(new THREE.Path(h.map(([x, z]) => new THREE.Vector2(x, -z))));
  const g = new THREE.ShapeGeometry(shape).rotateX(-Math.PI / 2);

function placeProps(gltf) {
  const byName = (n) => gltf.scene.getObjectByName(n);
  gltf.scene.traverse((o) => { if (o.isMesh) { o.castShadow = true; o.receiveShadow = true; o.material.roughness = 0.6; } });
  // Rails: one instanced module (3 m, its track side towards -z) laid along each rail line of the course.
  const SPACING = 3;
  const parts = [];
  byName("rail_module").traverse((o) => { if (o.isMesh) parts.push(o); });
  // The finish-line assembly brings its own 30 m of rail on the far side at the post.
  const gap = (x, z) => Math.abs(z + COURSE.rails.gap) < 1.5 && x > -16.7 && x < 16.3;
  const spots = [];
  for (const line of COURSE.rails.lines) {
    // walk the line in 3 m steps
    const pts = [];
    let carry = 0;
    for (let i = 1; i < line.length; i++) {
      const [ax, az] = line[i - 1], [bx, bz] = line[i];
      const L = Math.hypot(bx - ax, bz - az);
      for (let d = carry; d < L; d += SPACING) pts.push([ax + (bx - ax) * d / L, az + (bz - az) * d / L]);
      carry = (carry - L) % SPACING; if (carry < 0) carry += SPACING;
    }
    // which way round: the module's track side (local -z) must face the turf
    const [p0, p1] = [pts[0], pts[1]];
    const dx = p1[0] - p0[0], dz = p1[1] - p0[1];
    const flip = !onTrack(p0[0] + dx * 0.5 + dz * 1.0, p0[1] + dz * 0.5 - dx * 1.0);
    for (let i = 0; i + 1 < pts.length; i++) {
      let [a, b] = [pts[i], pts[i + 1]];
      if (flip) [a, b] = [b, a];
      if (gap((a[0] + b[0]) / 2, (a[1] + b[1]) / 2)) continue;
      spots.push([a[0], a[1], Math.atan2(-(b[1] - a[1]), b[0] - a[0])]);
    }
  }
  // in chunks of 20, so the rail out of shot isn't drawn
  const m = new THREE.Matrix4(), q = new THREE.Quaternion(), one = new THREE.Vector3(1, 1, 1), up = new THREE.Vector3(0, 1, 0), p = new THREE.Vector3();
  const CHUNK = 20;
  for (const part of parts) {
    for (let c0 = 0; c0 < spots.length; c0 += CHUNK) {
      const n = Math.min(CHUNK, spots.length - c0);
      const rails = new THREE.InstancedMesh(part.geometry, part.material, n);
      for (let i = 0; i < n; i++) {
        const [x, z, yaw] = spots[c0 + i];
        rails.setMatrixAt(i, m.compose(p.set(x, 0, z), q.setFromAxisAngle(up, yaw), one));
      }
      rails.computeBoundingSphere();
      rails.castShadow = rails.receiveShadow = true;
      scene.add(rails);
      LAYERS.rails.push(rails);
    }
  }
  // Furlong poles beyond the inside rail, up the straight mile (the round course shares the first three).
  for (const f of COURSE.straightMile.furlongPoles) {
    const node = byName("furlong_" + f.furlongs);
    if (!node) continue;
    const pole = node.clone();
    pole.position.set(f.at[0], 0, f.at[1] - COURSE.rails.gap - 0.7);
    scene.add(pole);
  }
}

// ---------- The starting stalls (tools/blender/build_stalls.py; placed from courses/ascot-stalls.json) ----------
// The kit is one bay that repeats, a closing partition, an end tower, two half-gates and the numbers. The row is
// laid out in the start's own frame: x from the inside rail across the track, z the way the horses run.
// Everything that doesn't move is merged into one mesh per material; the gates are instanced so they can swing.
const STALL_GATES = [];                                   // { mesh, local (piece in the gate's frame), hinge, sign }

function buildStalls(gltf, kit) {

  const [x0, z0] = S.insideRailAt, [ox, oz] = S.towardsOuterRail, [rx, rz] = S.runningDirection;
  const row = new THREE.Matrix4().makeBasis(new THREE.Vector3(ox, 0, oz), new THREE.Vector3(0, 1, 0), new THREE.Vector3(rx, 0, rz)).setPosition(x0, 0, z0);
  const at = (x, y = 0) => new THREE.Matrix4().makeTranslation(x, y, 0);
  const place = [];                                       // [node name, matrix in the row's frame]
  const units = STALLS.unitsForField[n];
  const left = (k) => S.stalls[k - 1].fromInsideRail - P / 2;          // a stall's left edge, from the inside rail
  units.forEach(([a, b], u) => {
    place.push(["stall_tower", at(left(a) - T)]);
    for (let k = a; k <= b; k++) {
      place.push(["stall_bay", at(left(k))]);
      place.push(["stall_num_" + k, at(left(k) + kit.numberBoard.centre[0], kit.numberBoard.centre[1])]);
    }
    place.push(["stall_partition", at(left(b) + P)]);
    // a plaque over every few bays along the top board (none over a group too short for it)
    const every = STALLS.kit.plaqueEvery || 5;
    for (let g = a; g <= b; g += every) {
      const h = Math.min(g + every - 1, b);
      if (h - g >= 2) place.push(["stall_plaque", at((left(g) + left(h) + P) / 2, kit.plaque.height)]);

  gltf.scene.updateMatrixWorld(true);

      const key = o.material.name;

    const node = gltf.scene.getObjectByName("stall_gate_" + side);
    const inv = new THREE.Matrix4().copy(node.matrixWorld).invert();
    node.traverse((o) => {
      if (!o.isMesh) return;
      const g = keep(o.geometry.clone()).applyMatrix4(new THREE.Matrix4().multiplyMatrices(inv, o.matrixWorld));
      const mesh = new THREE.InstancedMesh(g, o.material, n);
      mesh.castShadow = mesh.receiveShadow = true;
      mesh.frustumCulled = false;

  // depth, so it never flashes against the ground beneath it).
  const catcher = new THREE.Mesh(new THREE.PlaneGeometry(420, 34), new THREE.ShadowMaterial({ color: "#1d2c14", opacity: 0.38, polygonOffset: true, polygonOffsetFactor: -2, polygonOffsetUnits: -4 }));
  catcher.rotation.x = -Math.PI / 2; catcher.position.set(60, 0.03, MID_Z);
  catcher.receiveShadow = true;
  scene.add(catcher);
}

// The site components, instanced: the bake made one mesh per piece and quarter turn (bake.json -> site.kit,
// each in the piece's own axes), so the download holds each piece once however many copies stand round the
// course. Every copy in courses/ascot-site-dressing.json is drawn from it: one batch per material (one draw
// each where the browser has WEBGL_multi_draw), and copies out of shot are skipped one by one.
function placeSiteKit(gltf, info, pieces) {
  const tex = bakedTex(info.lightMap);
  const quarter = (t) => (((Math.round(t / 90) % 4) + 4) % 4);
  const byMat = new Map();
  for (const [vkey, nodeName] of Object.entries(info.kit)) {
    const node = gltf.scene.getObjectByName(nodeName);
    if (!node) { console.warn("Kit piece missing:", nodeName); continue; }
    for (const m of meshesOf(node)) {
      const name = m.material.name || "";
      if (!byMat.has(name)) byMat.set(name, { mat: bakedMaterial(m, info, tex, "site"), parts: new Map() });
      const g = m.geometry.clone().applyMatrix4(m.matrixWorld);
      for (const k of Object.keys(g.attributes)) if (!["position", "normal", "uv"].includes(k)) g.deleteAttribute(k);
      byMat.get(name).parts.set(vkey, g);
    }
  }
  const m4 = new THREE.Matrix4();
  for (const { mat, parts } of byMat.values()) {
    const use = pieces.filter((p) => parts.has(p.piece + "_q" + quarter(p.turn || 0)));
    if (!use.length) continue;
    let nv = 0, ni = 0;
    for (const g of parts.values()) { nv += g.attributes.position.count; ni += g.index.count; }
    const batch = new THREE.BatchedMesh(use.length, nv, ni, mat);
    batch.sortObjects = false;
    const ids = new Map();
    for (const [vkey, g] of parts) ids.set(vkey, batch.addGeometry(g));
    for (const p of use) {
      const id = batch.addInstance(ids.get(p.piece + "_q" + quarter(p.turn || 0)));
      batch.setMatrixAt(id, m4.makeRotationY(Math.PI + (p.turn || 0) * Math.PI / 180).setPosition(p.x, 0, p.z));
    }
    batch.castShadow = batch.receiveShadow = false;
    scene.add(batch);
    LAYERS.buildings.push(batch);
  }
  console.log("site kit:", Object.keys(info.kit).length, "pieces baked,", pieces.length, "placed,", byMat.size, "batches");
}

// Planting belts (tools/blender/build_planting.py, placed from courses/ascot-planting.json): Thoroughbred
// boards just behind the far rails, a low dense hedge closing the view at eye level, and rows of the
// leafy trees behind and above it. Lit live like the loose trees.
const TD = VIEW.treeDetail;
const isNear = (x, z) => Math.hypot(x - TD.centre[0], z - TD.centre[1]) < TD.nearRadius;
function placeBelts(gltf, planting, treeLib) {
  const hedge = gltf.scene.getObjectByName("planting_hedge");
  if (hedge) {
    for (const m of meshesOf(hedge)) {
      m.material = new THREE.MeshLambertMaterial({ vertexColors: true });
      LAYERS.trees.push(m);
    }
    scene.add(hedge);
  }
  if (!planting) return;
  const m4 = new THREE.Matrix4(), q = new THREE.Quaternion(), one = new THREE.Vector3(1, 1, 1), sc = new THREE.Vector3(), p = new THREE.Vector3(), up = new THREE.Vector3(0, 1, 0);
  const byDesign = new Map();
  for (const b of planting.boards) { if (!byDesign.has(b[3])) byDesign.set(b[3], []); byDesign.get(b[3]).push(b); }
  for (const [design, list] of byDesign) {
    const node = gltf.scene.getObjectByName("board_" + design);
    if (!node) continue;
    for (const part of meshesOf(node)) {
      const mat = new THREE.MeshLambertMaterial({ color: part.material.color, map: part.material.map || null });
      const inst = new THREE.InstancedMesh(part.geometry, mat, list.length);
      list.forEach(([x, z, turn], i) => inst.setMatrixAt(i, m4.compose(p.set(x, 0, z), q.setFromAxisAngle(up, turn * Math.PI / 180), one)));
      inst.computeBoundingSphere();
      scene.add(inst);
      LAYERS.trees.push(inst);
    }
  }
  if (treeLib) instanceTrees(treeLib, planting.trees.map(([x, z, tree, s, turn]) => ({ x, z, tree, s, turn, belt: true })));
}

// Instance tree models: full crowns near the action, light crowns further off (see treeDetail).
const treeMat = new THREE.MeshLambertMaterial({ vertexColors: true });
function instanceTrees(gltf, list) {
  const groups = new Map();
  for (const t of list) {
    const near = isNear(t.x, t.z);
    const parts = [near ? "_crown" : "_crown_far"].concat(near || !t.belt ? ["_trunk"] : []);
    for (const part of parts) {
      const key = t.tree + part;
      if (!groups.has(key)) groups.set(key, []);
      groups.get(key).push(t);
    }
  }
  const m4 = new THREE.Matrix4(), q = new THREE.Quaternion(), sc = new THREE.Vector3(), p = new THREE.Vector3(), up = new THREE.Vector3(0, 1, 0);
  for (const [key, ts] of groups) {
    const node = gltf.scene.getObjectByName(key) || gltf.scene.getObjectByName(key.replace("_far", ""));
    if (!node) continue;
    for (const mesh of meshesOf(node)) {
      const inst = new THREE.InstancedMesh(mesh.geometry, treeMat, ts.length);
      ts.forEach((t, i) => { q.setFromAxisAngle(up, (t.turn || 0) * Math.PI / 180); sc.set(t.s, t.s * (t.sy || 1), t.s); inst.setMatrixAt(i, m4.compose(p.set(t.x, 0, t.z), q, sc)); });
      inst.computeBoundingSphere();
      scene.add(inst);
      LAYERS.trees.push(inst);
    }
  }
}

// The stills' leafy trees (tools/blender/export_trees.py), scattered where courses/ascot-view.json says:
// behind the stand, round the enclosures, in the infield and beyond the bend. Vertex colours carry the
// stills' dark-base-to-sunlit-top colouring; normals are bent out from each crown's centre.
function placeTrees(gltf, dressing) {
  const names = ["oak_a", "oak_b", "oak_c", "wide_a", "wide_b", "poplar_a"];
  const rnd = seeded(11);
  const CL = VIEW.clearOf, S = CL.stand;
  const pieces = (dressing && dressing.pieces) || [];
  const clear = (x, z) => (x > S[0] && x < S[2] && z > S[1] && z < S[3])
    || onTrack(x, z) || distToRails(x, z) < CL.track
    || pieces.some((p) => Math.abs(p.x - x) < CL.pieces && Math.abs(p.z - z) < CL.pieces);
  const spots = [];
  for (const a of VIEW.trees) {
    const [x0, x1] = [Math.min(a.area[0], a.area[2]), Math.max(a.area[0], a.area[2])];
    const [z0, z1] = [Math.min(a.area[1], a.area[3]), Math.max(a.area[1], a.area[3])];
    for (let z = z0; z < z1; z += a.spacing) {
      for (let x = x0 + rnd() * a.spacing; x < x1; x += a.spacing * (0.7 + rnd() * 0.6)) {
        if (rnd() < (a.skip || 0)) continue;
        const n = a.clump ? a.clump[0] + Math.floor(rnd() * (a.clump[1] - a.clump[0] + 1)) : 1;
        for (let k = 0; k < n; k++) {
          const tx = x + (rnd() - 0.5) * (n > 1 ? 14 : a.spacing * 0.6), tz = z + (rnd() - 0.5) * (n > 1 ? 10 : a.spacing * 0.6);
          if (!clear(tx, tz)) spots.push({ x: tx, z: tz, s: a.scale[0] + rnd() * (a.scale[1] - a.scale[0]) });
        }
      }
    }
  }
  for (const sp of spots) { sp.tree = names[Math.floor(rnd() * names.length)]; sp.turn = rnd() * 360; sp.sy = 0.92 + rnd() * 0.18; }
  instanceTrees(gltf, spots);
  const m4 = new THREE.Matrix4(), q = new THREE.Quaternion(), sc = new THREE.Vector3(), p = new THREE.Vector3();
  // Soft shadows on the grass, falling away from the sun.
  console.log("trees:", spots.length);
  const shadows = new THREE.InstancedMesh(new THREE.PlaneGeometry(1, 1), new THREE.MeshBasicMaterial({ map: shadowTex, color: "#1f3318", transparent: true, opacity: 0.45, depthWrite: false, polygonOffset: true, polygonOffsetFactor: -2, polygonOffsetUnits: -4 }), spots.length);
  const sunFlat = new THREE.Vector2(-SUN_OFFSET.x, -SUN_OFFSET.z).normalize();
  const ang = Math.atan2(sunFlat.y, sunFlat.x);
  spots.forEach((t, i) => {
    const h = 11 * t.s;
    p.set(t.x + sunFlat.x * h * 0.35, 0.04, t.z + sunFlat.y * h * 0.35);
    q.setFromEuler(new THREE.Euler(-Math.PI / 2, 0, -ang, "YXZ"));
    shadows.setMatrixAt(i, m4.compose(p, q, sc.set(h * 0.95, h * 0.6, 1)));
  });
  shadows.frustumCulled = false;
  scene.add(shadows);
  LAYERS.trees.push(shadows);
}

// Crowd: four simple figures, instanced (one draw call per figure part), tinted per person. Packed along
// the near rail and thinning back to the stand, the stand's balconies, verandas and steps, the seats and
// floors on the site pieces, and the dressing's crowd areas. Full along the final furlong and round the
// post; thinner up the straight, where it is only ever seen from afar.
const CROWD_FULL = [-110, 220];
const crowdKeep = (x, rnd) => (x >= CROWD_FULL[0] && x <= CROWD_FULL[1]) || rnd() < 0.12;
function buildCrowd(gltf, data, pieceAt) {
  const rnd = seeded(21);
  const pick = (a) => a[Math.floor(rnd() * a.length)];
  const P = data.palette;
  const spots = [];
  const add = (x, y, z, seated = false) => { if (crowdKeep(x, rnd)) spots.push({ x, y, z, seated }); };
  const S0 = -102.5, S1 = 405;                                  // the stand's west and east ends
  // the lawn between the outer rail and the stand
  const nearRail = COURSE.trackWidth + COURSE.rails.gap;
  for (let z = nearRail + 1.6; z < FRONT - 1.5; z += 0.7) {
    const d = z - nearRail;
    const density = d < 4 ? 0.8 : d < 8 ? 0.35 : 0.08;
    for (let x = S0 - 6; x < S1; x += 0.62) if (rnd() < density) add(x + (rnd() - 0.5) * 0.4, 0, z + (rnd() - 0.5) * 0.4);
  }
  for (let g = 0; g < 40; g++) {
    const gx = S0 + rnd() * 360, gz = nearRail + 6 + rnd() * (FRONT - nearRail - 8);
    const n = 3 + Math.floor(rnd() * 6);
    for (let k = 0; k < n; k++) add(gx + (rnd() - 0.5) * 2.4, 0, gz + (rnd() - 0.5) * 1.8);
  }
  // the stand's verandas, balconies, galleries and steps (areas relative to the clock tower on the front line)
  for (const a of data.areas || []) {
    if (a.kind === "lawn_front_line") continue;
    const rows = a.z1 - a.z0 < 1.4 ? 1 : 2;
    for (let r = 0; r < rows; r++) {
      const lz = a.z0 + 0.15 + r * 0.75;
      for (let x = a.x0; x < a.x1; x += 0.62) {
        if (rnd() >= (a.kind === "steps" ? 0.35 : r === 0 ? 0.78 : 0.4)) continue;
        let y = a.floor;
        if (a.kind === "steps") y = 3.0 * (lz - a.z0 + 0.3) / (a.z1 - a.z0 + 0.6);
        add(x + (rnd() - 0.5) * 0.2, y, FRONT + lz);
      }
    }
  }
  // seats and floors on the site pieces
  const v = new THREE.Vector3();
  for (const p of data.dressing?.pieces || []) {
    const sp = data.spots?.[p.piece];
    if (!sp) continue;
    const at = pieceAt(p);
    for (const [kind, fill] of [["seats", 0.62], ["stand", 0.7]]) {
      for (const [lx, ly, lz] of sp[kind] || []) {
        if (rnd() >= fill) continue;
        v.set(lx, lz, -ly).applyMatrix4(at);                 // Blender (x, y, z) -> glTF (x, z, -y)
        spots.push({ x: v.x, y: v.y, z: v.z, seated: kind === "seats" });
      }
    }
  }
  // the dressing's crowd areas, keeping everyone out of the pieces' footprints (dressing.keepClear: world boxes)
  const clearBoxes = data.dressing?.keepClear || [];
  const blocked = (x, z) => clearBoxes.some((b) => x > b[0] && x < b[2] && z > b[1] && z < b[3]);
  for (const c of data.dressing?.crowds || []) {
    const n = Math.floor((c.x[1] - c.x[0]) * (c.z[1] - c.z[0]) * c.density);
    for (let i = 0; i < n; i++) {
      const x = c.x[0] + rnd() * (c.x[1] - c.x[0]), z = c.z[0] + rnd() * (c.z[1] - c.z[0]);
      if (!blocked(x, z)) spots.push({ x, y: 0, z });
    }
  }
  // shuffle, so lowering the quality thins the crowd evenly instead of emptying whole areas
  for (let i = spots.length - 1; i > 0; i--) { const j = Math.floor(rnd() * (i + 1)); [spots[i], spots[j]] = [spots[j], spots[i]]; }

  const figures = ["person_gent_tophat", "person_gent", "person_lady", "person_lady_b"].map((n) => gltf.scene.getObjectByName(n)).filter(Boolean);
  const byFig = figures.map(() => []);
  for (const s of spots) byFig[Math.floor(rnd() * figures.length)].push(s);
  const m = new THREE.Matrix4(), q = new THREE.Quaternion(), sc = new THREE.Vector3(), pos = new THREE.Vector3(), up = new THREE.Vector3(0, 1, 0);
  const col = new THREE.Color();
  figures.forEach((fig, fi) => {
    const lady = fig.name.includes("lady");
    const people = byFig[fi].map((s) => ({ s, L: {
      clothes: pick(lady ? P.dresses : P.suits), skin: pick(P.skin), hat: pick(lady ? P.hats_lady : P.hats_gent),
      yaw: (rnd() - 0.5) * 1.2, s: 0.94 + rnd() * 0.12,            // facing the track, as on the stands side before
    } }));
    // Sort into 25 m cells (keeping the shuffled order inside each cell), so whole cells can be skipped when
    // out of shot and switched to the light figures when far off, each a single block copy.
    const CELL = 25, cells = new Map();
    for (const p of people) {
      const key = Math.floor(p.s.x / CELL) + "," + Math.floor(p.s.z / CELL);
      if (!cells.has(key)) cells.set(key, []);
      cells.get(key).push(p);
    }
    const n = people.length;
    const F = { n, mats: new Float32Array(16 * n), cols: [new Float32Array(3 * n), new Float32Array(3 * n), new Float32Array(3 * n)], cells: [] };
    let i = 0;
    for (const list of cells.values()) {
      const box = new THREE.Box3();
      const start = i;
      for (const { s, L } of list) {
        pos.set(s.x, s.y, s.z); q.setFromAxisAngle(up, s.z < 0 ? L.yaw + Math.PI : L.yaw); sc.set(L.s, L.s * (s.seated ? 0.7 : 1), L.s);
        m.compose(pos, q, sc).toArray(F.mats, 16 * i);
        ["clothes", "skin", "hat"].forEach((k, j) => col.set(L[k]).toArray(F.cols[j], 3 * i));
        box.expandByPoint(pos);
        i++;
      }
      const sphere = box.getBoundingSphere(new THREE.Sphere());
      sphere.radius += 2.5; sphere.center.y += 0.9;
      F.cells.push({ start, count: list.length, sphere });
    }
    // One mesh per figure for each level of detail, its parts merged and told apart by aPart (0 clothes,
    // 1 skin, 2 hat); the light one, for far off, has about a third of the triangles.
    const parts = meshesOf(fig).map((p) => {
      const g = new THREE.BufferGeometry();
      g.setAttribute("position", p.geometry.attributes.position);
      g.setAttribute("normal", p.geometry.attributes.normal);
      g.setIndex(p.geometry.index);
      return [g, ["clothes", "skin", "hat"].findIndex((k) => p.material.name.includes(k))];
    });
    const tag = (g, k) => { g.setAttribute("aPart", new THREE.Float32BufferAttribute(new Float32Array(g.attributes.position.count).fill(Math.max(0, k)), 1)); return g; };
    const nearGeo = mergeGeometries(parts.map(([g, k]) => tag(g.clone(), k)));
    const farGeo = mergeGeometries(parts.map(([g, k]) => {
      const w0 = g.clone(); w0.deleteAttribute("normal");
      const w = mergeVertices(w0);
      const sg = new SimplifyModifier().modify(w, Math.floor(w.attributes.position.count * 0.65));
      sg.computeVertexNormals();
      return tag(sg.index ? sg.toNonIndexed() : sg, k);
    }).map((g) => (g.index ? g.toNonIndexed() : g)));
    const make = (geo) => {
      const cs = [0, 1, 2].map((j) => { const a = new THREE.InstancedBufferAttribute(new Float32Array(3 * n), 3); a.setUsage(THREE.DynamicDrawUsage); geo.setAttribute("aC" + j, a); return a; });
      const inst = new THREE.InstancedMesh(geo, crowdMaterial(), n);
      inst.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
      inst.count = 0; inst.frustumCulled = false;
      inst.castShadow = false; inst.receiveShadow = true;
      scene.add(inst);
      LAYERS.crowd.push(inst);
      return { inst, cs };
    };
    F.near = make(nearGeo);
    F.far = make(farGeo);
    CROWD.figs.push(F);
  });
  console.log("crowd:", spots.length, "people");
  setCrowdShare(QUALITY[qLevel].crowd);
}

// The crowd's gentle life, in the vertex shader (nothing per person is sent each frame): a slow sway, never
// in step with the neighbours; and as the leader comes by, those near the rail rock on their toes, lean in
// towards the track, and some of the gents raise their hats. Who does what comes from where they stand.
const CROWD = { figs: [], share: 1, sig: "", uniforms: { uTime: { value: 0 }, uLeader: { value: new THREE.Vector2(0, MID_Z) } }, near: 90 };
function crowdMaterial() {
  const mat = new THREE.MeshLambertMaterial({ color: "#ffffff" });
  mat.onBeforeCompile = (sh) => {
    Object.assign(sh.uniforms, CROWD.uniforms);
    sh.vertexShader = sh.vertexShader
      .replace("#include <common>", `#include <common>
        attribute float aPart; attribute vec3 aC0; attribute vec3 aC1; attribute vec3 aC2;
        uniform float uTime; uniform vec2 uLeader; varying vec3 vPartCol;`)
      .replace("#include <begin_vertex>", `#include <begin_vertex>
        vPartCol = aPart < 0.5 ? aC0 : aPart < 1.5 ? aC1 : aC2;
        {
          vec3 ip = vec3(instanceMatrix[3][0], instanceMatrix[3][1], instanceMatrix[3][2]);
          float seed = fract(sin(dot(ip.xz, vec2(12.9898, 78.233))) * 43758.5453);
          float h = transformed.y;
          float sway = 0.018 * sin(uTime * (0.6 + 0.5 * seed) + seed * 6.2832);
          float ex = smoothstep(75.0, 15.0, abs(ip.x - uLeader.x)) * smoothstep(55.0, 18.0, abs(ip.z - uLeader.y)) * step(0.2, seed);
          float bob = ex * 0.06 * max(0.0, sin(uTime * (6.0 + 3.0 * seed) + seed * 40.0));
          transformed.x += (sway + ex * 0.025 * sin(uTime * 2.7 + seed * 9.0)) * h;
          transformed.z -= ex * 0.05 * h;
          transformed.y += bob;
          if (aPart > 1.5 && seed > 0.62) transformed.y += ex * 0.2 * smoothstep(0.35, 0.9, 0.5 + 0.5 * sin(uTime * 2.1 + seed * 31.0));
        }`);
    sh.fragmentShader = sh.fragmentShader
      .replace("#include <common>", "#include <common>\nvarying vec3 vPartCol;")
      .replace("#include <color_fragment>", "#include <color_fragment>\ndiffuseColor.rgb *= vPartCol;");
  };
  mat.customProgramCacheKey = () => "crowd-life";
  return mat;
}
function setCrowdShare(share) { CROWD.share = share; CROWD.sig = ""; }
// Which cells are in shot and which are far: only when that changes are the visible people copied across.
const _fr = new THREE.Frustum(), _pm = new THREE.Matrix4();
function updateCrowd(cam) {
  if (!CROWD.figs.length) return;
  _pm.multiplyMatrices(cam.projectionMatrix, cam.matrixWorldInverse);
  _fr.setFromProjectionMatrix(_pm);
  const plan = CROWD.figs.map((F) => F.cells.map((c) => {
    if (!_fr.intersectsSphere(c.sphere)) return 0;
    return c.sphere.center.distanceTo(cam.position) - c.sphere.radius < CROWD.near ? 1 : 2;
  }));
  const sig = CROWD.share + ":" + plan.map((p) => p.join("")).join("|");
  if (sig === CROWD.sig) return;
  CROWD.sig = sig;
  CROWD.figs.forEach((F, fi) => {
    const k = { 1: 0, 2: 0 };
    F.cells.forEach((c, ci) => {
      const lod = plan[fi][ci];
      if (!lod) return;
      const take = Math.round(c.count * CROWD.share);
      if (!take) return;
      const T = lod === 1 ? F.near : F.far, at = k[lod];
      T.inst.instanceMatrix.array.set(F.mats.subarray(16 * c.start, 16 * (c.start + take)), 16 * at);
      T.cs.forEach((a, j) => a.array.set(F.cols[j].subarray(3 * c.start, 3 * (c.start + take)), 3 * at));
      k[lod] += take;
    });
    for (const [lod, T] of [[1, F.near], [2, F.far]]) {
      T.inst.count = k[lod];
      T.inst.instanceMatrix.clearUpdateRanges(); T.inst.instanceMatrix.addUpdateRange(0, 16 * k[lod]); T.inst.instanceMatrix.needsUpdate = true;
      for (const a of T.cs) { a.clearUpdateRanges(); a.addUpdateRange(0, 3 * k[lod]); a.needsUpdate = true; }
    }
  });
}

// ---------- Horses ----------
const silkTextures = new Map();
function silkTexture(id) {
  if (!silkTextures.has(id)) {
    const t = texLoader.load(`assets/silks-3d/${id}.png`);
    t.flipY = false; t.colorSpace = THREE.SRGBColorSpace; t.wrapS = THREE.RepeatWrapping; t.anisotropy = 8;
    silkTextures.set(id, t);
  }
  return silkTextures.get(id);
}
const maskTex = texLoader.load("assets/tint-mask.png");
maskTex.flipY = false; maskTex.colorSpace = THREE.NoColorSpace;

// Coat and silks tint: multiply the neutral grey texture inside each mask (R coat, G points, B silks).
function makeTintable(mat, u) {
  mat.onBeforeCompile = (shader) => {
    Object.assign(shader.uniforms, u);
    shader.fragmentShader = shader.fragmentShader
      .replace("#include <common>", "#include <common>\nuniform sampler2D mask; uniform vec3 coatCol; uniform vec3 pointsCol; uniform vec3 silkCol;")
      .replace("#include <map_fragment>", `#include <map_fragment>
        {
          vec3 m = texture2D(mask, vMapUv).rgb;
          float l = dot(diffuseColor.rgb, vec3(0.2126, 0.7152, 0.0722));
          diffuseColor.rgb = vec3(l);
          vec3 coat = coatCol * clamp(mix(1.0, l / 0.56, 0.65), 0.3, 1.25);
          vec3 pts = pointsCol * mix(0.75, 1.2, smoothstep(0.0, 0.035, l));
          vec3 silk = silkCol * clamp(mix(1.0, l / 0.72, 0.6), 0.4, 1.15);
          diffuseColor.rgb = mix(diffuseColor.rgb, coat, m.r);
          diffuseColor.rgb = mix(diffuseColor.rgb, pts, m.g);
          diffuseColor.rgb = mix(diffuseColor.rgb, silk, m.b);
        }`);
  };
  mat.customProgramCacheKey = () => "horse-tint";
}

// ---------- The race ----------

      const T = use.reduce((a, s) => a + s.t, 0), Pr = use.reduce((a, s) => a + s.par, 0), d = T - Pr;
      word.textContent = bandOf(T / Pr);
      note.textContent = `${Math.abs(d).toFixed(1)}s ${d < 0 ? "quicker" : "slower"} than par` + (early.length ? "" : " so far");
    },
  };
})();

// ---------- Loop ----------
const toRunEl = document.getElementById("toRun"), toRunLabel = document.querySelector(".togo span");
const clock = new THREE.Clock();
let framesDrawn = 0, stillFrames = 0, kickWarm = false;
function frame() {
  const t0 = performance.now();
  const rawDt = clock.getDelta();
  const dt = Math.min(rawDt, 0.05);
  if (runners.length && !params.has("still")) perf.tick(rawDt);
  // phases: before the off -> the race -> the finish again, slowed -> after the race -> round again
  const slow = state.phase === "replay" ? DIR_.replaySpeed : 1;
  state.dt = dt;
  const step = state.paused ? 0 : dt * slow;
  if (!state.paused) {
    state.pt += dt;
    if (state.phase === "prelude") { if (state.pt > SET.prelude.seconds) { state.phase = "stalls"; state.pt = 0; state.t = 0; snap = true; } }
    else if (state.phase === "stalls") { if (state.pt > PRE.standSeconds) { state.phase = "race"; state.pt = 0; state.t = 0; } }   // the off: no cut
    else if (state.phase === "race") { state.t += dt; if (GAME && !sentFinish && state.t > T_FINISH) { sentFinish = true; toGame({ type: "finished", order: RESULT.placed.map((p) => CARD[p.runner].id) }); } if (state.t > T_END) { state.phase = "replay"; state.pt = 0; state.t = REPLAY[0]; snap = true; live.length = 0; } }
    else if (state.phase === "replay") { state.t += step; if (state.t > REPLAY[1]) { state.phase = "postlude"; state.pt = 0; state.t = T_END; snap = true; } }
    else if (state.phase === "postlude" && state.pt > SET.postlude.seconds) { state.phase = "prelude"; state.pt = 0; state.t = 0; snap = true; live.length = 0; }
  }
  const now = sample(state.t);
  let leader = -1e9, leaderZ = MID_Z, sum = 0, leaderXw = 0;
  runners.forEach((r, i) => {
    const [x, z, v, eff, yaw] = now[i];
    const [wx, wz] = toWorld(x, z);                            // along the course -> world
    const head = headingAt(x, yaw);
    r.obj.position.set(wx, 0, wz);
    r.obj.rotation.y = head;
    _p.set(wx - Math.cos(head) * 0.15, 0.04, wz + Math.sin(head) * 0.15); _q.setFromEuler(_e.set(-Math.PI / 2, 0, head - Math.PI, "YXZ")); _s.set(3.0, 1.05, 1);
    contact.setMatrixAt(i, _m.compose(_p, _q, _s));
    if (r.v2) {                                            // the v2 horse: its own riding, gallop and detail levels
      if (params.has("still") && !r.started) { r.v2.update(5, v, eff, null, 0); r.started = true; }   // stills: settle the riding first
      r.v2.update(dt, v, eff, null, step);
      if (x > leader) { leader = x; leaderZ = wz; leaderXw = wx; }
      sum += x;
      return;
    }
    if (params.has("still") && !r.started) { r.effort = Math.min(2, eff); r.started = true; }   // stills: start at the timeline's effort
    r.effort += (Math.min(2, eff) - r.effort) * Math.min(1, dt * 2);
    const set = (n, w) => r.actions[n] && r.actions[n].setEffectiveWeight(w);
    const e = r.effort;
    set("ride_quiet", Math.max(0, 1 - e)); set("ride_push", e <= 1 ? e : 2 - e); set("ride_drive", Math.max(0, e - 1));
    // standing in the stalls: the walk pose, barely moving (a horse shifting its weight); into the gallop as it breaks
    const w = 1 - THREE.MathUtils.smoothstep(v, 0.3, 4.5);
    set("walk", w); set("gallop", (1 - e / 4) * (1 - w)); set("gallop_drive", (e / 4) * (1 - w));
    r.mixer.timeScale = v < 0.3 ? 0.06 : THREE.MathUtils.clamp(v / STRIDE_SPEED, 0.3, 1.4);
    r.mixer.update(step);
    if (x > leader) { leader = x; leaderZ = wz; leaderXw = wx; }
    sum += x;
  });
  if (!runners.length) leader = 0;
  contact.count = runners.length; contact.instanceMatrix.needsUpdate = true;
  if (runners.length) {
    if (!kickWarm) {                     // jumping into the middle of a race: let the air fill with clods first
      kickWarm = true;
      for (let k = 30; k > 0; k--) stepKick(1 / 30, sample(Math.max(0, state.t - k / 30)));
    }
    if (!state.paused) stepKick(step, now);
    drawKick();
  }
  const packU = runners.length ? sum / runners.length : 0;
  // the gates: shut until the off, then spring open; on a race that comes back past its own start (2 miles)
  // the stalls are towed away once the field is well down the course
  if (stallsGroup) {
    setGates(state.phase === "race" ? gateOpening(state.t) : state.phase === "prelude" || state.phase === "stalls" ? 0 : 1);
    stallsGroup.visible = !(STALLS_COME_BACK && (state.phase === "race" || state.phase === "replay" || state.phase === "postlude") && leader > PRE.hideAfter);
  }

  updateCamera(now, dt);
  if (HORSE_V === "v2" && runners.length) {           // v2: detail levels by size on screen, a few close at most
    camera.updateMatrixWorld();
    HorseV2.chooseLevels(runners.map((r) => r.v2), camera, { close: { high: 4, medium: 2, low: 0 }[qLevel] });
  }
  const [sx, sz] = toWorld(packU, 0);
  const sunAt = new THREE.Vector3(sx, 0, sz);
  sun.position.copy(sunAt).add(SUN_OFFSET); sun.target.position.copy(sunAt);
  scene.userData.sky.position.copy(camera.position);
  CROWD.uniforms.uTime.value = performance.now() / 1000;
  CROWD.uniforms.uLeader.value.set(leaderXw, leaderZ);
  camera.updateMatrixWorld();
  updateCrowd(camera);

  const left = (DIST - leader) / FURLONG;
  toRunEl.textContent = state.phase === "prelude" ? RACE.label : state.phase === "stalls" ? "All in" : state.phase === "replay" ? "Replay" : left <= 0 ? "Finished"
    : left < 1 ? Math.round(left * 220) + " yds" : left.toFixed(1).replace(/\.0$/, "") + "f";
  toRunLabel.hidden = left <= 0 || state.phase === "prelude" || state.phase === "stalls" || state.phase === "replay";
  DOCK.update(now, state.t, state.phase);

  const every = QUALITY[qLevel].shadowEvery;
  sun.shadow.autoUpdate = every === 1;
  if (every > 1 && framesDrawn % every === 0) sun.shadow.needsUpdate = true;
  const t1 = performance.now();
  renderer.info.reset();
  renderer.render(scene, camera);
  framesDrawn++;
  diag.js += t1 - t0; diag.draw += performance.now() - t1; diag.n++;
  // ?still=1 (used for checking screenshots): draw a few frames once loaded, then stop.
  if (params.has("still") && runners.length && texturesPending === 0 && ++stillFrames >= 3) {
    window.__count = (key) => {                               // checking aid: triangles drawn with one layer hidden
      const L = key ? LAYERS[key] : []; L.forEach((o) => (o.visible = false));
      renderer.info.reset(); renderer.render(scene, camera); const t = renderer.info.render.triangles;
      L.forEach((o) => (o.visible = true)); renderer.render(scene, camera); return t;   // leave the full scene on screen
    };
    window.__ready = true; window.__info = `${renderer.info.render.calls} draw calls, ${(renderer.info.render.triangles / 1000).toFixed(0)}k triangles`; return;
  }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
