<!doctype html>
<meta charset="utf-8">
<title>Final Furlong</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500;600&family=Cormorant+SC:wght@600;700&family=Crimson+Pro:wght@600;700&family=Nunito:wght@400;600;700;800&display=swap">
<style>
/* The race view's last furlong at Ascot, on the full course (courses/ascot.json, courses/ascot-view.json):
   the 507 m main stand on the horses' left, the planting belts and boards round the far rails.
   Panels use the board's cream, bottle green and gold. */
:root {
  --cream: #f4ead2;
  --cream-edge: #b8954a;
  --green: #1f5a38;
  --green-ink: #183f2a;
  --ink-soft: #4f5d4a;
  --display: "Cormorant SC", "Times New Roman", serif;
  --body: "Jost", "Helvetica Neue", Arial, sans-serif;
  color-scheme: light;
}
[hidden] { display: none !important; }
html, body { height: 100%; margin: 0; }
body { background: #5f8a44; color: var(--green-ink); font-family: var(--body); overflow: hidden; }
#scene { position: fixed; inset: 0; display: block; width: 100%; height: 100%; }

.plate {
  position: fixed;
  top: calc(env(safe-area-inset-top, 0px) + 14px);
  left: max(16px, env(safe-area-inset-left, 0px));
  background: var(--cream);
  border: 1px solid var(--cream-edge);
  box-shadow: 0 0 0 3px var(--cream), 0 0 0 4px var(--cream-edge), 0 6px 18px rgba(40, 40, 20, 0.25);
  border-radius: 3px;
  padding: 8px 16px 9px;
  display: flex; gap: 18px; align-items: center;
}
.plate h1 { margin: 0; font-family: var(--display); font-size: 1.45rem; letter-spacing: 0.08em; color: var(--green); line-height: 1; }
.plate p { margin: 2px 0 0; font-size: 0.78rem; letter-spacing: 0.04em; color: var(--ink-soft); }
.plate .togo { text-align: right; border-left: 1px solid rgba(184, 149, 74, 0.6); padding-left: 16px; }
.plate .togo strong { display: block; font-family: var(--display); font-size: 1.35rem; color: var(--green); line-height: 1; font-variant-numeric: tabular-nums; }
.plate .togo span { font-size: 0.7rem; letter-spacing: 0.12em; text-transform: uppercase; color: var(--ink-soft); }

/* The race dock along the bottom: the running order, the course map and the pace (reads only the timeline). */
:root { --dock-h: 0px; }
.dock {
  position: fixed; left: max(12px, env(safe-area-inset-left, 0px)); right: max(12px, env(safe-area-inset-right, 0px));
  bottom: calc(env(safe-area-inset-bottom, 0px) + 10px);
  display: grid; grid-template-columns: 176px minmax(0, 1fr) 196px; gap: 10px; align-items: stretch;
  background: var(--cream); border: 1px solid var(--cream-edge); border-radius: 3px;
  box-shadow: 0 0 0 3px var(--cream), 0 0 0 4px var(--cream-edge), 0 6px 18px rgba(40, 40, 20, 0.25);
  padding: 8px 10px;
}
.dock h2 { margin: 0 0 4px; font: 600 0.62rem var(--body); letter-spacing: 0.14em; text-transform: uppercase; color: var(--ink-soft); }
.dock-map svg { display: block; width: 100%; height: 86px; }
.dock-order { min-width: 0; display: flex; flex-direction: column; }
.order-strip { position: relative; height: 70px; overflow-x: auto; overflow-y: hidden; scrollbar-width: thin; }
.chip {
  position: absolute; top: 0; left: 0; width: 50px; height: 64px; box-sizing: border-box;
  display: grid; justify-items: center; align-content: start; gap: 1px; padding-top: 2px;
  border: 1px solid rgba(184, 149, 74, 0.55); border-radius: 3px; background: #fbf5e4;
  transition: transform 0.45s ease; font-variant-numeric: tabular-nums;
}
.in-game #races { display: none; }
.chip.mine { box-shadow: inset 0 0 0 2px #b79042; }
/* in the game: a price under each runner, and its race-day colour card as a band along the foot of its chip */
.priced .order-strip { height: 84px; }
.priced .chip { height: 78px; border-bottom-width: 5px; }
.chip .odds { font: 600 0.64rem var(--body); color: var(--ink); line-height: 1; margin-top: 1px; }
.chip.k-black { border-bottom-color: #3b3b3b; } .chip.k-red { border-bottom-color: #cc4a32; } .chip.k-yellow { border-bottom-color: #e6ab4a; } .chip.k-blue { border-bottom-color: #6491a8; }
.rc-price { margin-left: 6px; padding: 3px 8px; border-radius: 3px; font: 700 .86rem var(--body); color: #fff; background: #6b6a60; }
.rc-price.k-black { background: #3b3b3b; } .rc-price.k-red { background: #cc4a32; } .rc-price.k-yellow { background: #e6ab4a; color: #2a210b; } .rc-price.k-blue { background: #6491a8; }
.chip.lead { border-color: var(--cream-edge); box-shadow: inset 0 0 0 1px var(--cream-edge); background: #fff8e2; }
.chip .pos { font: 600 0.62rem var(--body); color: var(--ink-soft); line-height: 1; }
.chip img { width: 24px; height: 30px; object-fit: contain; display: block; }
.chip .no { position: absolute; top: 15px; right: 2px; min-width: 14px; height: 14px; border-radius: 2px; background: var(--green); color: var(--cream); font: 600 0.6rem/14px var(--body); text-align: center; padding: 0 2px; }
.chip .gap { font: 500 0.66rem var(--body); color: var(--green-ink); line-height: 1; white-space: nowrap; }
.dock-pace { display: flex; flex-direction: column; gap: 3px; }
.pace-verdict { display: flex; align-items: baseline; gap: 8px; }
.pace-verdict strong { font-family: var(--display); font-size: 1.3rem; color: var(--green); line-height: 1; }
.pace-verdict span { font-size: 0.68rem; color: var(--ink-soft); }
.sections { display: flex; gap: 2px; height: 16px; align-items: stretch; }
.sections i { display: block; border-radius: 2px; background: rgba(31, 90, 56, 0.12); }
.sections i[data-band="Fast"] { background: #b5523b; }
.sections i[data-band="Strong"] { background: #d39a3d; }
.sections i[data-band="Even"] { background: #4f8a5c; }
.sections i[data-band="Slow"] { background: #6f88a6; }
.pace-key { display: flex; flex-wrap: wrap; gap: 2px 8px; font-size: 0.6rem; color: var(--ink-soft); }
.pace-key b { display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin-right: 3px; vertical-align: -1px; }
.going { font-size: 0.7rem; color: var(--green-ink); }
@media (max-width: 700px) {
  .dock { grid-template-columns: 96px minmax(0, 1fr); grid-template-areas: "map pace" "order order"; gap: 4px 10px; padding: 6px 8px; left: 8px; right: 8px; bottom: calc(env(safe-area-inset-bottom, 0px) + 8px); }
  .dock-map { grid-area: map; } .dock-pace { grid-area: pace; gap: 2px; } .dock-order { grid-area: order; }
  .dock h2 { display: none; }
  .dock-map svg { height: 52px; }
  .order-strip { height: 58px; }
  .chip { width: 42px; height: 56px; }
  .chip img { width: 20px; height: 24px; }
  .chip .no { top: 12px; }
  .priced .order-strip { height: 70px; } .priced .chip { height: 66px; }
  .pace-verdict strong { font-size: 1.05rem; }
  .pace-verdict span, .going { font-size: 0.64rem; }
  .sections { height: 10px; }
  .pace-key { display: none; }
}
.bar {
  position: fixed; left: 50%; transform: translateX(-50%);
  bottom: calc(env(safe-area-inset-bottom, 0px) + 14px + var(--dock-h));
  max-width: calc(100% - 32px);
  background: var(--cream);
  border: 1px solid var(--cream-edge);
  border-radius: 3px;
  box-shadow: 0 6px 18px rgba(40, 40, 20, 0.25);
  padding: 6px 8px;
  display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: center; justify-content: center;
}
.showbar {
  position: fixed; right: max(12px, env(safe-area-inset-right, 0px)); bottom: calc(env(safe-area-inset-bottom, 0px) + 12px + var(--dock-h));
  background: var(--cream); border: 1px solid var(--cream-edge); box-shadow: 0 4px 12px rgba(40, 40, 20, 0.25); opacity: 0.85;
}
.group { display: flex; gap: 4px; align-items: center; }
.group > span { font-size: 0.68rem; letter-spacing: 0.12em; text-transform: uppercase; color: var(--ink-soft); margin-right: 2px; }
button {
  font: 500 0.82rem var(--body); color: var(--green-ink); cursor: pointer;
  background: transparent; border: 1px solid rgba(31, 90, 56, 0.35); border-radius: 3px; padding: 5px 9px;
}
button[aria-pressed="true"] { background: var(--green); color: var(--cream); border-color: var(--green); }
/* the race card: which race, the going, how many runners and the race's seed (each reloads the page) */
select, .seed {
  font: 500 0.82rem var(--body); color: var(--green-ink); background: transparent;
  border: 1px solid rgba(31, 90, 56, 0.35); border-radius: 3px; padding: 4px 4px; height: 28px; box-sizing: border-box;
}
.seed { width: 4.6em; padding: 4px 6px; font-variant-numeric: tabular-nums; }
#races { flex-wrap: wrap; justify-content: center; }
select:focus-visible, .seed:focus-visible { outline: 2px solid var(--cream-edge); outline-offset: 2px; }
button:focus-visible { outline: 2px solid var(--cream-edge); outline-offset: 2px; }
.fps { font-variant-numeric: tabular-nums; font-size: 0.75rem; opacity: 0.8; min-width: 6.5em; }
.diag {
  position: fixed; top: 10px; right: 10px; z-index: 5; max-width: 360px; padding: 8px 10px;
  background: rgba(20, 30, 22, 0.86); color: #f3ead2; border-radius: 3px; font: 12px/1.45 ui-monospace, Menlo, monospace;
}
.diag #diagText { white-space: pre-wrap; }
.in-game .diag { top: calc(78px + env(safe-area-inset-top, 0px)); right: auto; left: calc(10px + env(safe-area-inset-left, 0px)); }
.diag-sw { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px; }
.diag-sw button { font-size: 0.72rem; padding: 3px 6px; }
.loading {
  position: fixed; inset: 0; display: grid; place-items: center; pointer-events: none;
  font-family: var(--display); font-size: 1.4rem; letter-spacing: 0.1em; color: var(--cream);
  text-shadow: 0 1px 3px rgba(0, 0, 0, 0.4);
}
@media (max-width: 600px) {
  .plate { padding: 6px 12px; gap: 12px; }
  .plate h1 { font-size: 1.15rem; }
  .plate p { display: none; }
  .bar { gap: 4px 10px; padding: 5px 6px; }
  .group > span { display: none; }
  button { padding: 5px 7px; font-size: 0.78rem; }
  select, .seed { font-size: 0.78rem; height: 27px; }
  .seed { width: 4em; }
}


/* The storybook finish (in the game, or ?finish=story): the same grade as the game's films and cover
   (game/tools/storybook_grade.py, fitted as a CSS filter: softer colour, greens towards the board's olive, a
   parchment cast), and a soft vignette. Applied as the picture goes on screen, so the race itself is untouched. */
/* (since 7 Nov 2026 both are drawn by the race view itself: see GRADE in the script. A CSS filter on the 3D picture
   made the browser redraw the whole screen through the filter every frame, which slow graphics chips felt badly.) */
/* ---------- In the game (Thoroughbred Ascot opens this page with ?game=1): the game's own dress ----------
   Parchment panels with a gold hairline, an engraved serif for names (Crimson Pro), Jost in spaced capitals for labels,
   Nunito for reading: the same as the Newmarket board and the game's sheets. The racecard before the off and the
   result after the line are the game's; the race itself is unchanged. */
.in-game { --cream: #f2ecdf; --cream-edge: #b79042; --green: #3d7153; --green-ink: #2c3a30; --ink-soft: #6b6a60; --display: "Crimson Pro", Georgia, serif; --body: "Jost", "Helvetica Neue", Arial, sans-serif; --read: "Nunito", system-ui, sans-serif; }
.in-game #horses { display: none; }
/* The look and grandstand style tests reload the page, and in the game the race is only handed over once: they live
   on the race view's own page (the testing page) and stay out of the game (owner, 7 Nov). */
.in-game #looks, .in-game #standsG { display: none; }
.in-game .plate { padding: 9px 16px 10px; gap: 16px; box-shadow: 0 0 0 3px var(--cream), 0 0 0 4px rgba(183,144,66,.75), 0 8px 22px rgba(20,30,20,.3); }
.in-game .plate h1 { font-family: var(--display); font-size: 1.55rem; letter-spacing: 0; text-transform: none; font-weight: 700; }
.in-game .plate p { font-family: var(--body); letter-spacing: .16em; text-transform: uppercase; font-size: .66rem; color: #8d6b2a; }
.in-game .plate .togo strong { font-family: var(--display); font-weight: 700; }
.in-game .dock, .in-game .bar { box-shadow: 0 0 0 3px var(--cream), 0 0 0 4px rgba(183,144,66,.75), 0 8px 22px rgba(20,30,20,.3); }
.in-game .dock h2, .in-game .group > span { color: #8d6b2a; }
.in-game .chip.mine { box-shadow: inset 0 0 0 2px #b79042, 0 0 10px rgba(183,144,66,.55); background: #fff6dc; }
.in-game button { font-family: var(--body); }
.in-game button[aria-pressed="true"] { background: var(--green); border-color: var(--green); }
.rc, .rr { position: fixed; z-index: 6; color: var(--green-ink); background: var(--cream); border-radius: 3px; font-family: var(--read, var(--body));
  box-shadow: inset 0 0 0 1px rgba(183,144,66,.6), 0 0 0 3px var(--cream), 0 0 0 4px rgba(183,144,66,.75), 0 14px 36px rgba(15,25,18,.45); }
.rc { left: 50%; bottom: calc(env(safe-area-inset-bottom, 0px) + 26px + var(--dock-h) + var(--ctl-h, 0px)); transform: translateX(-50%); width: min(560px, calc(100% - 32px)); padding: 14px 22px 16px; text-align: center; transition: opacity .6s, transform .6s; }
.rc.gone { opacity: 0; transform: translate(-50%, 12px); pointer-events: none; }
.rc-k, .rr-k { font-family: var(--body); font-weight: 600; font-size: .7rem; letter-spacing: .22em; text-transform: uppercase; color: #8d6b2a; }
.rc-t { font-family: var(--display); font-weight: 700; font-size: 2.1rem; line-height: 1.02; color: #2b3f33; margin: 4px 0 6px; }
.rc-f { font-size: .9rem; color: var(--ink-soft); }
.rc-f b { color: var(--green-ink); }
.rc-me { display: inline-flex; align-items: center; gap: 10px; margin-top: 10px; padding: 6px 12px 6px 8px; border-radius: 3px; background: #fff8e4; box-shadow: inset 0 0 0 1px rgba(183,144,66,.55); font-size: .9rem; text-align: left; }
.rc-me img { width: 26px; height: 32px; object-fit: contain; }
.rc-me b { font-family: var(--body); font-weight: 600; letter-spacing: .06em; }
.rc-me small { display: block; color: var(--ink-soft); font-size: .78rem; }
.rr { right: max(18px, env(safe-area-inset-right, 0px)); top: calc(env(safe-area-inset-top, 0px) + 70px); width: min(360px, calc(100% - 36px)); padding: 16px 18px 16px; transition: opacity .5s, transform .5s; }
.rr.gone { opacity: 0; transform: translateX(16px); pointer-events: none; }
.rr-t { font-family: var(--display); font-weight: 700; font-size: 1.6rem; line-height: 1.05; color: #2b3f33; margin: 3px 0 10px; }
.rr ol { list-style: none; margin: 0; padding: 0; display: grid; gap: 5px; }
.rr li { display: grid; grid-template-columns: 34px 24px 1fr auto; align-items: center; gap: 8px; padding: 5px 8px; border-radius: 3px; background: #fbf7ec; box-shadow: inset 0 0 0 1px rgba(184,149,74,.35); font-size: .88rem; }
.rr li.mine { background: #fff1c9; box-shadow: inset 0 0 0 2px #b79042; }
.rr li .p { font-family: var(--display); font-weight: 700; font-size: 1.15rem; color: #8d6b2a; }
.rr li:first-child .p { color: #3d7153; }
.rr li img { width: 22px; height: 28px; object-fit: contain; }
.rr li b { font-family: var(--body); font-weight: 600; letter-spacing: .05em; font-size: .82rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.rr li i { font-style: normal; color: var(--ink-soft); font-size: .8rem; white-space: nowrap; }
.rr-me { margin: 10px 0 0; padding: 9px 11px; border-radius: 3px; background: #2c4d43; color: #f6f1e6; font-size: .92rem; line-height: 1.35; }
.rr-me b { color: #f6dc8f; }
.rr-me.won { background: linear-gradient(135deg, #8a6420, #c99a3c 60%, #9c7426); color: #fff; }
.rr-me.won b { color: #fff; }
.rr-btns { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; }
.rr-btns button { flex: 1 1 auto; padding: 9px 10px; font-size: .86rem; font-weight: 600; }
.rr-btns button.go { background: var(--green); color: #f6f1e6; border-color: var(--green); }
/* Before the off (owner, 7 Nov): one card of every runner (stall, colours, name, price) over a still aerial of the
   course, the carnival in front and the stand beyond; then the start. And the commentary, a line at a time. */
.call { position: fixed; z-index: 6; left: 50%; transform: translateX(-50%); color: var(--green-ink); background: var(--cream); border-radius: 3px;
  bottom: calc(env(safe-area-inset-bottom, 0px) + 26px + var(--dock-h) + var(--ctl-h, 0px));
  box-shadow: inset 0 0 0 1px rgba(183,144,66,.6), 0 0 0 3px var(--cream), 0 0 0 4px rgba(183,144,66,.75), 0 14px 36px rgba(15,25,18,.45); transition: opacity .45s, transform .45s; }
.call.gone { opacity: 0; transform: translate(-50%, 10px); pointer-events: none; }
body.pre .dock { display: none; }
.intro { position: fixed; z-index: 7; left: 50%; transform: translateX(-50%); top: calc(env(safe-area-inset-top, 0px) + 84px); bottom: calc(env(safe-area-inset-bottom, 0px) + 18px + var(--ctl-h, 0px));
  width: min(720px, calc(100% - 28px)); display: flex; flex-direction: column; justify-content: center; pointer-events: none; transition: opacity .5s, transform .5s; }
.intro.gone { opacity: 0; transform: translate(-50%, 14px); }
.intro.gone * { pointer-events: none !important; }
.in-card { pointer-events: auto; display: flex; flex-direction: column; min-height: 0; color: var(--green-ink); background: rgba(250,245,232,.95); border-radius: 3px;
  box-shadow: inset 0 0 0 1px rgba(183,144,66,.6), 0 0 0 3px var(--cream), 0 0 0 4px rgba(183,144,66,.75), 0 18px 44px rgba(15,25,18,.45); }
.in-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; padding: 14px 18px 10px; border-bottom: 1px solid rgba(183,144,66,.45); }
.in-k { font: 600 .66rem var(--body); letter-spacing: .2em; text-transform: uppercase; color: #8d6b2a; }
.in-t { font-family: var(--display); font-weight: 700; font-size: 1.75rem; line-height: 1.02; color: #2b3f33; margin: 3px 0 4px; }
.in-f { font-size: .82rem; color: var(--ink-soft); }
.in-f b { color: var(--green-ink); }
.in-go { flex: none; position: relative; overflow: hidden; padding: 9px 14px; font-weight: 600; background: var(--green); color: #f6f1e6; border-color: var(--green); }
.in-go i { position: absolute; left: 0; bottom: 0; height: 3px; background: #e8cf8e; width: 0; }
.in-list { list-style: none; margin: 0; padding: 8px 12px 12px; display: grid; grid-template-columns: repeat(var(--cols, 2), minmax(0, 1fr)); gap: 4px 12px; overflow-y: auto; min-height: 0; }
.in-list li { display: grid; grid-template-columns: 28px 26px minmax(0, 1fr) auto; align-items: center; gap: 8px; padding: 4px 6px; border-radius: 3px; }
.in-list li:nth-child(4n+1), .in-list li:nth-child(4n+2) { background: rgba(255,255,255,.55); }
.in-list li.mine { background: #fff1c9; box-shadow: inset 0 0 0 2px #b79042; }
.in-no { height: 24px; display: grid; place-items: center; border-radius: 3px; background: var(--green); color: #f6f1e6; font: 700 .85rem var(--body); }
.in-list img { width: 26px; height: 32px; object-fit: contain; }
.in-n { min-width: 0; }
.in-n b { display: block; font-family: var(--display); font-weight: 700; font-size: 1.02rem; line-height: 1.1; color: #2b3f33; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.in-n small { display: block; font-size: .7rem; color: var(--ink-soft); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.in-list li.mine .in-n b { color: #8d6b2a; }
.in-odds { font: 700 .85rem var(--body); padding: 3px 8px; border-radius: 3px; color: #fff; background: #6b6a60; white-space: nowrap; }
.intro.short .in-n small { display: none; } .intro.short .in-list { gap: 2px 10px; padding: 4px 8px 6px; } .intro.short .in-list li { padding: 2px 4px; } .intro.short .in-list img { width: 20px; height: 24px; } .intro.short .in-no { height: 20px; } .intro.short .in-head { padding: 8px 12px 6px; } .intro.short .in-t { font-size: 1.2rem; margin: 1px 0 2px; }
.intro.short { top: calc(env(safe-area-inset-top, 0px) + 60px); bottom: calc(env(safe-area-inset-bottom, 0px) + 10px + var(--ctl-h, 0px)); }
.in-odds.k-black { background: #3b3b3b; } .in-odds.k-red { background: #cc4a32; } .in-odds.k-yellow { background: #e6ab4a; color: #2a210b; } .in-odds.k-blue { background: #6491a8; }
.call { max-width: min(620px, calc(100% - 32px)); box-sizing: border-box; padding: 8px 16px 9px; font: 500 1rem/1.35 var(--read, var(--body)); text-align: center; }
.call b { font-weight: 700; color: #2b3f33; }
.call b.mine { color: #8d6b2a; }
@media (max-width: 700px) {
  .call { font-size: .88rem; padding: 6px 12px 7px; }
  .intro { top: calc(env(safe-area-inset-top, 0px) + 66px); width: calc(100% - 20px); }
  .in-head { padding: 10px 12px 8px; } .in-t { font-size: 1.3rem; } .in-f { font-size: .74rem; }
  .in-list { padding: 6px 8px 8px; } .in-list li { grid-template-columns: 24px 22px minmax(0, 1fr) auto; gap: 6px; padding: 3px 4px; }

// If the page can't start (an older browser, a blocked download), say so on screen instead of hanging, with
// what to pass on. The module code below clears window.__started when it runs.
(function () {
  const show = (msg) => {
    const el = document.getElementById("loading");
    if (!el || el.hidden) return;
    el.style.pointerEvents = "auto"; el.style.font = "500 15px/1.5 Jost, Helvetica, Arial, sans-serif";
    el.style.letterSpacing = "0"; el.style.textAlign = "center"; el.style.padding = "0 24px";
    el.textContent = msg + " Browser: " + navigator.userAgent;

    if (e.target && e.target !== window && e.target.tagName !== "SCRIPT") return;        // an image or font: not fatal
    if (e.target && e.target.src && e.target.src.includes("es-module-shims")) return;     // the shim itself is optional
    show("The course didn't start: " + (e.message || "a script failed to load") + ".");
  }, true);
  window.addEventListener("unhandledrejection", (e) => show("The course didn't start: " + ((e.reason && e.reason.message) || e.reason) + "."));

    if (window.__started) return;
    const maps = typeof HTMLScriptElement !== "undefined" && HTMLScriptElement.supports && HTMLScriptElement.supports("importmap");
    show(maps ? "The course is taking a long time to start. If nothing changes, send Claude a screenshot." : "This browser is too old for the 3D race view (it can't load the 3D library). Updating Safari, or using Chrome, will fix it.");
  }, 20000);
})();

// The Ascot running rail, as in the owner's photo and the finish study: a broad white board facing the track,

// One bay, L metres along local x, the track towards -z.

  const post = new THREE.BoxGeometry(0.1, h - 0.02, 0.1).translate(L / 2, (h - 0.02) / 2, 0.14).toNonIndexed();

}
function placeProps(gltf) {
  const byName = (n) => gltf.scene.getObjectByName(n);
  gltf.scene.traverse((o) => { if (o.isMesh) { o.castShadow = true; o.receiveShadow = true; o.material.roughness = 0.6; } });
  // Rails: one instanced module (its track side towards -z) laid along each rail line of the course: the
  // Ascot rail (owner's photo, 7 Nov 2026), one 2.4 m bay of it per module; ?rail=old for the earlier 3 m module.
  const ASCOT_RAIL = params.get("rail") !== "old";
  const SPACING = ASCOT_RAIL ? 2.4 : 3;
  const parts = [];
  if (ASCOT_RAIL) parts.push(ascotRail(SPACING));
  else byName("rail_module").traverse((o) => { if (o.isMesh) parts.push(o); });
  // The finish-line assembly brings its own 30 m of rail on the far side at the post.
  const SKIP = COURSE.rails.skip || [[-16.7, 16.3, -COURSE.rails.gap]];          // [x from, x to, z]
  const gap = (x, z) => SKIP.some(([x0, x1, zz]) => Math.abs(z - zz) < 1.5 && x > x0 && x < x1);
  const spots = [];
  for (const line of COURSE.rails.lines) {
    // walk the line in 3 m steps
    const pts = [];
    let carry = 0;
    for (let i = 1; i < line.length; i++) {
      const [ax, az] = line[i - 1], [bx, bz] = line[i];
      const L = Math.hypot(bx - ax, bz - az);
      for (let d = carry; d < L; d += SPACING) pts.push([ax + (bx - ax) * d / L, az + (bz - az) * d / L]);
      carry = (carry - L) % SPACING; if (carry < 0) carry += SPACING;
    }
    // which way round: the module's track side (local -z) must face the turf
    const [p0, p1] = [pts[0], pts[1]];
    const dx = p1[0] - p0[0], dz = p1[1] - p0[1];
    const flip = !onTrack(p0[0] + dx * 0.5 + dz * 1.0, p0[1] + dz * 0.5 - dx * 1.0);
    for (let i = 0; i + 1 < pts.length; i++) {
      let [a, b] = [pts[i], pts[i + 1]];
      if (flip) [a, b] = [b, a];
      if (gap((a[0] + b[0]) / 2, (a[1] + b[1]) / 2)) continue;
      spots.push([a[0], a[1], Math.atan2(-(b[1] - a[1]), b[0] - a[0])]);

  const m = new THREE.Matrix4(), q = new THREE.Quaternion(), one = new THREE.Vector3(1, 1, 1), up = new THREE.Vector3(0, 1, 0), p = new THREE.Vector3();
  const CHUNK = 20;
  for (const part of parts) {

      const rails = new THREE.InstancedMesh(part.geometry, part.material, n);
      for (let i = 0; i < n; i++) {
        const [x, z, yaw] = spots[c0 + i];
        rails.setMatrixAt(i, m.compose(p.set(x, groundY(x, z), z), q.setFromAxisAngle(up, yaw), one));
      }
      rails.computeBoundingSphere();
      rails.castShadow = rails.receiveShadow = true;
      scene.add(rails);
      LAYERS.rails.push(rails);
    }
  }
  // Furlong poles beyond the inside rail, up the straight mile (the round course shares the first three).
  for (const f of COURSE.straightMile.furlongPoles) {
    const node = byName("furlong_" + f.furlongs);
    if (!node) continue;
    const pole = node.clone();
    if (f.turn !== undefined) { pole.position.set(f.at[0], 0, f.at[1]); pole.rotation.y = f.turn * Math.PI / 180; }   // placed by the course file
    else pole.position.set(f.at[0], 0, f.at[1] - COURSE.rails.gap - 0.7);
    pole.position.y = groundY(pole.position.x, pole.position.z);
    scene.add(pole);
  }
}

// ---------- The starting stalls (tools/blender/build_stalls.py; placed from courses/ascot-stalls.json) ----------
// The kit is one bay that repeats, a closing partition, an end tower, two half-gates and the numbers. The row is
// laid out in the start's own frame: x from the inside rail across the track, z the way the horses run.
// Everything that doesn't move is merged into one mesh per material; the gates are instanced so they can swing.
const STALL_GATES = [];                                   // { mesh, local (piece in the gate's frame), hinge, sign }
let stallsGroup = null;
function buildStalls(gltf, kit) {

  const [x0, z0] = S.insideRailAt, [ox, oz] = S.towardsOuterRail, [rx, rz] = S.runningDirection;
  const row = new THREE.Matrix4().makeBasis(new THREE.Vector3(ox, 0, oz), new THREE.Vector3(0, 1, 0), new THREE.Vector3(rx, 0, rz)).setPosition(x0, 0, z0);
  const at = (x, y = 0) => new THREE.Matrix4().makeTranslation(x, y, 0);

  const units = STALLS.unitsForField[n];
  const left = (k) => S.stalls[k - 1].fromInsideRail - P / 2;          // a stall's left edge, from the inside rail
  units.forEach(([a, b], u) => {
    place.push(["stall_tower", at(left(a) - T)]);
    for (let k = a; k <= b; k++) {
      place.push(["stall_bay", at(left(k))]);
      place.push(["stall_num_" + k, at(left(k) + kit.numberBoard.centre[0], kit.numberBoard.centre[1])]);
    }
    place.push(["stall_partition", at(left(b) + P)]);
    // a plaque over every few bays along the top board (none over a group too short for it)
    const every = STALLS.kit.plaqueEvery || 5;
    for (let g = a; g <= b; g += every) {
      const h = Math.min(g + every - 1, b);
      if (h - g >= 2) place.push(["stall_plaque", at((left(g) + left(h) + P) / 2, kit.plaque.height)]);
    }

  gltf.scene.updateMatrixWorld(true);
  for (const [name, m] of place) {
    const node = gltf.scene.getObjectByName(name);
    if (!node) continue;
    const inv = new THREE.Matrix4().copy(node.matrixWorld).invert();
    node.traverse((o) => {
      if (!o.isMesh) return;
      const g = keep(o.geometry.clone()).applyMatrix4(new THREE.Matrix4().multiplyMatrices(row, m).multiply(inv).multiply(o.matrixWorld));
      const key = o.material.name;

    const node = gltf.scene.getObjectByName("stall_gate_" + side);
    const inv = new THREE.Matrix4().copy(node.matrixWorld).invert();
    node.traverse((o) => {
      if (!o.isMesh) return;
      const g = keep(o.geometry.clone()).applyMatrix4(new THREE.Matrix4().multiplyMatrices(inv, o.matrixWorld));

const _gm = new THREE.Matrix4(), _gr = new THREE.Matrix4();

  const a = THREE.MathUtils.degToRad(STALLS.gates.openDegrees) * k;

// ---------- Architecture: stand, site components, finish line, crowd (all from Blender, placed from data) ----------
const ARCH = "assets/architecture";
const crowdMeshes = [];

function meshesOf(obj) { const out = []; obj.updateMatrixWorld(true); obj.traverse((o) => { if (o.isMesh) out.push(o); }); return out; }

// Static scenery with Blender's lighting baked in (tools/blender/bake_static_world.py): the stand (its light

  return t;
}

  // the baked ground is drawn first of all and marks its pixels; the plain turf and grass under it skip every pixel
  // it covers (they used to be painted in full, then painted over: two extra screens of work every frame)
  else if (name.includes("digit")) mat = new THREE.MeshBasicMaterial({ color: m.material.color.clone().multiplyScalar(2.2) });
  else {

    mat = new THREE.MeshBasicMaterial({ color: col, lightMap: tex, lightMapIntensity: Math.PI * info.scale });
  }

  return mat;
}
function placeBaked(gltf, B, dressing) {
  for (const key of ["stand", "site", "finish", "ground"]) {
    const info = B[key];
    if (!info || !info.mesh) continue;
    const node = gltf.scene.getObjectByName(info.mesh);
    if (!node) { console.warn("Baked mesh missing:", key); continue; }
    const tex = bakedTex(info.lightMap || info.map);
    if (key === "stand") STANDS.setModules(COURSE.grandstand.modules);
    for (const m of meshesOf(node)) {
      m.material = bakedMaterial(m, info, tex, key);
      m.castShadow = false; m.receiveShadow = false;
      if (key === "ground") m.renderOrder = LEGACY_GROUND ? 0 : -3;
      (key === "ground" ? LAYERS.ground : LAYERS.buildings).push(m);
    }
    scene.add(node);

// Beyond the baked ground (or all of it, on a course with nothing baked yet): plain grass, and the turf right round the
// course, in the same light (see buildTurf); the paler strips at the line and the furlongs; the field's shadows.
function buildPlainGround(G) {
  const o = G.outside, tf = G.turf || [0.12, 0.3, 0.06];
  const far = new THREE.Mesh(new THREE.PlaneGeometry(9000, 9000), turfLook(groundDetail(new THREE.MeshBasicMaterial({ color: new THREE.Color(o[0], o[1], o[2]), ...GROUND_UNDER }), 0.2), "far"));
  far.rotation.x = -Math.PI / 2; far.position.set(700, -0.06, -400);
  far.renderOrder = LEGACY_GROUND ? -3 : -1;
  scene.add(far);
  LAYERS.ground.push(far);
  if (GROUND) {                                   // the site's ground over the grid, drawn first: the flat far ground fills beyond it
    const g = GROUND, w = g.cell * (g.nx - 1), d = g.cell * (g.nz - 1);
    const geo = new THREE.PlaneGeometry(w, d, g.nx - 1, g.nz - 1).rotateX(-Math.PI / 2).translate(g.x0 + w / 2, -0.06, g.z0 + d / 2);
    const site = new THREE.Mesh(drape(geo), far.material);

    scene.add(site); LAYERS.ground.push(site);
  }

  // flashes against the ground beneath it). It moves with the field, lined up with the course (see the frame loop):

  // straight, shaded wherever it was in shot), and the field now has its shadows on the round course's bends too.
  const catcher = new THREE.Mesh(new THREE.PlaneGeometry(120, 44, GROUND ? 24 : 1, GROUND ? 6 : 1).rotateX(-Math.PI / 2), new THREE.ShadowMaterial({ color: "#1d2c14", opacity: 0.38, polygonOffset: true, polygonOffsetFactor: -2, polygonOffsetUnits: -4 }));
  catcher.position.set(60, 0.03, MID_Z);

function layCatcher(x, z, yaw) {

  const f = c.userData.flat, p = c.geometry.attributes.position, cs = Math.cos(yaw), sn = Math.sin(yaw);
  for (let i = 0; i < p.count; i++) {
    const lx = f[i * 3], lz = f[i * 3 + 2], wx = x + lx * cs + lz * sn, wz = z - lx * sn + lz * cs;
    p.setXYZ(i, lx, groundY(wx, wz) + 0.03, lz);

// The site components, instanced: the bake made one mesh per piece and quarter turn (bake.json -> site.kit,
// each in the piece's own axes), so the download holds each piece once however many copies stand round the
// course. Every copy in courses/ascot-site-dressing.json is drawn from it: one batch per material (one draw
// each where the browser has WEBGL_multi_draw), and copies out of shot are skipped one by one.
function placeSiteKit(gltf, info, pieces) {
  const tex = bakedTex(info.lightMap);
  const quarter = (t) => (((Math.round(t / 90) % 4) + 4) % 4);
  const byMat = new Map();
  for (const [vkey, nodeName] of Object.entries(info.kit)) {
    const node = gltf.scene.getObjectByName(nodeName);
    if (!node) { console.warn("Kit piece missing:", nodeName); continue; }
    for (const m of meshesOf(node)) {
      const name = m.material.name || "";
      if (!byMat.has(name)) byMat.set(name, { mat: bakedMaterial(m, info, tex, "site"), parts: new Map() });
      const g = m.geometry.clone().applyMatrix4(m.matrixWorld);
      for (const k of Object.keys(g.attributes)) if (!["position", "normal", "uv"].includes(k)) g.deleteAttribute(k);
      byMat.get(name).parts.set(vkey, g);
    }
  }
  const m4 = new THREE.Matrix4();
  for (const { mat, parts } of byMat.values()) {
    const use = pieces.filter((p) => parts.has(p.piece + "_q" + quarter(p.turn || 0)));
    if (!use.length) continue;
    let nv = 0, ni = 0;
    for (const g of parts.values()) { nv += g.attributes.position.count; ni += g.index.count; }
    const batch = new THREE.BatchedMesh(use.length, nv, ni, mat);

    const ids = new Map();
    for (const [vkey, g] of parts) ids.set(vkey, batch.addGeometry(g));
    for (const p of use) {
      const id = batch.addInstance(ids.get(p.piece + "_q" + quarter(p.turn || 0)));
      batch.setMatrixAt(id, m4.makeRotationY(Math.PI + (p.turn || 0) * Math.PI / 180).setPosition(p.x, 0, p.z));
    }
    batch.castShadow = batch.receiveShadow = false;
    scene.add(batch);
    LAYERS.buildings.push(batch);
  }
  console.log("site kit:", Object.keys(info.kit).length, "pieces baked,", pieces.length, "placed,", byMat.size, "batches");
}

// Planting belts (tools/blender/build_planting.py, placed from courses/ascot-planting.json): Thoroughbred
// boards just behind the far rails, a low dense hedge closing the view at eye level, and rows of the
// leafy trees behind and above it. Lit live like the loose trees.
const TD = VIEW.treeDetail;

const NEAR_K = { high: 1, medium: 0.6, low: 0.3, lightest: 0.15 };
const isNear = (x, z) => Math.hypot(x - TD.centre[0], z - TD.centre[1]) < TD.nearRadius * (CLAY_TREES ? NEAR_K[qLevel] : 1);

function clayHedge(g) {

}

      if (hc && hc.count) { let r = 0, g = 0, b = 0; for (let i = 0; i < hc.count; i++) { r += hc.getX(i); g += hc.getY(i); b += hc.getZ(i); } HEDGE_MEAN = new THREE.Color(r / hc.count, g / hc.count, b / hc.count); }

  if (!planting) return;
  const m4 = new THREE.Matrix4(), q = new THREE.Quaternion(), one = new THREE.Vector3(1, 1, 1), sc = new THREE.Vector3(), p = new THREE.Vector3(), up = new THREE.Vector3(0, 1, 0);
  const byDesign = new Map();
  for (const b of planting.boards) { if (!byDesign.has(b[3])) byDesign.set(b[3], []); byDesign.get(b[3]).push(b); }
  for (const [design, list] of byDesign) {
    const node = gltf.scene.getObjectByName("board_" + design);
    if (!node) continue;
    for (const part of meshesOf(node)) {
      const mat = new THREE.MeshLambertMaterial({ color: part.material.color, map: part.material.map || null });
      // (owner, 7 Nov: the boards higher, so the Thoroughbred advertising reads over the rail) the board and its frame
      // stand BOARD_LIFT metres higher on longer legs: everything above the feet moves up, the feet stay on the ground
      const geo = part.geometry.clone(), pos = geo.attributes.position;
      for (let i = 0; i < pos.count; i++) if (pos.getY(i) > 0.2) pos.setY(i, pos.getY(i) + BOARD_LIFT);
      geo.computeBoundingSphere(); geo.computeBoundingBox();
      const inst = new THREE.InstancedMesh(geo, mat, list.length);
      list.forEach(([x, z, turn, , s], i) => inst.setMatrixAt(i, m4.compose(p.set(x, groundY(x, z), z), q.setFromAxisAngle(up, turn * Math.PI / 180), s ? sc.set(s, s, s) : one)));
      inst.computeBoundingSphere();
      scene.add(inst);
      LAYERS.trees.push(inst);
    }
  }
  if (treeLib) instanceTrees(treeLib, planting.trees.map(([x, z, tree, s, turn]) => ({ x, z, tree, s, turn, belt: true })));
}

// Instance tree models: full crowns near the action, light crowns further off (see treeDetail).
const treeMat = new THREE.MeshLambertMaterial({ vertexColors: true });
// The finish study's clay trees (tools/blender/export_clay_trees.py, owner 7 Nov 2026): the crowns carry their
// shading as vertex colours and each copy gets its leaf colour here, one of the study's greens (the odd copper beech).
let CLAY_TREES = null;
const _leafCol = new THREE.Color();
function clayLeaf(key, t, i) {
  if (!CLAY_TREES || !key.includes("_crown")) return null;
  const L = CLAY_TREES.leaf, h = Math.abs(Math.sin((t.x * 12.9898 + t.z * 78.233) * 0.0137) * 43758.5453) % 1;
  _leafCol.set(L[Math.floor(h * L.length) % L.length]);
  // a little richer than the study's colours: the live light is warmer on the leaves than Cycles' leaf material
  const g = 0.3 * _leafCol.r + 0.59 * _leafCol.g + 0.11 * _leafCol.b;
  return _leafCol.setRGB(g + (_leafCol.r - g) * 1.3, g + (_leafCol.g - g) * 1.3, g + (_leafCol.b - g) * 1.3).multiplyScalar(CLAY_TREES.shadeMax);
}
// Low and Lightest (chosen as the view opens, or remembered by Auto from the last race) use the simple crowns
// everywhere; Lightest also leaves out every other tree in the belts and away from the action, the rest a little bigger.
const LITE_TREES = qLevel === "low" || qLevel === "lightest", THIN_BELTS = qLevel === "lightest";
// The understorey's shape: a low, rounded mass of 80 faces in a dark leaf green (the light crowns are 220 each, and
// there are 1,400 belt trees): it only has to fill the gap between the hedge and the crowns.
// (owner, 7 Nov: the fill was all one green; mix greens, more the darker hedge's colour) Its geometry carries only
// light and shade; each tree's understorey takes one of a few dark greens round the hedge's own (UNDER_MIX).
let UNDER_GEO = null, HEDGE_MEAN = null;
const BOARD_LIFT = 0.8;
const UNDER_MIX = [[0.95, 1, 0.9], [0.8, 0.88, 0.78], [1.08, 1.06, 0.82], [0.72, 0.8, 0.8], [0.9, 0.98, 1.02], [1.15, 1.1, 0.9]];
function underColour(t, crownMean) {
  const h = Math.abs(Math.sin((t.x * 7.31 + t.z * 3.17) * 0.091) * 24634.6345) % 1;
  const base = (HEDGE_MEAN || crownMean).clone().lerp(crownMean, 0.25);
  const k = UNDER_MIX[Math.floor(h * UNDER_MIX.length) % UNDER_MIX.length];

}
let UNDER_CROWN = null;
function underGeometry(crown) {
  if (UNDER_GEO) return UNDER_GEO;
  const g = new THREE.IcosahedronGeometry(1, 1), c = crown.attributes.color;
  const base = new THREE.Color(1, 1, 1);
  UNDER_CROWN = new THREE.Color(0.2, 0.3, 0.12);
  if (c) { let r = 0, gg = 0, b = 0; const n = c.count; for (let i = 0; i < n; i++) { r += c.getX(i); gg += c.getY(i); b += c.getZ(i); } UNDER_CROWN.setRGB(r / n, gg / n, b / n).multiplyScalar(0.8); }
  g.scale(4.6, 2.6, 4.6).translate(0, 3.0, 0);
  const pos = g.attributes.position, col = new Float32Array(pos.count * 3);
  for (let i = 0; i < pos.count; i++) { const k = 0.75 + 0.35 * THREE.MathUtils.clamp((pos.getY(i) - 0.4) / 5.2, 0, 1); col[i * 3] = base.r * k; col[i * 3 + 1] = base.g * k; col[i * 3 + 2] = base.b * k; }

}
function instanceTrees(gltf, list) {
  const groups = new Map();
  for (const t of list) {
    if (THIN_BELTS && (t.belt || !isNear(t.x, t.z))) { if ((Math.round(t.x * 7 + t.z * 13) & 1) === 1) continue; t.s *= 1.12; }
    const near = !LITE_TREES && isNear(t.x, t.z);
    // belt trees also get an understorey: their light crown squashed low under the real one, so the belts read as
    // solid woodland down to the hedge instead of crowns floating over a strip of sky (owner, 7 Nov)
    const parts = t.scrub ? ["_crown_far"] : [near ? "_crown" : "_crown_far"].concat(near || !t.belt ? ["_trunk"] : []).concat(t.belt ? ["_under"] : []);
    for (const part of parts) {
      const key = t.tree + part;
      if (!groups.has(key)) groups.set(key, []);
      groups.get(key).push(t);
    }
  }
  const m4 = new THREE.Matrix4(), q = new THREE.Quaternion(), sc = new THREE.Vector3(), p = new THREE.Vector3(), up = new THREE.Vector3(0, 1, 0);
  for (const [key, ts] of groups) {
    const under = key.endsWith("_under"), base = under ? key.replace("_under", "_crown_far") : key;
    const node = gltf.scene.getObjectByName(base) || gltf.scene.getObjectByName(base.replace("_far", ""));
    if (!node) continue;
    for (const mesh of meshesOf(node)) {
      // a look may swap the tree's shape and material, and give each tree its own colour (looks.js)
      const geo = under ? underGeometry(mesh.geometry) : LOOKS.treeGeometry(base, mesh.geometry) || mesh.geometry;
      const inst = new THREE.InstancedMesh(geo, LOOKS.treeMaterial(treeMat, base), ts.length);
      ts.forEach((t, i) => {
        q.setFromAxisAngle(up, ((t.turn || 0) + (under ? 70 : 0)) * Math.PI / 180);
        if (under) sc.set(t.s, t.s, t.s); else sc.set(t.s, t.s * (t.sy || 1), t.s);
        inst.setMatrixAt(i, m4.compose(p.set(t.x, (under ? -0.6 : 0) + groundY(t.x, t.z) + (t.dy || 0), t.z), q, sc));
        // (the clay crowns carry only light and shade: their understorey takes the tree's own leaf colour, darker)
        const c = under ? (CLAY_TREES ? clayLeaf(base, t, i).clone().multiplyScalar(0.7) : underColour(t, UNDER_CROWN)) : LOOKS.treeColour(key, t, i) || clayLeaf(key, t, i); if (c) inst.setColorAt(i, c);
      });

    }

}

// The stills' leafy trees (tools/blender/export_trees.py), scattered where courses/ascot-view.json says:
// behind the stand, round the enclosures, in the infield and beyond the bend. Vertex colours carry the
// stills' dark-base-to-sunlit-top colouring; normals are bent out from each crown's centre.
function placeTrees(gltf, dressing) {
  const names = ["oak_a", "oak_b", "oak_c", "wide_a", "wide_b", "poplar_a"];
  const rnd = seeded(11);
  const CL = VIEW.clearOf, S = CL.stand;
  const pieces = (dressing && dressing.pieces) || [];
  const clear = (x, z) => (x > S[0] && x < S[2] && z > S[1] && z < S[3])
    || onTrack(x, z) || distToRails(x, z) < CL.track
    || pieces.some((p) => Math.abs(p.x - x) < CL.pieces && Math.abs(p.z - z) < CL.pieces);
  const spots = [];
  for (const a of VIEW.trees) {
    const [x0, x1] = [Math.min(a.area[0], a.area[2]), Math.max(a.area[0], a.area[2])];
    const [z0, z1] = [Math.min(a.area[1], a.area[3]), Math.max(a.area[1], a.area[3])];
    for (let z = z0; z < z1; z += a.spacing) {
      for (let x = x0 + rnd() * a.spacing; x < x1; x += a.spacing * (0.7 + rnd() * 0.6)) {
        if (rnd() < (a.skip || 0)) continue;
        const n = a.clump ? a.clump[0] + Math.floor(rnd() * (a.clump[1] - a.clump[0] + 1)) : 1;
        for (let k = 0; k < n; k++) {
          const tx = x + (rnd() - 0.5) * (n > 1 ? 14 : a.spacing * 0.6), tz = z + (rnd() - 0.5) * (n > 1 ? 10 : a.spacing * 0.6);
          if (!clear(tx, tz)) spots.push({ x: tx, z: tz, s: a.scale[0] + rnd() * (a.scale[1] - a.scale[0]) });
        }
      }
    }
  }
  for (const sp of spots) { sp.tree = names[Math.floor(rnd() * names.length)]; sp.turn = rnd() * 360; sp.sy = 0.92 + rnd() * 0.18; }
  instanceTrees(gltf, spots);
  const m4 = new THREE.Matrix4(), q = new THREE.Quaternion(), sc = new THREE.Vector3(), p = new THREE.Vector3();
  // Soft shadows on the grass, falling away from the sun.
  console.log("trees:", spots.length);
  const shadows = new THREE.InstancedMesh(new THREE.PlaneGeometry(1, 1), new THREE.MeshBasicMaterial({ map: shadowTex, color: "#1f3318", transparent: true, opacity: 0.45, depthWrite: false, polygonOffset: true, polygonOffsetFactor: -2, polygonOffsetUnits: -4 }), spots.length);
  const sunFlat = new THREE.Vector2(-SUN_OFFSET.x, -SUN_OFFSET.z).normalize();
  const ang = Math.atan2(sunFlat.y, sunFlat.x);
  spots.forEach((t, i) => {
    const h = 11 * t.s;
    p.set(t.x + sunFlat.x * h * 0.35, 0.04, t.z + sunFlat.y * h * 0.35);
    q.setFromEuler(new THREE.Euler(-Math.PI / 2, 0, -ang, "YXZ"));
    shadows.setMatrixAt(i, m4.compose(p, q, sc.set(h * 0.95, h * 0.6, 1)));
  });
  shadows.frustumCulled = false;
  scene.add(shadows);
  LAYERS.trees.push(shadows);
}

// A course drawn live, with nothing baked yet (Newmarket: courses/<id>-scenery.json, tools/course/newmarket/to_race_view.py):
// the stands and site pieces from Blender in their own matte clay colours, lit live like the horses; the finish-line
// assembly; walls and hedges as boxes; paving and gravel; the grassy banks; the trees, with soft shadows; the boards.
function placeScenery(SC, models, treeLib, belts) {
  const lib = {};
  (SC.models || []).forEach((name, k) => { if (models[k]) lib[name] = models[k]; });
  const m4 = new THREE.Matrix4(), q = new THREE.Quaternion(), p = new THREE.Vector3(), sc = new THREE.Vector3(), up = new THREE.Vector3(0, 1, 0);
  const clay = new Map();
  const clayOf = (mat) => {                         // matte painted clay: no shine, the colour as modelled
    if (!clay.has(mat)) {
      const c = new THREE.MeshLambertMaterial({ color: mat.color ? mat.color.clone() : new THREE.Color("#ddd"), map: mat.map || null, side: mat.side });
      c.name = mat.name; clay.set(mat, c);
    }
    return clay.get(mat);
  };
  // the pieces, one instanced mesh per part of each piece
  const groups = new Map();
  for (const it of SC.pieces) { const k = it[0] + "/" + it[1]; if (!groups.has(k)) groups.set(k, []); groups.get(k).push(it); }
  let nPieces = 0;
  for (const [k, list] of groups) {
    const [model, piece] = k.split("/"), g = lib[model];
    const node = g && g.scene.getObjectByName(piece);
    if (!node) { console.warn("Scenery piece missing:", k); continue; }
    for (const mesh of meshesOf(node)) {
      const geo = mesh.geometry.clone().applyMatrix4(mesh.matrixWorld);
      const inst = new THREE.InstancedMesh(geo, clayOf(mesh.material), list.length);
      list.forEach(([, , x, z, turn, sx, s], i) => inst.setMatrixAt(i, m4.compose(p.set(x, groundY(x, z), z), q.setFromAxisAngle(up, turn * Math.PI / 180), sc.set(sx, s, s))));
      inst.computeBoundingSphere();
      inst.castShadow = true; inst.receiveShadow = true;
      scene.add(inst); LAYERS.buildings.push(inst);
    }
    nPieces += list.length;
  }
  // the finish-line assembly on the far rail at the line (it brings its own stretch of rail)
  const fl = SC.finishLine && lib.finish_line && lib.finish_line.scene.getObjectByName("finish_line");
  if (fl) {
    const f = fl.clone();
    f.traverse((o) => { if (o.isMesh) { o.material = o.material.name.includes("digit") ? o.material : clayOf(o.material); o.castShadow = o.receiveShadow = true; } });
    f.position.set(SC.finishLine.at[0], groundY(SC.finishLine.at[0], SC.finishLine.at[1]), SC.finishLine.at[1]); f.rotation.y = SC.finishLine.turn * Math.PI / 180;
    scene.add(f); LAYERS.buildings.push(f);
  }
  // walls, hedges and copings: [x, z, length, depth, y from, y to, yaw]
  const unit = new THREE.BoxGeometry(1, 1, 1);
  for (const [colour, list] of Object.entries(SC.boxes || {})) {
    const inst = new THREE.InstancedMesh(unit, new THREE.MeshLambertMaterial({ color: colour }), list.length);
    list.forEach(([x, z, L, D, y0, y1, yaw], i) => inst.setMatrixAt(i, m4.compose(p.set(x, (y0 + y1) / 2 + groundY(x, z), z), q.setFromAxisAngle(up, yaw), sc.set(L, y1 - y0, D))));
    inst.computeBoundingSphere(); inst.castShadow = inst.receiveShadow = true;
    scene.add(inst); LAYERS.buildings.push(inst);
  }
  // paving and gravel, flat on the grass, in the ground's own unlit light
  for (const [colour, list] of Object.entries(SC.flats || {})) {
    const geos = list.map(({ y, pts }) => {
      const g = new THREE.ShapeGeometry(new THREE.Shape(pts.map(([x, z]) => new THREE.Vector2(x, -z)))).rotateX(-Math.PI / 2).translate(0, y, 0);
      return GROUND ? drape(TESSELLATE.modify(g.toNonIndexed())) : g;          // cut fine, so it follows the ground
    });
    const m = new THREE.Mesh(mergeGeometries(geos), groundLight(groundDetail(new THREE.MeshBasicMaterial({ color: colour, polygonOffset: true, polygonOffsetFactor: -1, polygonOffsetUnits: -2 }), 0.15)));
    m.renderOrder = -1; scene.add(m); LAYERS.ground.push(m);
  }
  // grassy banks: rows of points across each bank, shaded by their slope towards the sun (the flat matches the grass)
  const G = VIEW.ground, sunDir = SUN_OFFSET.clone().normalize();
  for (const b of SC.banks || []) {
    const rows = b.rows, nr = rows.length, nc = rows[0].length / 3;
    const pos = new Float32Array(nr * nc * 3), idx = [];
    rows.forEach((r, i) => pos.set(r, i * nc * 3));
    for (let i = 0; i + 1 < nr; i++) for (let j = 0; j + 1 < nc; j++) {
      const a = i * nc + j, b2 = a + nc;
      idx.push(a, b2, a + 1, a + 1, b2, b2 + 1);
    }
    const geo = new THREE.BufferGeometry();
    geo.setAttribute("position", new THREE.BufferAttribute(pos, 3)); geo.setIndex(idx); geo.computeVertexNormals();
    const nrm = geo.attributes.normal, col = new Float32Array(nr * nc * 3), flat = 0.72 + 0.4 * Math.max(0, sunDir.y);
    const foot = G.outside, top = G.bank || G.outside;                 // the lawn's colour at the foot, deeper up the bank
    const ramp = b.ramp || G.bankRamp, mot = b.mottle ?? (G.bankMottle || 0);   // or a ramp by height (owner, 9 Nov late: the Dyke's depth)
    const rampAt = (h) => {
      let k = 0; while (k + 1 < ramp.length && ramp[k + 1][0] < h) k++;
      if (k + 1 >= ramp.length) return ramp[k][1];
      const [h0, c0] = ramp[k], [h1, c1] = ramp[k + 1], t = THREE.MathUtils.clamp((h - h0) / (h1 - h0), 0, 1);
      return [0, 1, 2].map((c) => c0[c] + (c1[c] - c0[c]) * t);
    };
    for (let i = 0; i < nr * nc; i++) {
      const ny = nrm.getY(i) < 0 ? -1 : 1;                           // either winding: the normal that points up
      const lit = 0.72 + 0.4 * Math.max(0, ny * (nrm.getX(i) * sunDir.x + nrm.getY(i) * sunDir.y + nrm.getZ(i) * sunDir.z));
      const y = pos[i * 3 + 1];
      const m = mot ? 1 + mot * (Math.sin(pos[i * 3] * 0.37 + pos[i * 3 + 2] * 0.21) * Math.sin(pos[i * 3] * 0.11 - pos[i * 3 + 2] * 0.43)) : 1;
      if (ramp) { const c = rampAt(y); for (let k = 0; k < 3; k++) col[i * 3 + k] = c[k] * lit / flat * m; continue; }
      const k = THREE.MathUtils.smoothstep(y, 0.05, 1.6);
      for (let c = 0; c < 3; c++) col[i * 3 + c] = (foot[c] + (top[c] - foot[c]) * k) * lit / flat;
    }
    if (GROUND) { for (let i = 0; i < nr * nc; i++) pos[i * 3 + 1] += groundY(pos[i * 3], pos[i * 3 + 2]); geo.attributes.position.needsUpdate = true; geo.computeBoundingSphere(); }
    geo.setAttribute("color", new THREE.BufferAttribute(col, 3));
    const m = new THREE.Mesh(geo, turfLook(groundDetail(new THREE.MeshBasicMaterial({ vertexColors: true, side: THREE.DoubleSide }), 0.2), "far"));
    scene.add(m); LAYERS.ground.push(m);
  }
  // the boards (as the planting belts'), then the trees
  if (belts && SC.boards) placeBelts(belts, { boards: SC.boards, trees: [] }, null, false);
  if (treeLib && SC.trees) {
    // (belt 2: scrub, e.g. along the Dyke's crest: light crowns only, no trunks, so hundreds of bushes stay cheap)
    const spots = SC.trees.map(([x, z, tree, s, turn, belt, dy]) => ({ x, z, tree, s, turn: turn || 0, belt: belt === 1, scrub: belt === 2, dy: dy || 0 }));
    instanceTrees(treeLib, spots);
    const shadows = new THREE.InstancedMesh(new THREE.PlaneGeometry(1, 1), new THREE.MeshBasicMaterial({ map: shadowTex, color: "#1f3318", transparent: true, opacity: 0.45, depthWrite: false, polygonOffset: true, polygonOffsetFactor: -2, polygonOffsetUnits: -4 }), spots.length);
    const sunFlat = new THREE.Vector2(-SUN_OFFSET.x, -SUN_OFFSET.z).normalize(), ang = Math.atan2(sunFlat.y, sunFlat.x);
    spots.forEach((t, i) => {
      const h = 11 * t.s;
      const sx_ = t.x + sunFlat.x * h * 0.35, sz_ = t.z + sunFlat.y * h * 0.35;
      shadows.setMatrixAt(i, m4.compose(p.set(sx_, 0.04 + groundY(sx_, sz_), sz_), q.setFromEuler(new THREE.Euler(-Math.PI / 2, 0, -ang, "YXZ")), sc.set(t.dy ? 0 : h * 0.95, h * 0.6, 1)));   // (none under sunk trees or the Dyke's scrub)
    });
    shadows.frustumCulled = false; scene.add(shadows); LAYERS.trees.push(shadows);
  }
  console.log("scenery:", nPieces, "pieces,", (SC.trees || []).length, "trees,", (SC.boards || []).length, "boards");
}

// Crowd: four simple figures, instanced (one draw call per figure part), tinted per person. Packed along
// the near rail and thinning back to the stand, the stand's balconies, verandas and steps, the seats and
// floors on the site pieces, and the dressing's crowd areas. Full along the final furlong and round the
// post; thinner up the straight, where it is only ever seen from afar.
const CROWD_FULL = [-110, 220];
// The skittle figures (assets/models/architecture/crowd_set_8.glb, owner's pick "1C", 6 Nov 2026) and their
// colours, as in the finish study (tools/blender/stand_clean_study.py): the top-hat gents in near-black
// morning coats and black top hats, the odd grey; everyone else in muted heritage tones and pastels.
let SKITTLES = false;
const CROWD_PARTS = ["clothes", "skin", "hat", "trim", "hair"];
const SK = {
  clothes: ["#2c3140", "#3a3d44", "#4b4d52", "#2f3a33", "#59544c", "#c9a0a8", "#9fb6c8", "#ddd2b8", "#a8706a", "#88a383", "#d2b874", "#e8e2d6", "#9a88b4", "#cf9476"],
  hats: ["#222226", "#222226", "#2a2a2e", "#efe6d2", "#d8c08a", "#c9a0a8", "#9fb6c8"],
  skin: ["#efc6a4", "#e2b48e", "#c99572", "#9a6a4a"],
  accent: ["#e6998b", "#8db58c", "#eccd7c", "#8eb0d6", "#b49fd2", "#f2ece0", "#c0453a"],
  dark: ["#24262b", "#2f3036", "#3b352f"],
  tophat: ["#1a1a1e", "#1f1f23", "#222226", "#1c1c20", "#26262a", "#1d1d21", "#55555c"],
  tails: ["#1c1d22", "#202128", "#24262c", "#1e1f24", "#2a2c33", "#22232a", "#5c5e64", "#1b1c21"],
};
if (LIGHT && LIGHT.crowd) Object.assign(SK, LIGHT.crowd);      // the model look's crowd colours
const crowdKeep = (x, rnd) => (x >= CROWD_FULL[0] && x <= CROWD_FULL[1]) || rnd() < 0.12;
function buildCrowd(gltf, data, pieceAt) {
  const rnd = seeded(21);
  const pick = (a) => a[Math.floor(rnd() * a.length)];
  const P = LOOKS.crowdPalette(data.palette);
  const spots = [];
  const add = (x, y, z, seated = false) => { if (crowdKeep(x, rnd)) spots.push({ x, y, z, seated }); };
  // a course that lists its crowd one person at a time ([x, y, z, facing], tools/course/newmarket/to_race_view.py)
  if (data.people) for (let i = 0; i < data.people.length; i += 4) spots.push({ x: data.people[i], y: data.people[i + 1], z: data.people[i + 2], face: data.people[i + 3] });
  const S0 = -101.5, S1 = 406;                                  // the stand's west and east ends
  // the standing terraces down to the lawn (owner, 9 Nov 2026): their people stand on the steps (the crowd areas),
  // so nobody on the lawn inside their footprint (grandstand.modules -> groundTerrace: the z each one reaches)
  const TERR = (COURSE.grandstand?.modules || []).filter((m) => m.groundTerrace);
  const onTerrace = (x, z) => TERR.some((m) => x >= m.xWest - 0.6 && x <= m.xEast + 0.6 && z > m.groundTerrace);
  // the lawn between the outer rail and the stand
  const nearRail = COURSE.trackWidth + COURSE.rails.gap;
  for (let z = nearRail + 1.6; z < FRONT - 1.5 && !data.people; z += 0.7) {
    const d = z - nearRail;
    const density = d < 4 ? 0.8 : d < 8 ? 0.35 : 0.08;
    for (let x = S0 - 6; x < S1; x += 0.62) if (rnd() < density && !onTerrace(x, z)) add(x + (rnd() - 0.5) * 0.4, 0, z + (rnd() - 0.5) * 0.4);
  }
  for (let g = 0; g < (data.people ? 0 : 40); g++) {
    const gx = S0 + rnd() * 360, gz = nearRail + 6 + rnd() * (FRONT - nearRail - 8);
    const n = 3 + Math.floor(rnd() * 6);
    for (let k = 0; k < n; k++) { const px = gx + (rnd() - 0.5) * 2.4, pz = gz + (rnd() - 0.5) * 1.8; if (!onTerrace(px, pz)) add(px, 0, pz); }
  }

  for (const a of data.areas || []) {

    const rows = a.z1 - a.z0 < 1.4 ? 1 : 2;

      const lz = a.z0 + 0.15 + r * 0.75;
      for (let x = a.x0; x < a.x1; x += 0.62) {
        if (rnd() >= (a.kind === "steps" ? 0.35 : a.kind === "terrace" ? 0.85 : r === 0 ? 0.78 : 0.4)) continue;
        let y = a.floor;

  // figures are picked four times as often as the others
  const weights = figures.map((f) => (SKITTLES && f.name.includes("_top") ? 4 : 1)), wsum = weights.reduce((a, b) => a + b, 0);
  const pickFig = () => { let r = rnd() * wsum, k = 0; while (r >= weights[k] && k < weights.length - 1) r -= weights[k++]; return k; };

    const people = byFig[fi].map((s) => ({ s, L: SKITTLES ? {
      clothes: pick(top ? SK.tails : SK.clothes), skin: pick(SK.skin), hat: pick(top ? SK.tophat : SK.hats), trim: pick(SK.accent), hair: pick(SK.dark),
      yaw: (rnd() - 0.5) * 1.0, s: 0.94 + rnd() * 0.12,
      mini: MINI && { clothes: pickM(top ? MINI.CROWD_MINI.tails : MINI.CROWD_MINI.clothes), hat: pickM(top ? MINI.CROWD_MINI.tophat : MINI.CROWD_MINI.hats), trim: pickM(MINI.CROWD_MINI.accent) },
    } : {
      clothes: pick(lady ? P.dresses : P.suits), skin: pick(P.skin), hat: pick(lady ? P.hats_lady : P.hats_gent), trim: "#ffffff", hair: "#ffffff",
      yaw: (rnd() - 0.5) * 1.2, s: 0.94 + rnd() * 0.12,            // facing the track, as on the stands side before
    } }));

    // 1 skin, 2 hat, 3 trim, 4 hair); the light one, for far off, has about a third of the triangles.
    const parts = meshesOf(fig).map((p) => {
      const g = new THREE.BufferGeometry();
      g.setAttribute("position", p.geometry.attributes.position);
      g.setAttribute("normal", p.geometry.attributes.normal);
      g.setIndex(p.geometry.index);
      const mn = p.material.name;

}

// The crowd's gentle life, in the vertex shader (nothing per person is sent each frame): a very slight, slow sway,
// never in step with the neighbours; as the leader comes by, those near the rail lean in towards the track and a few
// of the gents slowly lift their hats. Kept minimal on purpose (owner, 7 Nov). Who does what comes from where they stand.
// (beyond thinFrom metres a person is a few pixels high: only 'thin' of them are drawn there; owner's Newmarket crowds,
// 9 Nov, put 35,000 people in the racecard shot)
const CROWD = { figs: [], share: 1, sig: "", uniforms: { uTime: { value: 0 }, uLeader: { value: new THREE.Vector2(0, MID_Z) } }, near: 90, thinFrom: 200, thin: 0.32 };
function crowdMaterial() {
  const mat = new THREE.MeshLambertMaterial({ color: "#ffffff" });
  mat.onBeforeCompile = (sh) => {
    Object.assign(sh.uniforms, CROWD.uniforms);
    sh.vertexShader = sh.vertexShader
      .replace("#include <common>", `#include <common>
        attribute float aPart; attribute vec3 aC0; attribute vec3 aC1; attribute vec3 aC2; attribute vec3 aC3; attribute vec3 aC4;
        uniform float uTime; uniform vec2 uLeader; varying vec3 vPartCol;`)
      .replace("#include <begin_vertex>", `#include <begin_vertex>
        vPartCol = aPart < 0.5 ? aC0 : aPart < 1.5 ? aC1 : aPart < 2.5 ? aC2 : aPart < 3.5 ? aC3 : aC4;
        {
          vec3 ip = vec3(instanceMatrix[3][0], instanceMatrix[3][1], instanceMatrix[3][2]);
          float seed = fract(sin(dot(ip.xz, vec2(12.9898, 78.233))) * 43758.5453);
          float h = transformed.y;
          // (owner, 7 Nov: calm the crowd right down; minimal movement draws less attention to the figures) No
          // hopping on the toes now: a barely-there sway, a slow lean in towards the track as the leaders come by,
          // and only a few hats lifted, slowly.
          float sway = 0.006 * sin(uTime * (0.35 + 0.25 * seed) + seed * 6.2832);
          float ex = smoothstep(75.0, 15.0, abs(ip.x - uLeader.x)) * smoothstep(55.0, 18.0, abs(ip.z - uLeader.y)) * step(0.2, seed);
          transformed.x += (sway + ex * 0.006 * sin(uTime * 1.1 + seed * 9.0)) * h;
          transformed.z -= ex * 0.03 * h;
          if (aPart > 1.5 && aPart < 2.5 && seed > 0.88) transformed.y += ex * 0.1 * smoothstep(0.4, 0.95, 0.5 + 0.5 * sin(uTime * 0.9 + seed * 31.0));
        }`);

      .replace("#include <common>", "#include <common>\nvarying vec3 vPartCol;")
      .replace("#include <color_fragment>", "#include <color_fragment>\ndiffuseColor.rgb *= vPartCol;");

function setCrowdShare(share) { CROWD.share = share; CROWD.sig = ""; }
// Which cells are in shot and which are far: only when that changes are the visible people copied across.
const _fr = new THREE.Frustum(), _pm = new THREE.Matrix4();
function updateCrowd(cam) {
  if (!CROWD.figs.length) return;

  _fr.setFromProjectionMatrix(_pm);
  const plan = CROWD.figs.map((F) => F.cells.map((c) => {
    if (!_fr.intersectsSphere(c.sphere)) return 0;
    const dd = c.sphere.center.distanceTo(cam.position) - c.sphere.radius;
    return dd < CROWD.near ? 1 : dd < CROWD.thinFrom ? 2 : 3;          // 3: far off, every few people only (9 Nov)
  }));

  if (sig === CROWD.sig) return;
  CROWD.sig = sig;
  CROWD.figs.forEach((F, fi) => {
    const k = { 1: 0, 2: 0 };
    F.cells.forEach((c, ci) => {
      const lod = plan[fi][ci];

      const take = Math.round(c.count * CROWD.share * (lod === 3 ? CROWD.thin : 1));
      if (!take) return;

      T.inst.instanceMatrix.array.set(F.mats.subarray(16 * c.start, 16 * (c.start + take)), 16 * at);
      T.cs.forEach((a, j) => a.array.set(F.cols[j].subarray(3 * c.start, 3 * (c.start + take)), 3 * at));

const silkTextures = new Map();
function silkTexture(id) {

const maskTex = texLoader.load("assets/tint-mask.png");

// Coat and silks tint: multiply the neutral grey texture inside each mask (R coat, G points, B silks).
function makeTintable(mat, u) {

      .replace("#include <common>", "#include <common>\nuniform sampler2D mask; uniform vec3 coatCol; uniform vec3 pointsCol; uniform vec3 silkCol;")
      .replace("#include <map_fragment>", `#include <map_fragment>
        {
          vec3 m = texture2D(mask, vMapUv).rgb;

// order). Each runner shows it when small on screen; see chooseHorseDetail().
function horseLod(horse, light) {
  const full = [], lite = [];
  horse.scene.traverse((o) => { if (o.isSkinnedMesh) full.push(o); });
  light.scene.traverse((o) => { if (o.isSkinnedMesh) lite.push(o); });
  if (full.length !== lite.length) { console.warn("light horse: parts don't match"); return null; }
  const out = [];
  for (let k = 0; k < lite.length; k++) {
    const names = full[k].skeleton.bones.map((b) => b.name), map = lite[k].skeleton.bones.map((b) => names.indexOf(b.name));
    if (map.some((i) => i < 0)) { console.warn("light horse: bones don't match"); return null; }
    const g = lite[k].geometry.clone(), si = g.attributes.skinIndex;
    if (!si || si.isInterleavedBufferAttribute) { console.warn("light horse: bone numbers not as expected"); return null; }
    const a = si.array.slice();
    for (let i = 0; i < a.length; i++) { if (a[i] >= map.length) { console.warn("light horse: bone number out of range"); return null; } a[i] = map[a[i]]; }

function chooseHorseDetail() {
  const k = renderer.getDrawingBufferSize(_hs).y / (2 * Math.tan(THREE.MathUtils.degToRad(camera.fov) / 2));
  for (const r of runners) {
    if (!r.light) continue;
    r.obj.getWorldPosition(_hp);
    const px = 2.6 * k / Math.max(1, _hp.distanceTo(camera.position));       // the horse's height on screen, in pixels
    const near = LOD_ALL ? false : r.near ? px > 90 : px > 110;
    if (near === r.near) continue;
    r.near = near;
    r.full.forEach((o) => (o.visible = near)); r.light.forEach((o) => (o.visible = !near));

}

// ---------- The race ----------
// The race engine (race-engine/engine.js, rules from tools/race-bench) runs the whole race before the view starts and
// hands back a timeline: { dt: 0.1, frames }, each frame every runner in draw order as [distance run from the gate
// line along the inside rail (m, the horse's middle; at the off they stand courses/ascot-stalls.json ->
// horseStandsBehind metres behind it, noses at the gates), across the track from its middle (m, + towards the outer
// rail; stall n's 'across' at the off), speed (m/s), effort 0..3 (0 quiet, 1 pushing, 2 driving, 3 the whip),
// heading off the course direction (rad)]. Time 0 is the off: the gates opening. The view only plays it back.
// Until the game hands over real race cards, the field is a random one like the test bench's (assets/engine/field.js),

const SEED = /^\d+$/.test(params.get("seed") || "") ? params.get("seed") : "3";

const ODDS = [];
if (!GP) {

  const Bn = ["Crown", "Banner", "Reverie", "Quarry", "Meadow", "Storm", "Legend", "Arrow", "Spirit", "Echo", "Harbour", "Lantern", "Comet", "Dancer", "Monarch", "Rose", "Falcon", "Sovereign", "Melody", "Voyage", "Charm", "Ember", "Willow", "Tide"];
  let h = [...SEED].reduce((a, ch) => (a * 31 + ch.charCodeAt(0)) >>> 0, 7);
  const rnd = () => ((h = (h * 1664525 + 1013904223) >>> 0) / 4294967296);
  const used = new Set();
  CARD.forEach((c) => { let nm; do nm = A[Math.floor(rnd() * A.length)] + " " + Bn[Math.floor(rnd() * Bn.length)]; while (used.has(nm)); used.add(nm); c.name = nm; });
  const LADDER = [["Evens", 1], ["11/10", 1.1], ["5/4", 1.25], ["11/8", 1.375], ["6/4", 1.5], ["7/4", 1.75], ["2/1", 2], ["9/4", 2.25], ["5/2", 2.5], ["11/4", 2.75], ["3/1", 3], ["7/2", 3.5], ["4/1", 4], ["9/2", 4.5], ["5/1", 5], ["11/2", 5.5], ["6/1", 6], ["13/2", 6.5], ["7/1", 7], ["15/2", 7.5], ["8/1", 8], ["9/1", 9], ["10/1", 10], ["12/1", 12], ["14/1", 14], ["16/1", 16], ["20/1", 20], ["25/1", 25], ["33/1", 33], ["40/1", 40], ["50/1", 50], ["66/1", 66]];
  const w = CARD.map((c) => Math.exp((c.rating || 80) / 6)), sum = w.reduce((a, b) => a + b, 0);
  w.forEach((x, i) => { const p = (x / sum) * 1.2, d = 1 / p - 1; ODDS[i] = LADDER.reduce((a, b) => (Math.abs(Math.log(b[1] / d)) < Math.abs(Math.log(a[1] / d)) ? b : a))[0]; });
}
const { timeline, result: RESULT } = runRace(

  { course: COURSE, stalls: STALLS, standards: STANDARDS, settings: ENGINE_SETTINGS });

// a machine holding 35-55 keeps its quality, and a browser that caps itself at 30 to save power isn't walked down).
// Auto also climbs back a level when there's plenty to spare (55+ fps for about four seconds), but never back to a
// level it had to leave in this race. The level it is on when the race ends is remembered for the next race
// (tb-auto-level). A long frame (the tab hidden, the machine busy for a moment) restarts the count instead of
// counting as a slow second.
const perf = {

    if (dt > 0.25) { if (++this.longs < 3) { this.n = 0; this.sum = 0; return; } } else this.longs = 0;
    if (this.wait > 0) { this.wait -= dt; return; }   // let a change settle before judging it
    this.n++; this.sum += dt;

function updateCamera(now, dt) {
  const T = runners.length ? cameraTarget(now) : { eye: camera.position.clone(), look: focus.clone(), fov: camera.fov, id: "none" };
  if (GROUND && runners.length && T.id !== "free") {
    const lift = (v) => v.setY(v.y + groundY(v.x, v.z));
    lift(T.eye); lift(T.look);
    if (T.anchor && T.anchor !== T.look) lift(T.anchor);
    if (T.guard) T.guard = T.guard.map((g) => lift(g.clone()));

  if (T.id !== lastShot) { snap = true; lastShot = T.id; }
  // Cuts are clean cuts. Within a shot the camera stands where it should (it's already moving smoothly with
  // the field); the look point rides with the leader and only its offset from the leader is smoothed; the
  // zoom widens quickly and tightens slowly, and never lets the leaders out.
  camera.position.copy(T.eye);

    focus.copy(T.anchor).add(state.lookOff);

// ---------- The race dock: running order, course map, pace ----------
// Reads only the timeline (and the course and standards files), so it works the same for any race the engine sends.
const DOCK = (() => {
  const dockEl = document.getElementById("dock"), strip = document.getElementById("orderStrip"), svg = document.getElementById("dockMap");
  const NS = "http://www.w3.org/2000/svg", LEN = 2.4;                      // a length, in metres
  const el = (tag, attrs, parent) => { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); if (parent) parent.appendChild(e); return e; };

  new ResizeObserver(setH).observe(dockEl);
  const btn = document.getElementById("dockBtn");
  const show = (on) => { dockEl.hidden = !on; btn.setAttribute("aria-pressed", on); setH(); try { localStorage.setItem("tb-dock", on ? "1" : "0"); } catch {} };
  btn.onclick = () => show(dockEl.hidden);
  try { if (localStorage.getItem("tb-dock") === "0" || params.get("dock") === "0") show(false); } catch {}

  // --- course map: the whole layout in grey, the race's own route in green, a dot per runner in its colours
  const lines = PATH ? [PATH.pts] : [LOOP.pts.concat([LOOP.pts[0]]), [[0, 0], [COURSE.straightMile.length || 1609.3, 0]], [COURSE.roundMileSpur.from, COURSE.roundMileSpur.to]];
  const route = [];
  for (let u = 0; u <= DIST; u += 12) route.push(toWorld(u, 0));
  const all = lines.flat().concat(route);
  const minX = Math.min(...all.map((p) => p[0])), maxX = Math.max(...all.map((p) => p[0])), minZ = Math.min(...all.map((p) => p[1])), maxZ = Math.max(...all.map((p) => p[1]));
  const pad = (maxX - minX) * 0.05;
  svg.setAttribute("viewBox", `${minX - pad} ${minZ - pad} ${maxX - minX + pad * 2} ${maxZ - minZ + pad * 2}`);
  svg.setAttribute("preserveAspectRatio", "xMidYMid meet");
  const unit = (maxX - minX) / 170;                                        // about one screen pixel at desktop size
  const pathOf = (pts) => "M" + pts.map((p) => p[0].toFixed(1) + " " + p[1].toFixed(1)).join("L");
  for (const l of lines) el("path", { d: pathOf(l), fill: "none", stroke: "#cbbd97", "stroke-width": unit * 4, "stroke-linejoin": "round", "stroke-linecap": "round" }, svg);
  el("path", { d: pathOf(route), fill: "none", stroke: "#1f5a38", "stroke-width": unit * 2.4, "stroke-linejoin": "round", "stroke-linecap": "round", opacity: 0.85 }, svg);
  const [sx, sz] = toWorld(0, 0);
  el("circle", { cx: sx, cy: sz, r: unit * 3.2, fill: "#f4ead2", stroke: "#1f5a38", "stroke-width": unit * 1.2 }, svg);           // the start
  el("rect", { x: -unit * 1.2, y: -unit * 6, width: unit * 2.4, height: unit * 12, fill: "#b5523b" }, svg);                     // the winning post
  const dots = [];
  for (let i = 0; i < RUNNERS; i++) dots.push(el("circle", { r: unit * 6.5, fill: silkFor(i).colour, stroke: "#fff", "stroke-width": unit * 1.6 }, svg));

  // --- running order: a chip per runner (position, silks, number, lengths behind), sliding into place
  const chips = [], spacer = document.createElement("div");      // gives the strip its scroll width (the chips are placed by transform)
  spacer.style.height = "1px"; strip.appendChild(spacer);
  for (let i = 0; i < RUNNERS; i++) {
    const c = document.createElement("div"); c.className = "chip";
    // in the game: the owner's graphic silks, the price and the race-day colour card (black, red, yellow, blue)
    const R = GP && GP.runners[i];
    c.innerHTML = `<span class="pos"></span><img alt="" src="${R && R.silk2d ? R.silk2d : `assets/silks-icons/${silkFor(i).id}.png`}"><span class="no">${i + 1}</span><span class="gap"></span>${R && R.odds ? `<span class="odds">${R.odds}</span>` : ""}`;
    if (R && R.card) c.classList.add("k-" + R.card);
    if (R && R.odds) dockEl.classList.add("priced");
    c.title = GP ? `${i + 1}: ${GP.runners[i].name}${R && R.odds ? ` · ${R.odds}` : ""}${R && R.card ? ` · ${R.card} card` : ""}` : `${i + 1}: ${silkFor(i).name}`;
    if (GP && GP.runners[i].mine) c.classList.add("mine");
    strip.appendChild(c); chips.push(c);
  }
  const lengths = (m) => {
    const l = m / LEN;
    if (l < 0.12) return "nse"; if (l < 0.2) return "shd"; if (l < 0.3) return "hd"; if (l < 0.45) return "nk";
    if (l >= 20) return "20+ L";
    const q = Math.round(l * 4) / 4, w = Math.floor(q), f = ["", "¼", "½", "¾"][Math.round((q - w) * 4)];
    return (w ? w : "") + f;
  };

  // --- pace: each section the leader runs, against par for its length on today's going
  const want = RACE.course === "straight" ? "straight" : RACE.course === "roundMile" ? "roundMile" : "round";
  const pars = STANDARDS.parTimes.filter((p) => p.course === want);
  const par = pars.reduce((a, b) => (Math.abs(b.distance - DIST) < Math.abs(a.distance - DIST) ? b : a), pars[0]);
  const parSpeed = par.distance / par.seconds * STANDARDS.going[GOING].speed;
  const bandOf = (ratio) => STANDARDS.pace.bands.find((b) => ratio < b.below).label;
  // section ends (u): the furlong poles counting back from the line, then the line itself
  const ends = [];
  for (let k = Math.floor(DIST / FURLONG); k >= 1; k--) { const u = DIST - k * FURLONG; if (u > 20) ends.push(u); }
  ends.push(DIST);
  const leaderTime = (u) => {                                    // when the leader reached u, between timeline frames
    const F = timeline.frames;
    for (let i = 1; i < F.length; i++) { const b = leaderAt(F[i]); if (b >= u) { const a = leaderAt(F[i - 1]); return (i - 1 + (u - a) / Math.max(1e-6, b - a)) * timeline.dt; } }
    return Infinity;
  };
  const secs = ends.map((u, k) => {
    const from = k ? ends[k - 1] : 0, t0 = k ? leaderTime(from) : 0, t1 = leaderTime(u);
    const parT = (u - from) / parSpeed + (k ? 0 : STANDARDS.pace.firstSectionExtra);
    return { from, to: u, t: t1 - t0, at: t1, par: parT, band: bandOf((t1 - t0) / parT) };
  });
  const secBox = document.getElementById("paceSections");
  const blocks = secs.map((s) => { const b = document.createElement("i"); b.style.flex = String(s.to - s.from); b.title = ""; secBox.appendChild(b); return b; });
  document.getElementById("goingLine").textContent = `Going: ${GOING} · par ${Math.floor(par.seconds * (1 / STANDARDS.going[GOING].speed) / 60)}m ${(par.seconds / STANDARDS.going[GOING].speed % 60).toFixed(1)}s`;
  const word = document.getElementById("paceWord"), note = document.getElementById("paceNote"), title = document.getElementById("orderTitle");

  // the result: when each runner crossed the line (between timeline frames) and its speed there

    return { t: Infinity, v: 1 };

  let lastOrder = 0, lastDots = 0, lastTop = -1;

    update(now, t, phase) {
      if (dockEl.hidden) return;
      // dots on the map: 20 times a second (a dot moves well under a pixel a frame; redrawing the map every frame was
      // the browser's work, not the race's)
      const tn = performance.now();
      if (tn - lastDots < 50 && !params.has("still")) return;
      lastDots = tn;
      now.forEach((h, i) => { const [x, z] = toWorld(Math.max(0, Math.min(h[0], DIST + 60)), h[1]); dots[i].setAttribute("cx", x.toFixed(1)); dots[i].setAttribute("cy", z.toFixed(1)); });
      const order = now.map((h, i) => [h[0], i]).sort((a, b) => b[0] - a[0]);
      if (dots.length && lastTop !== order[0][1]) { lastTop = order[0][1]; svg.appendChild(dots[lastTop]); }   // the leader's dot on top
      // the order strip and the pace: a few times a second
      if (performance.now() - lastOrder < 200 && !params.has("still")) return;
      lastOrder = performance.now();
      let lead = order[0][0];
      const step = chips[0] ? chips[0].offsetWidth + 4 : 54, over = lead >= DIST;
      if (over) {                                   // past the post: the result, with the margins at the line
        order.splice(0, order.length, ...finish.map((f, i) => [f.t, i]).sort((a, b) => a[0] - b[0]).map(([ft, i]) => [DIST - (ft - winT) * finish[i].v, i]));
        lead = DIST;
      }
      if (phase === "stalls" || phase === "prelude") order.sort((p, q) => p[1] - q[1]);
      order.forEach(([u, i], k) => {

        c.querySelector(".gap").textContent = before ? "" : k === 0 ? (over ? "won" : "lead") : lengths(lead - u);
      });

    },
  };
})();

// ---------- The commentary (owner, 7 Nov: "even if it's just text") ----------
// Written once from the race the engine ran (its timeline and its events: who led, lead changes, who kicked, who was
// short of room or weakening) and the course (passing the stand, the home turn, the furlongs), then shown a line at a
// time as the race plays. Lines are kept apart so each can be read; the finish is always called.
const CALLER = (() => {
  const box = document.getElementById("call");
  const esc = (v) => String(v == null ? "" : v).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const MINE = CARD.findIndex((h) => h.mine);
  const name = (i) => `<b${i === MINE ? ' class="mine"' : ""}>${esc(CARD[i].name || "No. " + (i + 1))}</b>`;
  const F = timeline.frames, dt = timeline.dt, LEN = 2.4, L = LOOP ? LOOP.length : Infinity;
  const frameAt = (t) => F[Math.min(F.length - 1, Math.max(0, Math.round(t / dt)))];
  const order = (f) => f.map((h, i) => [h[0], i]).sort((a, b) => b[0] - a[0]);
  const when = (u) => { for (let k = 0; k < F.length; k++) if (leaderAt(F[k]) >= u) return k * dt; return Infinity; };
  const margin = (m) => { const l = m / LEN; if (l < 0.3) return "a head"; if (l < 0.6) return "a neck"; if (l < 0.9) return "half a length"; if (l < 1.4) return "a length";
    if (l < 1.9) return "a length and a half"; return `${Math.round(l)} lengths`; };
  const furl = (d) => { const f = Math.round(d / FURLONG); return f === 1 ? "a furlong" : `${f} furlongs`; };
  const lines = [];                                       // { t, text, p: priority (higher wins a clash) }
  const add = (t, text, p) => { if (t >= 0 && t <= T_FINISH + 0.1) lines.push({ t, text, p }); };
  // the off
  const missed = RESULT.events.filter((e) => e.kind === "missed the break").map((e) => e.runner);
  add(0.2, missed.length ? `They're off! And ${missed.map(name).join(" and ")} ${missed.length > 1 ? "have" : "has"} missed the break.` : "They're off, and they've all got away well.", 9);
  // the race's own events (a long race swaps the lead often: early on, only one change in every 20 seconds is called)
  const pick = (arr, k) => arr[k % arr.length];
  let lastChange = -99, nChange = 0;
  for (const e of RESULT.events) {
    const lead = order(frameAt(e.t))[0][1], toGo = DIST - leaderAt(frameAt(e.t));
    if (e.kind === "led") add(e.t + 0.6, pick([`${name(e.runner)} goes on and makes the running.`, `${name(e.runner)} is quickly away and takes them along.`], e.runner), 6);
    else if (e.kind === "lead change") {
      const late = toGo < 800;
      if (!late && e.t - lastChange < 20) continue;
      lastChange = e.t;
      add(e.t, pick([`${name(e.runner)} takes it up from ${name(e.from)}!`, `${name(e.runner)} goes past ${name(e.from)} into the lead.`, `Now it's ${name(e.runner)} in front.`, `${name(e.runner)} hits the front!`], nChange++), late ? 7 : 4);
    }
    else if (e.kind === "kicked") add(e.t, `${name(e.runner)} ${e.first ? "is the first to kick for home" : "kicks on"}!`, e.first ? 7 : 5);
    else if (e.kind === "weakening" && e.place <= 5) add(e.t, `${name(e.runner)} is starting to weaken.`, 3);
    else if (e.kind === "short of room" && e.lengths >= 1) add(e.t, `${name(e.runner)} is short of room${e.runner === lead ? "" : " in behind"}.`, e.runner === MINE ? 5 : 3);
    else if (e.kind === "switched" && e.runner === MINE) add(e.t, `${name(e.runner)} is switched ${e.side === "out" ? "to the outside" : "to the inside"}.`, 3);
  }
  // the order, every so often: who leads, by how far, who's next, who's last
  const every = DIST > 2400 ? 500 : DIST > 1500 ? 380 : 300;
  let k = 0;
