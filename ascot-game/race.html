<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Race simulator</title>
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500;600&family=Nunito:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Crimson+Pro:wght@500;600;700&display=swap" rel="stylesheet">
<style>
/* =====================================================================
   THOROUGHBRED HOUSE STYLE v2  ·  shared by every HTML element on the site
   Paste this block at the top of each page's <style>. Page-only styles go below it.
   Fonts: <link href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500;600&family=Nunito:wght@400;500;600;700;800&display=swap" rel="stylesheet">

   Layout, top to bottom, on every page:
     1. Band      ← back to the previous step (far left) + status line | PIN + ? (far right)
     2. Stepbar   sticky: numbered strip 1, 2, 3… with the forward button (Next / Continue /
                  Confirm) fixed at its right-hand end. Done green, current gold, to come grey.
     3. Head      page title + one line of explanation
     4. Bar       optional: status on the left, secondary buttons (Copy PIN, Change…) on the right.
                  With no status it loses its box and sits tight under the heading.
     5. Content
   ===================================================================== */
:root{
  --tb-band:#446f66;      /* header band */
  --tb-green:#3d7153;     /* primary buttons, headings, done */
  --tb-green-hi:#346347;
  --tb-gold:#b79042;      /* current step, your selection */
  --tb-bg:#f3efe7;        /* page background */
  --tb-panel:#fbf9f4;     /* boxes */
  --tb-line:#d8d2c4;      /* box borders, upcoming step */
  --tb-ink:#33332b;       /* main text */
  --tb-muted:#6b6a60;     /* secondary text */
  --tb-on-dark:#f2eee7;   /* text on the band and on buttons */
  --tb-danger:#9c3d33;    /* errors, remove */
  --tb-radius:3px;        /* every box and button */
  --tb-display:"Jost","Futura","Avenir Next",system-ui,sans-serif;
  --tb-body:"Nunito",system-ui,-apple-system,"Segoe UI",sans-serif;
  --tb-pad:24px;          /* page side padding */
}
@media (max-width:600px){ :root{ --tb-pad:12px; } }

html,body{margin:0;background:var(--tb-bg);color:var(--tb-ink);font-family:var(--tb-body);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
*{box-sizing:border-box}
button,input,select{font:inherit}
button{cursor:pointer}
button:focus-visible,a:focus-visible,input:focus-visible,summary:focus-visible{outline:2px solid var(--tb-gold);outline-offset:2px}
[hidden]{display:none!important}

/* 1. Band — navigation and game status only (no brand title) */
.tb-band{background:var(--tb-band);color:var(--tb-on-dark);padding:12px var(--tb-pad);min-height:64px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.tb-band-left,.tb-band-right{display:flex;align-items:center;gap:10px;min-width:0}
.tb-back{width:40px;height:40px;flex:0 0 auto;display:grid;place-items:center;border:1px solid rgba(242,238,231,.5);background:transparent;color:var(--tb-on-dark);border-radius:var(--tb-radius);font-size:20px;line-height:1}
.tb-back:hover{background:rgba(242,238,231,.14)}
.tb-where{font-size:15px;letter-spacing:.03em;opacity:.9;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tb-where b{font-weight:700;opacity:1}
.tb-link{border:1px solid rgba(242,238,231,.45);background:transparent;color:var(--tb-on-dark);border-radius:var(--tb-radius);padding:7px 12px;font-size:14px;text-decoration:none;white-space:nowrap}
.tb-link:hover{background:rgba(242,238,231,.14)}
.tb-pin{font-family:var(--tb-display);font-weight:500;font-size:15px;letter-spacing:.22em;padding:7px 14px;border:1px solid rgba(242,238,231,.45);background:rgba(242,238,231,.12);border-radius:var(--tb-radius);white-space:nowrap}
.tb-help{width:40px;height:40px;flex:0 0 auto;border-radius:50%;border:1px solid rgba(242,238,231,.5);background:rgba(242,238,231,.14);color:var(--tb-on-dark);font-family:var(--tb-body);font-weight:800;font-size:18px;display:grid;place-items:center;text-decoration:none}
.tb-help:hover,.tb-help[aria-expanded="true"]{background:rgba(242,238,231,.3)}
.tb-help-wrap{position:relative}

/* 2. Step strip — the numbered 1, 2, 3… navigation */
.tb-steps{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;margin:0 var(--tb-pad)}
.tb-step{background:none;border:none;border-bottom:3px solid var(--tb-line);padding:12px 4px 9px 0;text-align:left;font-family:var(--tb-body);font-size:15px;color:var(--tb-muted)}
.tb-step b{font-weight:800;margin-right:6px}
.tb-step.done{border-color:var(--tb-green);color:var(--tb-green)}
.tb-step.current{border-color:var(--tb-gold);color:var(--tb-ink);font-weight:700}
div.tb-step{cursor:default}
/* Step strip with the forward button fixed at its right-hand end (sticky) */
.tb-stepbar{position:sticky;top:0;z-index:7;background:var(--tb-bg);display:flex;align-items:center;gap:18px;padding:0 var(--tb-pad)}
.tb-stepbar .tb-steps{flex:1 1 auto;margin:0}
.tb-stepbar-go{display:flex;gap:8px;flex:0 0 auto}
.tb-stepbar-go:empty{display:none}
.tb-stepbar > .tb-btn,.tb-stepbar-go .tb-btn{flex:0 0 auto;padding:9px 18px;font-size:15px}
.tb-stepbar:has(> .tb-steps[hidden]){display:none}
.tb-status{margin:8px 0 0;font-size:15px;color:var(--tb-muted)}

/* 3. Page content and headings */
.tb-content{padding:0 var(--tb-pad) 40px}
.tb-head{margin:22px 0 0}
.tb-h{font-family:var(--tb-display);font-weight:600;font-size:24px;letter-spacing:.18em;color:var(--tb-green);margin:0 0 6px;line-height:1.2}
.tb-h2{font-family:var(--tb-display);font-weight:600;font-size:17px;letter-spacing:.14em;color:var(--tb-green);margin:0 0 10px}
.tb-lede{margin:0;font-size:16px;line-height:1.5;color:var(--tb-muted);max-width:70ch}
.tb-lede.ok{color:var(--tb-green);font-weight:700}
.tb-label{font-family:var(--tb-display);font-weight:600;font-size:15px;letter-spacing:.12em;color:var(--tb-green);margin:0 0 8px}

/* 4. Action bar — sticky; status left, buttons right, Continue always the last button */
.tb-bar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:16px 0;padding:8px 10px 8px 14px;background:var(--tb-panel);border:1px solid var(--tb-line);border-radius:var(--tb-radius);box-shadow:0 2px 10px rgba(51,51,43,.06)}
.tb-bar.inset{margin-left:var(--tb-pad);margin-right:var(--tb-pad)}
.tb-bar-info{flex:1 1 auto;min-width:0;font-size:15px;line-height:1.4;color:var(--tb-muted)}
.tb-bar-info.ready{color:var(--tb-green);font-weight:700}
.tb-bar-btns{display:flex;gap:8px;align-items:center;flex:0 0 auto;margin-left:auto}
.tb-bar .tb-btn{padding:9px 16px;font-size:15px}
/* Bar with buttons only (no status): no box, sits tight under the heading */
.tb-bar.plain,.tb-bar:has(> .tb-bar-info[hidden]),.tb-bar:has(> .tb-bar-info:empty){background:var(--tb-bg);border-color:transparent;box-shadow:none;padding:6px 0;margin-top:8px;margin-bottom:12px}

/* 5. Boxes and text boxes */
.tb-panel{background:var(--tb-panel);border:1px solid var(--tb-line);border-radius:var(--tb-radius);padding:18px 20px}
.tb-input{font-family:var(--tb-display);font-weight:500;font-size:24px;letter-spacing:.28em;text-align:center;padding:9px 12px;border:1.5px solid var(--tb-ink);border-radius:var(--tb-radius);background:#fff;color:var(--tb-ink);max-width:100%}
.tb-input::placeholder{color:#b9b4a6}
.tb-empty{margin:6px 0;font-size:15px;color:var(--tb-muted)}
.tb-loading{display:flex;align-items:center;gap:12px;color:var(--tb-muted)}

/* 6. Buttons: primary (green), ghost (outline), go (= Continue, same look as primary) */
.tb-btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:none;border-radius:var(--tb-radius);background:var(--tb-green);color:var(--tb-on-dark);font-family:var(--tb-body);font-weight:600;font-size:17px;letter-spacing:.03em;padding:13px 22px;text-decoration:none;white-space:nowrap}
.tb-btn:not(:disabled):hover{background:var(--tb-green-hi)}
.tb-btn.ghost{background:transparent;color:var(--tb-green);box-shadow:inset 0 0 0 1px var(--tb-green)}
.tb-btn.ghost:not(:disabled):hover{background:#eef3ef}
.tb-btn.sm{padding:7px 12px;font-size:14px}
.tb-btn.block{width:100%}
.tb-btn:disabled{opacity:.45;cursor:default}
.tb-square{width:44px;height:44px;border:1.5px solid var(--tb-ink);background:#fff;color:var(--tb-ink);border-radius:var(--tb-radius);font-size:20px;display:grid;place-items:center;flex:0 0 auto}
.tb-square:hover{background:var(--tb-panel)}
.tb-spin{width:15px;height:15px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:tb-spin .8s linear infinite;flex:0 0 auto}
@keyframes tb-spin{to{transform:rotate(360deg)}}

/* 7. Small pieces */
.tb-chip{display:inline-block;border:1px solid var(--tb-line);background:#fff;border-radius:var(--tb-radius);padding:5px 11px;font-size:14px;color:var(--tb-muted)}
button.tb-chip:hover{border-color:var(--tb-green)}
.tb-chip.on{border-color:var(--tb-green);color:var(--tb-green);background:#eef3ef;font-weight:700}
.tb-badge{display:inline-block;font-size:11px;font-weight:800;letter-spacing:.05em;background:var(--tb-gold);color:#fff;padding:2px 7px;border-radius:2px;margin-left:6px;vertical-align:2px}
.tb-menu{position:absolute;right:0;top:48px;background:#fff;color:var(--tb-ink);border:1px solid var(--tb-line);border-radius:var(--tb-radius);min-width:230px;z-index:40;box-shadow:0 8px 20px rgba(51,51,43,.14)}
.tb-menu button{display:block;width:100%;text-align:left;background:none;border:none;border-bottom:1px solid var(--tb-line);padding:13px 16px;font-size:15.5px;color:var(--tb-ink)}
.tb-menu button:last-child{border-bottom:none}
.tb-menu button:hover{background:var(--tb-panel)}
.tb-toast{position:fixed;left:50%;bottom:16px;transform:translate(-50%,40px);opacity:0;pointer-events:none;background:var(--tb-green);color:var(--tb-on-dark);padding:12px 18px;border-radius:var(--tb-radius);font-size:15px;transition:all .3s ease;z-index:50;max-width:90%;text-align:center}
.tb-toast.show{transform:translate(-50%,0);opacity:1}
.tb-toast.error{background:var(--tb-danger)}

/* Compact phone layout — same pieces, tighter */
@media (max-width:600px){
  .tb-band{padding:8px var(--tb-pad);min-height:50px;gap:8px}
  .tb-band-left,.tb-band-right{gap:6px}
  .tb-back{width:34px;height:34px;font-size:17px}
  .tb-where{font-size:12.5px}
  .tb-link{font-size:12px;padding:5px 8px}
  .tb-pin{font-size:12px;padding:5px 8px;letter-spacing:.14em}
  .tb-band .tb-pin{display:none}
  .rd-mypot{font-size:12px;padding:5px 8px}
  .rd-mypot span{display:none}
  .tb-help{width:32px;height:32px;font-size:15px}
  .tb-menu{top:40px}
  .tb-step{font-size:11.5px;padding:8px 2px 6px 0;border-bottom-width:2px}
  .tb-step b{margin-right:4px}
  .tb-stepbar{flex-wrap:wrap;gap:0;padding-bottom:6px}
  .tb-stepbar .tb-steps{flex-basis:100%}
  .tb-stepbar > .tb-btn,.tb-stepbar-go{margin:6px 0 0 auto}
  .tb-stepbar > .tb-btn,.tb-stepbar-go .tb-btn{padding:6px 14px;font-size:13px}
  .tb-status{font-size:12.5px;margin-top:5px}
  .tb-head{margin-top:12px}
  .tb-h{font-size:16px;letter-spacing:.12em;margin-bottom:3px}
  .tb-h2{font-size:14px;letter-spacing:.1em;margin-bottom:8px}
  .tb-lede{font-size:13px;line-height:1.4}
  .tb-label{font-size:13px;margin-bottom:6px}
  .tb-bar{flex-wrap:wrap;gap:6px;margin:10px 0;padding:6px 8px}
  .tb-bar-info{font-size:12.5px}
  .tb-bar-btns{gap:6px;flex:1 1 100%;flex-wrap:wrap;justify-content:flex-end}
  .tb-bar-info:empty + .tb-bar-btns,.tb-bar-info[hidden] + .tb-bar-btns{flex-basis:100%}
  .tb-bar .tb-btn{padding:7px 10px;font-size:13px;min-height:34px}
  .tb-bar .tb-btn{flex:1 1 auto}
  .tb-panel{padding:12px}
  .tb-input{font-size:19px;padding:6px 8px}
  .tb-empty{font-size:13px}
  .tb-btn{font-size:14px;padding:9px 14px}
  .tb-btn.sm{font-size:12.5px;padding:5px 9px}
  .tb-square{width:34px;height:34px;font-size:16px}
  .tb-chip{font-size:12px;padding:3px 8px}
  .tb-toast{font-size:13px;padding:9px 13px}
}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{transition:none!important;animation:none!important;scroll-behavior:auto!important}}
/* ===================== end of house style ===================== */

/* ===================== Race simulator · broadcast view (prototype) ===================== */
:root{--k-black:#3b3b3b;--k-red:#cc4a32;--k-yellow:#e6ab4a;--k-blue:#6491a8}
.sim-wrap{max-width:1200px;margin:0 auto}

/* The scene: sky, stands, far rail, turf, horses, near rail */
.scene{position:relative;height:520px;margin-top:4px;border-radius:6px;overflow:hidden;background:linear-gradient(#9ec3da,#d6e6ec 30%);box-shadow:0 6px 18px rgba(0,0,0,.2);--sq:120px;--hw:170px;--rail:196px;--adh:30px}
/* Grandstand full of spectators (drawn by the page), moving slower than the course for depth */
.stands{position:absolute;left:0;right:0;top:0;height:calc(var(--rail) - 4px);background-repeat:repeat-x,repeat-x,no-repeat}
.backw{position:absolute;left:0;top:0;bottom:0;width:1px;will-change:transform;z-index:1}
.turf{position:absolute;left:0;right:0;top:var(--rail);bottom:0;
  background:repeating-linear-gradient(90deg,#4f8a4a 0 calc(var(--sq) * 4),#5a9654 calc(var(--sq) * 4) calc(var(--sq) * 8))}
.turf::after{content:"";position:absolute;inset:0;background:linear-gradient(rgba(0,0,0,.12),transparent 30%,transparent 80%,rgba(0,0,0,.08))}
.farrail{position:absolute;left:0;right:0;top:calc(var(--rail) - 10px);height:26px;z-index:2;
  background:linear-gradient(#f7f5ef,#f7f5ef) 0 0/100% 5px no-repeat,repeating-linear-gradient(90deg,#f7f5ef 0 4px,transparent 4px 60px) 0 0/100% 26px}
.world{position:absolute;left:0;top:0;bottom:0;width:1px;will-change:transform;z-index:3}
.ad{position:absolute;top:calc(var(--rail) - var(--adh) - 10px);height:var(--adh);display:grid;place-items:center;font-family:var(--tb-display);font-weight:600;letter-spacing:.12em;font-size:calc(var(--adh) * .5);color:#fff;border-radius:2px;box-shadow:0 2px 0 rgba(0,0,0,.2);white-space:nowrap;padding:0 14px}
.railcrowd{position:absolute;top:calc(var(--rail) - 78px);height:72px;background-repeat:repeat-x;background-size:auto 100%}
.post{position:absolute;top:calc(var(--rail) - 84px);width:6px;height:90px;background:#f7f5ef;border-radius:2px;box-shadow:1px 0 0 rgba(0,0,0,.15);z-index:2}
.post b{position:absolute;left:50%;top:-30px;transform:translateX(-50%);background:#fff;color:#2f5a3c;border:2px solid #2f5a3c;border-radius:50%;width:34px;height:34px;display:grid;place-items:center;font-family:var(--tb-display);font-weight:600;font-size:14px}
.post.key b{background:#f3d48c;border-color:#7a5a12;color:#4a3508}
.winner{position:absolute;top:calc(var(--rail) - 160px);width:94px;margin-left:-47px;z-index:2}
.winner svg{width:100%;height:auto;display:block}
.finline{position:absolute;top:var(--rail);bottom:0;width:5px;background:rgba(255,255,255,.9)}
.stalls{position:absolute;top:calc(var(--rail) - 6px);width:60px;bottom:30px;background:repeating-linear-gradient(#8b939a 0 5px,transparent 5px 34px),linear-gradient(90deg,#5b6670 0 8px,transparent 8px 52px,#5b6670 52px);opacity:.9;border-radius:3px}
.nearrail{position:absolute;left:0;right:0;bottom:0;height:34px;z-index:6;pointer-events:none;
  background:linear-gradient(#f7f5ef,#f7f5ef) 0 6px/100% 6px no-repeat,repeating-linear-gradient(90deg,#f7f5ef 0 7px,transparent 7px 90px) 0 6px/100% 28px}
/* Foreground crowd at the finish, nearest the camera */
.front{position:absolute;left:0;bottom:0;height:92px;width:1px;z-index:7;pointer-events:none;will-change:transform}
.front div{position:absolute;bottom:-22px;height:110px;background-repeat:repeat-x;background-size:auto 100%}

/* A horse and jockey, side on */
.rh{position:absolute;left:0;top:0;width:var(--hw);will-change:transform;transform-origin:0 0}
.rh .rimg{width:100%;aspect-ratio:420/276;background-repeat:no-repeat;background-size:1200% 100%}
.rh::after{content:"";position:absolute;left:12%;right:8%;bottom:1%;height:4%;border-radius:50%;background:rgba(0,0,0,.2);z-index:-1}
@keyframes call-old{0%{opacity:0;transform:translateY(14px) scale(.6) rotate(-8deg)}14%{opacity:1;transform:translateY(0) scale(1) rotate(0)}78%{opacity:1;transform:translateY(-6px)}100%{opacity:0;transform:translateY(-16px)}}

/* Overlays */
.hud{position:absolute;left:10px;top:10px;display:flex;gap:6px;flex-wrap:wrap;z-index:8}
.hud span{background:rgba(20,30,25,.78);color:#fff;font-size:13px;font-weight:700;padding:5px 10px;border-radius:3px}
.hud .final{background:#9c3d33}
.togo{position:absolute;right:10px;top:10px;z-index:8;background:rgba(20,30,25,.78);color:#9fe39a;font-family:var(--tb-display);font-weight:600;font-size:15px;padding:5px 12px;border-radius:3px}
.die{position:absolute;right:14px;top:64px;z-index:8;width:58px;height:58px;border-radius:12px;background:#fffdf8;display:grid;place-items:center;font-family:var(--tb-display);font-weight:600;font-size:30px;color:#33332b;box-shadow:0 4px 0 #c9c1ad,0 6px 14px rgba(0,0,0,.3);opacity:0;transform:scale(.4);transition:opacity .2s,transform .3s}
.die.show{opacity:1;transform:none}
.die.fast{box-shadow:0 4px 0 #8c2b1b,0 0 0 4px #cc4a32,0 0 22px 6px rgba(204,74,50,.7)}
.die.even{box-shadow:0 4px 0 #a5711e,0 0 0 4px #e6ab4a,0 0 22px 6px rgba(230,171,74,.7)}
.die.slow{box-shadow:0 4px 0 #3a6477,0 0 0 4px #6491a8,0 0 22px 6px rgba(100,145,168,.7)}
.dietag{position:absolute;right:8px;top:136px;z-index:8;width:72px;text-align:center;font-family:var(--tb-display);font-weight:600;font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:#fff;padding:4px 0;border-radius:3px;opacity:0;transform:translateY(-6px);transition:opacity .25s,transform .25s}
.dietag.show{opacity:1;transform:none}
.dietag.fast{background:#cc4a32}.dietag.even{background:#c48a2c}.dietag.slow{background:#4f7f97}
.die.tumble{animation:tumble .12s ease-in-out infinite alternate}
@keyframes tumble{from{transform:rotate(-14deg) scale(.94)}to{transform:rotate(12deg) scale(1.05)}}
.flash{position:absolute;left:50%;top:auto;bottom:62px;transform:translate(-50%,-50%) scale(.8);z-index:9;background:rgba(20,30,25,.85);color:#f3d48c;font-family:var(--tb-display);font-weight:600;font-size:30px;letter-spacing:.14em;text-transform:uppercase;padding:12px 26px;border-radius:4px;opacity:0;pointer-events:none;white-space:nowrap}
.flash.show{animation:flash 1.8s ease forwards}
@keyframes flash{0%{opacity:0;transform:translate(-50%,-50%) scale(.8)}15%{opacity:1;transform:translate(-50%,-50%) scale(1)}80%{opacity:1}100%{opacity:0}}
.progress{position:absolute;left:10px;right:10px;top:46px;height:6px;border-radius:3px;background:rgba(255,255,255,.35);z-index:8}
.progress i{position:absolute;top:50%;width:11px;height:11px;margin:-5.5px 0 0 -5.5px;border-radius:50%;border:1.5px solid #fff;box-shadow:0 1px 2px rgba(0,0,0,.4)}
.progress em{position:absolute;top:-4px;width:2px;height:14px;background:#fff}

/* The running order, over the empty turf on the left once the field has gone past */
.order{position:absolute;left:10px;top:64px;z-index:8;width:230px;background:rgba(20,30,25,.55);border-radius:4px;padding:4px 0;opacity:0;transform:translateX(-12px);transition:opacity .6s,transform .6s;pointer-events:none;backdrop-filter:blur(2px)}
.order.on{opacity:1;transform:none}
.orow{position:absolute;left:0;right:0;height:26px;display:grid;grid-template-columns:30px 18px 1fr auto;gap:6px;align-items:center;padding:0 8px;color:#fff;font-size:12.5px;font-weight:700;transition:top .9s cubic-bezier(.4,0,.2,1)}
.orow .pos{font-family:var(--tb-display);font-weight:600;color:#f3d48c;text-align:right}
.orow svg{width:16px;height:19px}
.orow .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.orow .kdot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:1px;box-shadow:0 0 0 1.5px rgba(255,255,255,.75)}
.orow .gap{font-size:11px;font-weight:600;color:rgba(255,255,255,.7)}
.orow.home .gap{color:#9fe39a}
/* Thoroughbred 15: no dice or card graphics; mark the player's horse */
.die,.dietag,.orow .call,#hudRound{display:none!important}
.metag{position:absolute;left:62%;top:-16px;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:0;pointer-events:none}
.metag b{background:#b79042;color:#2a210b;font-family:var(--tb-display);font-weight:600;font-size:15px;letter-spacing:.14em;padding:3px 10px;border-radius:3px;box-shadow:0 2px 6px rgba(0,0,0,.35);white-space:nowrap}
.metag i{width:0;height:0;border-left:9px solid transparent;border-right:9px solid transparent;border-top:12px solid #b79042;animation:mebob 1s ease-in-out infinite alternate}
@keyframes mebob{to{transform:translateY(4px)}}
.orow.mine{background:rgba(183,144,66,.55)}
.progress i.mine{width:15px;height:15px;margin:-7.5px 0 0 -7.5px;border:2.5px solid #f3d48c;z-index:2}
/* the card a horse plays pops out beside its name */
.orow .call{position:absolute;left:100%;top:50%;margin:-26px 0 0 8px;width:36px;height:50px;border-radius:5px;background:#f8f7f2;box-shadow:0 3px 8px rgba(0,0,0,.35);display:flex;flex-direction:column;align-items:center;justify-content:space-between;overflow:hidden;opacity:0;transform-origin:0 50%}
.orow .call i{width:100%;background:var(--cc,#b79042);color:#fff;font-style:normal;font-size:7px;font-weight:800;letter-spacing:.06em;text-align:center;padding:2px 0}
.orow .call b{font-family:var(--tb-display);font-weight:600;font-size:20px;color:#333;line-height:1;margin-bottom:8px}
.orow .call.p{--cc:#b79042}.orow .call.s{--cc:#9c3d33}
.orow .call.g{width:auto;height:auto;margin-top:-10px;background:#6f9a5e;color:#fff;font-size:11px;font-weight:800;padding:3px 8px;border-radius:3px;white-space:nowrap}
.orow .call.show{animation:call 2.6s cubic-bezier(.2,.8,.3,1) forwards}
@keyframes call{0%{opacity:0;transform:translateX(-10px) scale(.5) rotate(-8deg)}14%{opacity:1;transform:none}80%{opacity:1;transform:none}100%{opacity:0;transform:translateX(6px)}}
/* Pause and skip, small, bottom right of the picture */
.sctl{position:absolute;right:10px;bottom:42px;z-index:9;display:flex;gap:6px}
.sctl button{border:none;background:rgba(20,30,25,.7);color:#fff;font-size:13px;font-weight:700;padding:6px 11px;border-radius:3px}
.sctl button:hover{background:rgba(20,30,25,.9)}
/* Before the off: the race card */
.intro{position:absolute;inset:0;z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:12px;background:radial-gradient(120% 90% at 50% 0%,rgba(90,138,127,.9),rgba(44,74,67,.94) 72%);transition:opacity .5s}
.intro.gone{opacity:0;pointer-events:none}
.intro .rd-kicker{font-family:var(--tb-display);font-size:13px;letter-spacing:.34em;text-transform:uppercase;color:#f2eee7;opacity:.85}
.intro .rcard{width:min(440px,100%)}
.intro .rc-paper{padding:18px 22px 16px}
.intro .rc-name{font-size:34px;margin-bottom:10px}
.intro .rc-rule{margin:12px 0 10px}
.intro .go{background:var(--tb-gold);color:#2a210b;font-size:17px;padding:12px 28px}
.intro .go:hover{background:#c9a052}
.intro .wait{max-width:520px;margin:0;text-align:center;color:#f2eee7;font-size:17px;font-weight:700;line-height:1.5}
.intro .wait small{display:block;margin-top:8px;font-size:14px;font-weight:400;opacity:.85}
.rcard .rv{opacity:1}
.rcard.reveal .rv{animation:rd-rise .55s ease both;animation-delay:var(--d,0ms)}
.sim-result{position:fixed;inset:0;z-index:40;background:rgba(30,40,35,.6);display:flex;align-items:flex-start;justify-content:center;padding:30px 12px;overflow:auto}
.sim-result .tb-panel{max-width:620px;width:100%}
.sim-pod{display:grid;grid-template-columns:1fr 1.15fr 1fr;align-items:end;gap:8px;margin:12px 0}
.sim-pod div{display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center;font-weight:700;font-size:14px}
.sim-pod svg{width:40px;height:48px}
.sim-pod .who{font-weight:400;font-size:12px;line-height:1.35;color:var(--tb-muted)}
.sim-pod .who b{font-weight:700;color:var(--tb-ink)}
.sim-pod i{display:block;width:100%;background:var(--tb-green);color:#fff;font-style:normal;font-family:var(--tb-display);font-size:24px;border-radius:3px 3px 0 0;padding-top:6px}
.sim-order{font-size:14px;line-height:1.6;margin:0;padding-left:22px}
.sim-btns{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end;margin-top:14px}
.sim-btns .tb-btn{font-size:15px;padding:10px 16px}
:root{
  --rd-serif:"Crimson Pro",Georgia,"Times New Roman",serif;
  --rc-frame:#2f3833; --rc-mat:#f5ebc9; --rc-paper:#fffefa; --rc-label:#9a8866; --rc-rule:#e5ddc9;
  --rc-seg:#ece6d8; --rc-seg-on:#3d7153; --rc-seg-band:#c3d8ca;
}
.t-gold{--m1:#8a6420;--m2:#e8c770;--m3:#fff3c4;--m4:#c99a3c;--m5:#f5dc8e;--m6:#9c7426;--mink:#4a3508;--mglow:rgba(214,170,70,.5)}
.t-silver{--m1:#5f656b;--m2:#d4d8dc;--m3:#ffffff;--m4:#9aa0a6;--m5:#eceef0;--m6:#767c82;--mink:#2b3035;--mglow:rgba(200,206,212,.55)}
.t-bronze{--m1:#5e3818;--m2:#cf955f;--m3:#ffe1c4;--m4:#a2663a;--m5:#e6b088;--m6:#71441f;--mink:#3a210c;--mglow:rgba(196,128,74,.45)}
.t-green{--m1:#24443a;--m2:#5f9478;--m3:#cfe6d6;--m4:#3d7153;--m5:#8fbca2;--m6:#2c5443;--mink:#f2eee7;--mglow:rgba(61,113,83,.3)}
.metal{background:linear-gradient(135deg,var(--m1) 0%,var(--m2) 20%,var(--m3) 31%,var(--m4) 44%,var(--m5) 60%,var(--m6) 80%,var(--m2) 100%)}
.rd-label{font-family:var(--tb-display);font-weight:600;font-size:13px;letter-spacing:.12em;color:var(--tb-green)}
.rcard .rd-label{font-weight:500;letter-spacing:.1em;color:var(--rc-label)}
@keyframes rd-sweep{0%{background-position:140% 0}55%,100%{background-position:-60% 0}}
.rcard{position:relative;width:min(440px,100%);perspective:1300px}
.rcard-in{position:relative;transform-style:preserve-3d;transition:transform 1s cubic-bezier(.3,.8,.25,1.1)}
.rcard.dealt .rcard-in{animation:rc-deal .6s cubic-bezier(.2,.8,.3,1) backwards}
@keyframes rc-deal{from{transform:translateY(-60px) rotateZ(-5deg) scale(.86);opacity:0}}
.rcard.turned .rcard-in{transform:rotateY(180deg)}
.rc-front,.rc-back{-webkit-backface-visibility:hidden;backface-visibility:hidden}
.rc-front{position:relative;transform:rotateY(180deg);padding:9px;border-radius:6px;box-shadow:0 16px 40px var(--mglow),0 6px 16px rgba(0,0,0,.3);visibility:hidden;transition:visibility 0s .45s}
.rcard.turned .rc-front{visibility:visible}
.rc-back{position:absolute;inset:0;border-radius:6px;display:grid;place-items:center;box-shadow:0 16px 36px rgba(0,0,0,.35);transition:visibility 0s .45s}
.rcard.turned .rc-back{visibility:hidden}
.rc-back::before{content:"";position:absolute;inset:12px;border:1.5px solid rgba(255,255,255,.55);border-radius:4px}
.rc-back::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(45deg,rgba(255,255,255,.08) 0 7px,transparent 7px 14px)}
.rc-backin{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;gap:12px;color:var(--mink);text-align:center}
.rc-backin img,.rc-backin svg{width:150px;height:auto}
.rc-word{font-family:var(--rd-serif);font-weight:600;font-size:24px;letter-spacing:.24em}
.rc-backclass{font-family:var(--rd-serif);font-weight:700;font-size:30px}
.rc-mat{background:var(--rc-mat);padding:9px;border-radius:2px}
.rc-paper{position:relative;overflow:hidden;background:var(--rc-paper);padding:26px 26px 22px;text-align:center}
.rc-paper::before{content:"";position:absolute;left:0;right:0;top:0;height:120px;opacity:.5;pointer-events:none;
  background:linear-gradient(45deg,transparent 46%,#efe9da 46% 54%,transparent 54%),linear-gradient(-45deg,transparent 46%,#efe9da 46% 54%,transparent 54%);background-size:26px 26px;
  -webkit-mask-image:linear-gradient(#000,transparent);mask-image:linear-gradient(#000,transparent)}
.rc-paper > *{position:relative}
.rc-course{font-family:var(--rd-serif);font-weight:500;font-size:24px;letter-spacing:.06em;text-transform:uppercase;color:#2f3833}
.rc-year{font-family:var(--rd-serif);font-weight:700;font-size:21px;letter-spacing:.2em;color:var(--tb-ink);margin:2px 0 2px}
.rc-name{font-family:var(--rd-serif);font-weight:700;font-size:38px;line-height:1.05;color:var(--tb-ink);margin:0 0 14px}
.rc-facts{display:grid;grid-template-columns:repeat(3,1fr)}
.rc-facts > div + div{border-left:1px solid var(--rc-rule)}
.rc-facts b{display:block;font-family:var(--rd-serif);font-weight:700;font-size:25px;color:var(--tb-ink);margin-top:2px}
.rc-rule{height:1px;background:var(--rc-rule);margin:18px 0 14px}
.rc-prizes{display:grid;grid-template-columns:repeat(4,1fr)}
.rc-prizes b{display:block;font-family:var(--rd-serif);font-weight:700;font-size:17px;color:var(--tb-ink);margin-top:2px}
.rc-prizes div:first-child b{color:var(--tb-green)}
.rcard.reveal .rv{animation:rd-rise .55s ease both;animation-delay:var(--d,0ms)}
@keyframes rd-rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.rc-sheen{position:absolute;inset:0;pointer-events:none;border-radius:6px;background:linear-gradient(110deg,transparent 35%,rgba(255,255,255,.8) 48%,rgba(255,240,190,.45) 52%,transparent 65%);background-size:260% 100%;background-position:140% 0;mix-blend-mode:screen;z-index:3}
.rcard.burst .rc-sheen{animation:rd-sweep 1.2s ease-out forwards}
.rcard.shiny.burst .rc-sheen{animation:rd-sweep 1.2s ease-out forwards,rd-sweep 4.2s 2.5s ease-in-out infinite}
.rc-sparks{position:absolute;inset:-20px;pointer-events:none;z-index:4}
.rc-sparks i{position:absolute;width:15px;height:15px;opacity:0;background:var(--m3);clip-path:polygon(50% 0,62% 38%,100% 50%,62% 62%,50% 100%,38% 62%,0 50%,38% 38%);filter:drop-shadow(0 0 4px var(--m2))}
.rcard.burst .rc-sparks i{animation:rc-spark .95s ease-out both;animation-delay:var(--d)}
@keyframes rc-spark{0%{opacity:0;transform:scale(.2)}30%{opacity:1}100%{opacity:0;transform:translate(var(--tx),var(--ty)) scale(1.1) rotate(90deg)}}

@media (max-width:600px){
  .scene{height:340px;--sq:69px;--hw:96px;--rail:126px;--adh:18px}

  .intro .rc-paper{padding:10px 10px 9px}
  .intro .rc-course{font-size:15px}.intro .rc-name{font-size:22px;margin-bottom:6px}
  .intro .rc-facts b{font-size:15px}.intro .rc-prizes b{font-size:13px}.intro .rd-label{font-size:10px}
  .intro .rc-rule{margin:7px 0 6px}
  .intro .go{font-size:14px;padding:8px 18px}

  .hud span,.togo{font-size:11px;padding:3px 7px}

  .flash{font-size:15px;padding:6px 12px;bottom:56px}
  .progress{top:34px}.nearrail{height:24px}

// w×h picture of rows of people; cheer = which half of the crowd has its arms up and is jumping
function crowd(w, h, size, rows, cheer, seed, backs) {
  const c = document.createElement("canvas"), ratio = 2;
  c.width = w * ratio; c.height = h * ratio;
  const g = c.getContext("2d"); g.scale(ratio, ratio);
  const rnd = seeded(seed);
  for (let r = 0; r < rows; r++) {
    const s = size * (.8 + .2 * r / Math.max(1, rows - 1)), base = h - (rows - 1 - r) * s * .62 + s * .15;
    for (let x = -s * .3 + rnd() * s * .4; x < w + s * .3; x += s * (.5 + rnd() * .22)) {
      const shirt = CLOTHES[Math.floor(rnd() * CLOTHES.length)], skin = SKIN[Math.floor(rnd() * SKIN.length)], hair = HAIR[Math.floor(rnd() * HAIR.length)];
      const hat = rnd() < .14, up = (rnd() < .5) === !!cheer && cheer !== null, jump = up ? -s * .1 : 0, y = base + jump;
      g.fillStyle = shirt;
      if (up) { g.strokeStyle = shirt; g.lineWidth = s * .12; g.lineCap = "round"; g.beginPath(); g.moveTo(x - s * .2, y - s * .62); g.lineTo(x - s * .32, y - s * 1.15); g.moveTo(x + s * .2, y - s * .62); g.lineTo(x + s * .3, y - s * 1.12); g.stroke(); }
      g.beginPath(); g.ellipse(x, y - s * .25, s * .27, s * .42, 0, 0, Math.PI * 2); g.fill();
      g.fillStyle = backs ? hair : skin; g.beginPath(); g.arc(x, y - s * .8, s * .16, 0, Math.PI * 2); g.fill();
      if (!backs) { g.fillStyle = hair; g.beginPath(); g.arc(x, y - s * .84, s * .16, Math.PI, 0); g.fill(); }
      if (hat) { g.fillStyle = rnd() < .5 ? "#d9c08a" : "#33332b"; g.fillRect(x - s * .26, y - s * .93, s * .52, s * .05); g.fillRect(x - s * .14, y - s * 1.06, s * .28, s * .14); }
    }
  }

    o.innerHTML = R.field.map((h, i) => `<div class="orow ${h.mine ? "mine" : ""}" id="or${i}"><span class="pos"></span>${jerseyOf(h)}<span class="nm"><i class="kdot" style="background:var(--k-${h.cls})" title="${CLS_NAME[h.cls]} class"></i>${esc(h.name)}</span><span class="gap"></span><span class="call"></span></div>`).join("");
    o.style.height = Math.ceil(R.field.length / (innerWidth > 600 ? 2 : 1)) * rh + 4 + "px";
  }
  done.map(h => ({ h, gap: "home" })).concat(rest.map((v, i) => ({ h: v.h, gap: i === 0 || Math.round(top - v.x) === 0 ? "" : "-" + Math.round(top - v.x) }))).forEach((v, k) => {
    const row = $("#or" + R.field.indexOf(v.h));
    const cols = innerWidth > 600 ? 2 : 1, per = Math.ceil(R.field.length / cols);
    row.style.top = 2 + (k % per) * rh + "px"; row.style.left = (Math.floor(k / per) * 50) + "%"; row.classList.toggle("home", v.gap === "home");
    row.querySelector(".pos").textContent = ord(k + 1); row.querySelector(".gap").textContent = v.gap === "home" ? "✓" : v.gap;
  });
}
function result() {
  $("#sctl").hidden = true;
  send("finished", { order: R.finish.map(h => h.id || h.name) });
  const o = R.finish;
  const who = h => [h.jockey ? `Jockey <b>${esc(h.jockey)}</b>` : "", h.trainer ? `Trainer <b>${esc(h.trainer)}</b>` : "", h.owner ? `Owner <b>${esc(h.owner)}</b>` : ""].filter(Boolean).join("<br>");
  const pod = i => o[i] ? `<div>${jerseyOf(o[i])}${esc(o[i].name)}<span class="who">${who(o[i])}</span><small>£${R.race.prizes[i].toLocaleString("en-GB")}</small><i style="height:${[96, 70, 50][i]}px">${i + 1}</i></div>` : "<div></div>";
  $("#result").innerHTML = `<div class="tb-panel"><h2 class="tb-h2" style="margin:0">${esc(R.race.name)} · result</h2>
    <div class="sim-pod">${pod(1)}${pod(0)}${pod(2)}</div>
    <ol class="sim-order">${o.map(h => `<li>${esc(h.name)} <small style="color:var(--tb-muted)">(${[h.jockey, h.trainer].filter(Boolean).map(esc).join(" · ") || CLS_NAME[h.cls] + " class"})</small></li>`).join("")}</ol>
    <div class="sim-btns"><button class="tb-btn ghost" id="closeRes">Watch the finish again</button>${DEMO ? `<button class="tb-btn ghost" id="backRes">Back to the races</button><button class="tb-btn" id="nextBtn">Next race ›</button>` : `<button class="tb-btn" id="backRes">Result and prize money ›</button>`}</div></div>`;
  $("#result").hidden = false;
}

/* ---------- Wiring ---------- */
const DEMO = window.parent === window;
function send(type, extra) { if (!DEMO) window.parent.postMessage({ type, ...(extra || {}) }, "*"); }
document.addEventListener("click", e => {
  const t = e.target.closest("button"); if (!t) return;
  if (t.id === "goBtn") { $("#intro").classList.add("gone"); playing = true; lastNow = 0; $("#sctl").hidden = false; flash("They're off!"); raf = requestAnimationFrame(t2 => frame(t2)); return; }
  if (t.id === "sampleBtn") { GIVEN = null; setup(); return; }
  if (t.id === "pauseBtn") { paused = !paused; t.textContent = paused ? "Carry on" : "Pause"; $("#scene").classList.toggle("paused", paused); return; }
  if (t.id === "skipBtn") { T = Math.max(T, R.rounds - 1.6); return; }
  if (t.id === "backBtn" || t.id === "backRes") {
    if (DEMO) { toast("In Wix this goes back to the races page"); return; }
    if (R && R.finish) send("finished", { order: R.finish.map(h => h.id || h.name) });   // in case the first one was missed
    send("back");
    if (t.id === "backRes") { t.disabled = true; t.textContent = "Saving the result…"; setTimeout(() => { t.disabled = false; t.textContent = "Try again ›"; }, 9000); }
    return;
  }
  if (t.id === "nextBtn") { if (DEMO) { GIVEN = null; setup(); } else send("next"); return; }
  if (t.id === "closeRes") { $("#result").hidden = true; $("#sctl").hidden = false; T = Math.max(0, R.rounds - 2.2); evIdx = R.events.findIndex(ev => ev.t > T); if (evIdx < 0) evIdx = R.events.length; playing = true; lastNow = 0; raf = requestAnimationFrame(t2 => frame(t2)); return; }
});
// From the Wix page: { type: "race", race: { name, course, type, f, prizes }, field: [{ id, name, ability, a, b, suits }], pace, going, kicker }
// The two main colours of a silks picture (jacket first), for the jockey's jacket, sleeves and cap
const SPARE = [["#1f4fa8", "#ffffff"], ["#e33b2e", "#ffffff"], ["#efe24a", "#2b2b2b"], ["#2a7a4a", "#f2e04a"], ["#6b2c75", "#ffffff"], ["#ea9fc4", "#3fc3a2"], ["#222222", "#e33b2e"], ["#f08a24", "#1f3a6b"]];
function silksColours(url) {
  return new Promise(ok => {
    if (!url) return ok(null);
    const im = new Image(); im.crossOrigin = "anonymous";
    const t = setTimeout(() => ok(null), 4000);
    im.onerror = () => { clearTimeout(t); ok(null); };
    im.onload = () => {
      clearTimeout(t);
      try {
        const c = document.createElement("canvas"); c.width = 40; c.height = 48;
        const g = c.getContext("2d"); g.drawImage(im, 0, 0, 40, 48);
        const d = g.getImageData(0, 0, 40, 48).data, count = {};
        for (let i = 0; i < d.length; i += 4) {
          if (d[i + 3] < 200) continue;
          const k = [d[i], d[i + 1], d[i + 2]].map(v => Math.min(255, Math.round(v / 24) * 24)).join(",");
          count[k] = (count[k] || 0) + 1;
        }
        const list = Object.entries(count).sort((a, b) => b[1] - a[1]).map(([k]) => k.split(",").map(Number));
        if (!list.length) return ok(null);
        const hex = c3 => "#" + c3.map(v => v.toString(16).padStart(2, "0")).join("");
        const far = (x, y) => Math.abs(x[0] - y[0]) + Math.abs(x[1] - y[1]) + Math.abs(x[2] - y[2]) > 90;
        const a = list[0], b = list.find(x => far(x, a)) || (a[0] + a[1] + a[2] > 380 ? [40, 40, 40] : [245, 245, 245]);
        ok([hex(a), hex(b)]);
      } catch (e) { ok(null); }   // the picture's server didn't allow reading it
    };
    im.src = url;
  });
}
async function takeRace(d) {
  const field = await Promise.all((d.field || []).map(async (h, i) => {
    if (h.a && h.b) return h;
    const c = await silksColours(h.silks) || SPARE[i % SPARE.length];
    return { ...h, a: c[0], b: c[1] };
  }));
  GIVEN = { ...d, field: field.length ? field : null };
  setup();
}
addEventListener("message", e => { const d = e.data || {}; if (d.type === "race") takeRace(d); });
addEventListener("resize", () => { if (!R) return; CROWD = null; build(); frame(performance.now(), true); });
if (DEMO) setup();
else {
  $("#pinChip").hidden = true;
  send("ready"); const ping = setInterval(() => { if (GIVEN) clearInterval(ping); else send("ready"); }, 600);
  // Nothing from the Wix page: say so, rather than an empty picture
  setTimeout(() => {
    if (GIVEN || R) return;
    $("#intro").innerHTML = `<div class="rd-kicker">Race simulation</div>
      <p class="wait">Waiting for the race from the race page…<br><small>Open this page with the race page's <b>Let the app run the race</b> button. If you did, the page's code isn't answering: check the page's code file (Race Simulation.hfnq1.js) is on GitHub and its HTML element's ID is <b>simHtml</b>.</small></p>
      <button class="tb-btn go" id="sampleBtn">Watch a sample race ›</button>`;
  }, 3000);
}
</script>
