<meta charset="utf-8">
<title>Thoroughbred Newmarket</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500;1,600&display=swap" rel="stylesheet">
<style>
/* One painted world, one look in every theme: a dark leather header, the board filling the rest,
   brass medallions on the places, a claret card when you pick one. */
:root{
  color-scheme:light;
  --leather:#1d1912; --leather-2:#2a241a; --brass:#c6a15a; --brass-hi:#ecd497; --parch:#f4e8c9; --parch-2:#e8d7ae;
  --ink:#2c2418; --ink-soft:#5a4c36; --claret:#7b1e2b; --claret-hi:#a02c3b; --board:#d9cfa9;
  --display:"Cinzel","Trajan Pro",Georgia,serif; --serif:"Cormorant Garamond","Iowan Old Style",Georgia,serif;
  --bar-h:58px;
}
html,body{height:100%;margin:0;overflow:hidden;background:var(--leather);color:var(--ink);font-family:var(--serif);-webkit-font-smoothing:antialiased}
button{font:inherit;cursor:pointer;color:inherit}
button:focus-visible{outline:2px solid var(--brass-hi);outline-offset:3px}

/* the header: game name and the stable's standing */
.bar{position:fixed;inset:0 0 auto;height:var(--bar-h);padding-top:env(safe-area-inset-top,0px);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;align-items:center;gap:22px;background:linear-gradient(var(--leather-2),var(--leather));border-bottom:1px solid #4a3d26;box-shadow:0 2px 0 #0e0c08,0 6px 18px rgba(0,0,0,.45);z-index:20;color:var(--parch)}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.brand .mark{width:46px;height:30px;background:var(--brass);-webkit-mask:var(--horse) center/contain no-repeat;mask:var(--horse) center/contain no-repeat;flex:none}
.brand b{display:block;font-family:var(--display);font-weight:700;font-size:23px;letter-spacing:.08em;line-height:1;color:var(--brass-hi)}
.brand i{display:block;font-size:16px;line-height:1.1;color:var(--parch-2);text-align:center;letter-spacing:.04em}
.stats{display:flex;gap:0;margin-left:auto;font-size:17px;white-space:nowrap}
.stats > span{padding:0 18px;border-left:1px solid #4a3d26;display:flex;align-items:center;gap:8px}
.stats svg{width:18px;height:18px;color:var(--brass);flex:none}
.stats em{font-style:normal;color:var(--brass-hi);font-variant-numeric:tabular-nums}

/* the board */
.view{position:fixed;inset:var(--bar-h) 0 0;overflow:hidden;background:var(--leather);display:flex}
.view.pan{overflow-x:auto;overflow-y:hidden;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.view.pan::-webkit-scrollbar{display:none}
.holder{position:relative;flex:none;margin:auto}   /* auto margins centre it, and never push it out of scroll reach */
.stage{position:absolute;left:0;top:0;width:1200px;height:900px;transform-origin:0 0;box-shadow:0 0 0 1px #4a3d26,0 10px 40px rgba(0,0,0,.6)}
.stage > img{position:absolute;inset:0;width:1200px;height:900px;display:block;max-width:none;user-select:none;-webkit-user-drag:none}
#life,#clouds,#glow{position:absolute;inset:0;width:1200px;height:900px;pointer-events:none}
#life{filter:saturate(.85) sepia(.1)}
#clouds{mix-blend-mode:multiply;opacity:.9}
#glow .zone{opacity:0;transition:opacity .35s}
#glow .zone.on{opacity:1}

/* the places: a brass medallion over a parchment label, pulsing softly */
.loc{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;border:0;background:none;padding:0;z-index:2}
.loc .medal{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;margin-bottom:-6px;position:relative;z-index:1;
  background:radial-gradient(circle at 50% 35%,#4a3a26,#231b11 70%);border:2px solid var(--brass);box-shadow:0 0 0 2px #2a2016,0 3px 8px rgba(0,0,0,.45)}
.loc .medal svg{width:27px;height:27px;color:var(--brass-hi)}
.loc .medal .jc{font-family:var(--display);font-weight:700;font-size:17px;color:var(--brass-hi);letter-spacing:-.04em}
.loc .medal .hz{width:32px;height:22px;background:var(--brass-hi);-webkit-mask:var(--horse) center/contain no-repeat;mask:var(--horse) center/contain no-repeat}
.loc .pill{position:relative;z-index:1;font-family:var(--display);font-weight:700;font-size:14.5px;letter-spacing:.05em;line-height:1.15;text-align:center;color:var(--ink);
  padding:8px 15px 7px;border-radius:7px;background:linear-gradient(var(--parch),var(--parch-2));border:1.5px solid var(--brass);box-shadow:0 0 0 1.5px #3a2e1c,0 4px 10px rgba(0,0,0,.4);white-space:nowrap}
.loc .ring{position:absolute;left:50%;top:100%;width:90px;height:22px;margin:-8px 0 0 -45px;border-radius:50%;border:2px solid rgba(236,212,151,.75);opacity:0;pointer-events:none}
.loc:hover .pill,.loc.on .pill{background:linear-gradient(var(--claret-hi),var(--claret));color:#fbefd3;border-color:var(--brass-hi)}
.loc:hover .medal,.loc.on .medal{border-color:var(--brass-hi);box-shadow:0 0 0 2px #2a2016,0 0 16px rgba(236,212,151,.8)}
@media (prefers-reduced-motion:no-preference){
  .loc .ring{animation:ripple 3.2s ease-out infinite}
  .loc:nth-of-type(2n) .ring{animation-delay:1.1s} .loc:nth-of-type(3n) .ring{animation-delay:2.1s}
}
@keyframes ripple{0%{transform:scale(.55);opacity:.85}100%{transform:scale(1.5);opacity:0}}

/* the card for the chosen place */
.card{position:fixed;right:max(18px,env(safe-area-inset-right,0px));top:calc(var(--bar-h) + 18px);width:330px;z-index:15;padding:16px 16px 18px;border-radius:10px;
  background:linear-gradient(#f8eed4,#efe0ba);border:2px solid var(--brass);box-shadow:0 0 0 3px #3a2e1c,0 14px 40px rgba(0,0,0,.55);transform-origin:80% 0;transition:opacity .25s,transform .25s}
.card[hidden]{display:block!important;opacity:0;transform:scale(.92) translateY(-6px);pointer-events:none}
.card header{display:flex;align-items:center;gap:10px}
.card h2{margin:0;font-family:var(--serif);font-style:italic;font-weight:600;font-size:34px;line-height:1;color:var(--claret);text-wrap:balance;flex:1}
.card .x{width:34px;height:34px;border-radius:50%;border:1.5px solid var(--brass);background:var(--parch);font-size:20px;line-height:1;color:var(--ink);display:grid;place-items:center;flex:none}
.card .pic{margin-top:12px;height:170px;border-radius:6px;border:1.5px solid #8a7146;box-shadow:inset 0 0 30px rgba(40,25,10,.45);background:url(assets/newmarket-board.webp) no-repeat;background-color:var(--board)}
.card p{margin:12px 2px 14px;font-style:italic;font-size:19px;line-height:1.3;color:var(--ink-soft);text-align:center}
.card .go{width:100%;display:flex;align-items:center;justify-content:center;gap:12px;padding:12px 16px;border-radius:30px;border:2px solid var(--brass);
  background:linear-gradient(var(--claret-hi),var(--claret));color:#fbefd3;font-family:var(--serif);font-weight:600;font-size:24px;box-shadow:0 0 0 2px #3a1810,0 6px 14px rgba(60,10,15,.45)}
.card .go:hover{filter:brightness(1.1)}
.card .go svg{width:14px;height:14px;fill:currentColor}
.card .soon{margin:10px 0 0;font-size:15px;font-style:normal;color:var(--ink-soft)}

.hint{position:fixed;left:max(18px,env(safe-area-inset-left,0px));bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:10;display:flex;align-items:center;gap:12px;padding:10px 18px 10px 14px;border-radius:12px;
  background:rgba(29,25,18,.9);border:1.5px solid var(--brass);color:var(--parch);box-shadow:0 6px 18px rgba(0,0,0,.45);pointer-events:none}
.hint svg{width:22px;height:30px;fill:none;stroke:var(--brass-hi);stroke-width:1.6}
.hint b{display:block;font-style:italic;font-weight:600;font-size:21px;line-height:1.1}
.hint small{display:block;font-family:var(--display);font-size:10.5px;letter-spacing:.14em;color:var(--brass);margin-top:2px}
.credit{position:fixed;right:max(10px,env(safe-area-inset-right,0px));bottom:calc(6px + env(safe-area-inset-bottom,0px));z-index:10;font-size:11px;color:rgba(244,232,201,.55);font-family:system-ui,sans-serif}

@media (max-width:980px){ .stats > span:not(.funds){display:none} }
@media (max-width:640px){
  :root{--bar-h:52px}
  .bar{gap:10px} .brand{gap:8px} .brand .mark{width:36px;height:24px} .brand b{font-size:16px} .brand i{font-size:13px}
  .stats{font-size:15px} .stats > span{padding:0 0 0 10px} .stats .funds .lbl{display:none}
  .card{left:max(12px,env(safe-area-inset-left,0px));right:max(12px,env(safe-area-inset-right,0px));top:auto;bottom:calc(12px + env(safe-area-inset-bottom,0px));width:auto;transform-origin:50% 100%}
  .card .pic{height:130px} .card h2{font-size:29px}
  .hint{display:none}
}
</style>

<header class="bar">
  <div class="brand"><span class="mark" aria-hidden="true"></span><div><b>THOROUGHBRED</b><i>Newmarket</i></div></div>
  <div class="stats" aria-label="Your stable (example figures)">
    <span><svg viewBox="0 0 512 512" aria-hidden="true">%%ICON:wheat%%</svg>Season: <em>Spring</em></span>
    <span><svg viewBox="0 0 512 512" aria-hidden="true">%%ICON:calendar%%</svg>Year: <em>2026</em></span>
    <span><svg viewBox="0 0 512 512" aria-hidden="true">%%ICON:barn%%</svg>Stable: <em>Riverside Stables</em></span>
    <span class="funds"><svg viewBox="0 0 512 512" aria-hidden="true">%%ICON:two-coins%%</svg><span class="lbl">Funds:</span> <em>£2,750,000</em></span>
  </div>
</header>

<main class="view" id="view">
  <div class="holder" id="holder">
    <div class="stage" id="stage">
      <img src="assets/newmarket-board.webp" alt="The Newmarket board: the town, the gallops, Tattersalls, the stables and the National Stud" width="1200" height="900">
      <canvas id="clouds" width="300" height="225" aria-hidden="true"></canvas>
      <canvas id="life" aria-hidden="true"></canvas>
      <svg id="glow" viewBox="0 0 1200 900" aria-hidden="true">
        <defs>
          <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="9"/></filter>
          <filter id="edge" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="2.2"/></filter>
        </defs>
      </svg>
    </div>
  </div>
</main>

<aside class="card" id="card" hidden aria-live="polite">
  <header><h2 id="cardTitle">Tattersalls</h2><button class="x" id="cardClose" type="button" aria-label="Close">&times;</button></header>
  <div class="pic" id="cardPic" role="img" aria-label=""></div>
  <p id="cardText"></p>
  <button class="go" id="cardGo" type="button"><span id="cardCta">Enter</span><svg viewBox="0 0 10 16" aria-hidden="true"><path d="M1.6 0 0 1.6 6.4 8 0 14.4 1.6 16l8-8z"/></svg></button>
  <p class="soon" id="cardSoon" hidden>This opens in the full game.</p>
</aside>

<div class="hint" aria-hidden="true">
  <svg viewBox="0 0 22 30"><rect x="2" y="2" width="18" height="26" rx="9"/><path d="M11 2v10M2 12h18"/></svg>
  <div><b>Select a destination</b><small>— EXPLORE NEWMARKET —</small></div>
</div>
<div class="credit">Icons: game-icons.net, CC BY 3.0</div>

<script type="importmap">{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js", "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/" } }</script>
<script>document.documentElement.style.setProperty("--horse", "url(\"%%HORSE%%\")");</script>
<script type="module">
import * as THREE from "three";
import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";
import * as SkeletonUtils from "three/addons/utils/SkeletonUtils.js";

const REDUCED = matchMedia("(prefers-reduced-motion: reduce)").matches;
const MW = 1200, MH = 900;                                         // the board, in its own pixels; everything below is in these

// ---------------------------------------------------------------- the places
const ICONS = { gavel: `%%ICON:gavel%%`, temple: `%%ICON:greek-temple%%`, stable: `%%ICON:stable%%`, head: `%%ICON:horse-head%%` };
const PLACES = [
  { id: "warren", name: "Warren Hill<br>Gallops", at: [135, 404], icon: "horse", title: "Warren Hill", cta: "Go to the Gallops",
    text: "Work your string up the famous hill gallops.", pic: [150, 340, 300],
    zone: [[6, 262], [150, 250], [300, 338], [302, 470], [160, 505], [6, 505]] },
  { id: "palace", name: "Palace House", at: [360, 559], icon: "temple", title: "Palace House", cta: "Visit Palace House",
    text: "The National Horseracing Museum: your trophies and racing history.", pic: [362, 505, 190], zone: ellipse(365, 515, 74, 56) },
  { id: "jockey", name: "The Jockey Club", at: [545, 557], icon: "jc", title: "The Jockey Club", cta: "Enter the Rooms",
    text: "Race entries, the fixture list and the rules of racing.", pic: [553, 520, 190], zone: ellipse(556, 538, 82, 64) },
  { id: "tatts", name: "Tattersalls", at: [755, 615], icon: "gavel", title: "Tattersalls", cta: "Enter Auction",
    text: "Historic bloodstock auctions and sales.", pic: [815, 545, 360],
    zone: [[592, 452], [660, 428], [765, 470], [905, 505], [1095, 568], [1098, 640], [1015, 662], [905, 668], [760, 652], [660, 625], [612, 602], [598, 520]] },
  { id: "stables", name: "Stables", at: [797, 747], icon: "stable", title: "Your Stables", cta: "Visit Stables",
    text: "Your string: training, wellbeing and race entries.", pic: [860, 728, 420],
    zone: [[560, 700], [750, 648], [950, 665], [1110, 655], [1188, 700], [1188, 795], [1010, 805], [930, 795], [612, 838], [560, 765]] },
  { id: "stud", name: "National Stud", at: [1113, 407], icon: "head", title: "National Stud", cta: "Visit the Stud",
    text: "Stallions, mares and foals: plan your matings.", pic: [935, 420, 330],
    zone: [[800, 385], [950, 368], [1190, 330], [1192, 505], [1050, 485], [815, 470]] },
];
function ellipse(cx, cy, rx, ry, n = 28) { return Array.from({ length: n }, (_, i) => [cx + rx * Math.cos(i / n * 6.283), cy + ry * Math.sin(i / n * 6.283)]); }

const stage = document.getElementById("stage"), glow = document.getElementById("glow"), card = document.getElementById("card");
const svgNS = "http://www.w3.org/2000/svg";
for (const p of PLACES) {
  const d = "M" + p.zone.map((q) => q.join(",")).join("L") + "Z";
  const g = document.createElementNS(svgNS, "g"); g.setAttribute("class", "zone"); g.id = "zone-" + p.id;
  g.innerHTML = `<path d="${d}" fill="rgba(255,214,130,.30)" filter="url(#soft)"/><path d="${d}" fill="none" stroke="#ffe3a0" stroke-width="5" stroke-linejoin="round" filter="url(#edge)"/><path d="${d}" fill="none" stroke="#fff3d2" stroke-width="1.4" stroke-linejoin="round" opacity=".85"/>`;
  glow.appendChild(g);
  const b = document.createElement("button");
  b.className = "loc"; b.type = "button"; b.dataset.id = p.id; b.style.left = p.at[0] + "px"; b.style.top = (p.at[1] - 14) + "px";
  const icon = p.icon === "jc" ? `<span class="jc">JC</span>` : p.icon === "horse" ? `<span class="hz"></span>` : `<svg viewBox="0 0 512 512">${ICONS[p.icon]}</svg>`;
  b.innerHTML = `<span class="medal">${icon}</span><span class="pill">${p.name}</span><span class="ring"></span>`;
  b.setAttribute("aria-label", p.title);
  b.addEventListener("mouseenter", () => hover(p.id, true)); b.addEventListener("mouseleave", () => hover(p.id, false));
  b.addEventListener("focus", () => hover(p.id, true)); b.addEventListener("blur", () => hover(p.id, false));
  b.addEventListener("click", () => choose(p.id));
  stage.appendChild(b);
}
let chosen = null;
function hover(id, on) { if (id !== chosen) document.getElementById("zone-" + id).classList.toggle("on", on); }
function choose(id) {
  chosen = id;
  for (const p of PLACES) {
    document.getElementById("zone-" + p.id).classList.toggle("on", p.id === id);
    stage.querySelector(`.loc[data-id="${p.id}"]`).classList.toggle("on", p.id === id);
  }
  if (!id) { card.hidden = true; return; }
  const p = PLACES.find((q) => q.id === id);
  document.getElementById("cardTitle").textContent = p.title;
  document.getElementById("cardText").textContent = p.text;
  document.getElementById("cardCta").textContent = p.cta;
  document.getElementById("cardSoon").hidden = true;
  const pic = document.getElementById("cardPic"), w = pic.clientWidth || 296, h = pic.clientHeight || 170, k = w / p.pic[2];
  pic.style.backgroundSize = `${MW * k}px ${MH * k}px`;
  pic.style.backgroundPosition = `${-(p.pic[0] * k - w / 2)}px ${-(p.pic[1] * k - h / 2)}px`;
  pic.setAttribute("aria-label", p.title + " on the board");
  card.hidden = false;
}
document.getElementById("cardClose").addEventListener("click", () => choose(null));
document.getElementById("cardGo").addEventListener("click", () => { document.getElementById("cardSoon").hidden = false; });
addEventListener("keydown", (e) => { if (e.key === "Escape") choose(null); });

// ---------------------------------------------------------------- fit the board to the window
const view = document.getElementById("view"), holder = document.getElementById("holder");
let scale = 1;
function fit() {
  const W = view.clientWidth, H = view.clientHeight;
  const portrait = W / H < 1.05;
  scale = portrait ? H / MH : Math.min(W / MW, H / MH);
  view.classList.toggle("pan", portrait);
  holder.style.width = MW * scale + "px"; holder.style.height = MH * scale + "px";
  stage.style.transform = `scale(${scale})`;
  if (portrait) view.scrollLeft = 760 * scale - W / 2;           // start on Tattersalls and the stables
  if (renderer) { renderer.setPixelRatio(Math.min(scale * devicePixelRatio, 2.5)); renderer.setSize(MW, MH, false); }
  if (chosen) choose(chosen);
}
addEventListener("resize", fit);

// ---------------------------------------------------------------- drifting cloud shadows
const clouds = document.getElementById("clouds"), cx2 = clouds.getContext("2d");
const PUFFS = Array.from({ length: 5 }, (_, i) => ({ x: (i * 0.27 % 1) * 1500 - 150, y: 120 + (i * 0.61 % 1) * 700, r: 160 + (i * 0.37 % 1) * 170 }));
function drawClouds(dt) {
  cx2.clearRect(0, 0, 300, 225);
  for (const c of PUFFS) {
    if (!REDUCED) { c.x += 5 * dt; c.y -= 1.4 * dt; }
    if (c.x - c.r > MW) { c.x = -c.r; c.y = 150 + Math.random() * 650; }
    for (const [ox, oy, f] of [[0, 0, 1], [c.r * .45, -c.r * .12, .7], [-c.r * .4, c.r * .1, .65]]) {
      const x = (c.x + ox) / 4, y = (c.y + oy) / 4, r = c.r * f / 4;
      const g = cx2.createRadialGradient(x, y, 0, x, y, r);
      g.addColorStop(0, "rgba(70,80,60,.16)"); g.addColorStop(1, "rgba(70,80,60,0)");
      cx2.fillStyle = g; cx2.beginPath(); cx2.ellipse(x, y, r * 1.3, r * .75, 0, 0, 6.283); cx2.fill();
    }
  }
}

// ---------------------------------------------------------------- life: horses and horseboxes, drawn in the board's own projection
// world: x = board x, z = board y (both pixels), y = height in pixels. The board is drawn as if from the south with
// heights straight up the page, so a point lands on the board at (x, z - y). Nearer the viewer = further south, higher.
const canvas = document.getElementById("life");
let renderer = null;
const scene = new THREE.Scene();
const cam = new THREE.Camera();
cam.matrixAutoUpdate = false; cam.matrixWorldAutoUpdate = false;
cam.projectionMatrix.set(2 / MW, 0, 0, -1,
                         0, 2 / MH, -2 / MH, 1,
                         0, -0.0016, -0.0016, 0.9,
                         0, 0, 0, 1);
cam.projectionMatrixInverse.copy(cam.projectionMatrix).invert();
scene.add(new THREE.HemisphereLight(0xfff4dc, 0x7d7458, 1.5));
const sun = new THREE.DirectionalLight(0xfff0d0, 1.7); sun.position.set(-0.7, 1.1, -0.5); scene.add(sun);

const shadowTex = (() => { const c = document.createElement("canvas"); c.width = c.height = 64; const g = c.getContext("2d");
  const r = g.createRadialGradient(32, 32, 0, 32, 32, 32); r.addColorStop(0, "rgba(30,26,12,.55)"); r.addColorStop(1, "rgba(30,26,12,0)");
  g.fillStyle = r; g.fillRect(0, 0, 64, 64); return new THREE.CanvasTexture(c); })();
const shadowMat = new THREE.MeshBasicMaterial({ map: shadowTex, transparent: true, depthWrite: false });
const shadowGeo = new THREE.PlaneGeometry(1, 1).rotateX(-Math.PI / 2);
function addShadow(obj, len, wid) { const s = new THREE.Mesh(shadowGeo, shadowMat.clone()); s.scale.set(len, 1, wid); s.renderOrder = -1; scene.add(s); obj.userData.shadow = s; return s; }

// routes along the painted roads and lanes, in board pixels
const P = (pts) => { const c = new THREE.CatmullRomCurve3(pts.map(([x, z]) => new THREE.Vector3(x, 0, z)), false, "centripetal"); c.L = c.getLength(); return c; };
const ROAD = {
  avenue: [[-8, 170], [30, 190], [80, 215], [120, 238], [160, 262], [200, 286], [250, 312], [300, 343], [335, 360]],
  highSt: [[335, 360], [370, 340], [400, 320], [450, 290], [500, 262], [520, 247]],
  shied: [[335, 360], [320, 400], [305, 440], [285, 480], [272, 520], [275, 560], [290, 600], [315, 640], [345, 675], [368, 693]],
  nmktRd: [[368, 693], [350, 730], [330, 770], [300, 810], [250, 845], [200, 862], [130, 880], [80, 892]],
  fordham: [[520, 247], [520, 200], [520, 120], [519, 40], [519, -10]],
  bury: [[520, 247], [560, 222], [605, 199], [652, 173], [702, 143], [752, 109], [802, 75], [852, 42], [905, -8]],

// the morning string: out of the yard, up Kingston Road, down the High Street, out along Station Road and onto Warren Hill
const STRING_WALK = [[735, 742], [690, 726], [640, 706], [598, 690], [572, 662], [548, 622], [488, 610], [430, 622], [440, 590], [460, 545], [480, 500], [500, 440],

const GALLOPS = [[-12, 168], [80, 160], [160, 148], [240, 130], [320, 110], [400, 90], [470, 72]];

const movers = [];
let horseProto = null, silkList = [], maskTex = null, clipsByName = {}, horseScale = 1;
const silkTex = new Map();
const texLoader = new THREE.TextureLoader();
function silkTexture(id) { if (!silkTex.has(id)) { const t = texLoader.load(`assets/silks-3d/${id}.png`); t.flipY = false; t.colorSpace = THREE.SRGBColorSpace; silkTex.set(id, t); } return silkTex.get(id); }
const COATS = [["#6e4026", "#1d1714"], ["#4a2e1c", "#17110d"], ["#9a4f28", "#5f2e14"], ["#2b2523", "#141110"], ["#8f8d88", "#5d5b56"], ["#7a4a2a", "#1d1714"]];
let nHorse = 0;
function makeHorse(silkId) {
  const k = nHorse++, obj = SkeletonUtils.clone(horseProto.scene); obj.scale.setScalar(horseScale);
  const coat = COATS[k % COATS.length], silk = silkList.find((s) => s.id === silkId) || silkList[(k * 7 + 3) % silkList.length];
  const u = { mask: { value: maskTex }, coatCol: { value: new THREE.Color(coat[0]) }, pointsCol: { value: new THREE.Color(coat[1]) }, silkCol: { value: new THREE.Color(silk.colour) } };
  const mats = [];
  obj.traverse((o) => {
    if (!o.isMesh) return; o.frustumCulled = false; o.material = o.material.clone(); o.material.transparent = true; mats.push(o.material);
    if (o.material.name === "silks") { o.material.map = silkTexture(silk.id); return; }
    o.material.onBeforeCompile = (sh) => {
      Object.assign(sh.uniforms, u);
      sh.fragmentShader = sh.fragmentShader.replace("#include <common>", "#include <common>\nuniform sampler2D mask; uniform vec3 coatCol; uniform vec3 pointsCol; uniform vec3 silkCol;")
        .replace("#include <map_fragment>", `#include <map_fragment>
          { vec3 m = texture2D(mask, vMapUv).rgb; float l = dot(diffuseColor.rgb, vec3(0.2126, 0.7152, 0.0722)); diffuseColor.rgb = vec3(l);
            diffuseColor.rgb = mix(diffuseColor.rgb, coatCol * clamp(mix(1.0, l / 0.56, 0.65), 0.3, 1.25), m.r);
            diffuseColor.rgb = mix(diffuseColor.rgb, pointsCol * mix(0.75, 1.2, smoothstep(0.0, 0.035, l)), m.g);
            diffuseColor.rgb = mix(diffuseColor.rgb, silkCol * clamp(mix(1.0, l / 0.72, 0.6), 0.4, 1.15), m.b); }`);

  const mixer = new THREE.AnimationMixer(obj), act = {};
  for (const n of ["walk", "gallop", "ride_quiet", "ride_push"]) { act[n] = mixer.clipAction(clipsByName[n]); act[n].play(); act[n].setEffectiveWeight(0); }
  mixer.setTime(Math.random() * 2);
  scene.add(obj); addShadow(obj, 15, 6);

}
function setGait(h, gait, speed) {
  if (h.gait !== gait) {
    h.gait = gait;
    h.act.walk.setEffectiveWeight(gait === "walk" ? 1 : 0); h.act.gallop.setEffectiveWeight(gait === "gallop" ? 1 : 0);
    h.act.ride_quiet.setEffectiveWeight(gait === "walk" ? 1 : 0); h.act.ride_push.setEffectiveWeight(gait === "gallop" ? 1 : 0);
  }
  const ts = gait === "gallop" ? speed / 55 : speed / 12;
  for (const a of Object.values(h.act)) a.timeScale = THREE.MathUtils.clamp(ts, 0.4, 1.8);
}
const VAN_COLS = [0x3a4a3a, 0x36404e, 0x5a2a2c, 0x2e3a30, 0x463c30, 0x2a3442];
function makeVan(k) {
  const g = new THREE.Group(), col = VAN_COLS[k % VAN_COLS.length];
  const body = new THREE.MeshLambertMaterial({ color: col, transparent: true }), roof = new THREE.MeshLambertMaterial({ color: new THREE.Color(col).lerp(new THREE.Color(0x8a8270), 0.45), transparent: true });
  const dark = new THREE.MeshLambertMaterial({ color: 0x1b1a18, transparent: true }), glass = new THREE.MeshLambertMaterial({ color: 0x9fb2b8, transparent: true });
  const box = new THREE.Mesh(new THREE.BoxGeometry(16, 7.4, 8.6), body); box.position.set(-3.5, 5.6, 0);
  const lid = new THREE.Mesh(new THREE.BoxGeometry(16.4, 0.7, 9), roof); lid.position.set(-3.5, 9.6, 0);
  const cab = new THREE.Mesh(new THREE.BoxGeometry(6, 6.6, 8.2), body); cab.position.set(8.2, 5, 0);
  const win = new THREE.Mesh(new THREE.BoxGeometry(0.6, 2.6, 7.2), glass); win.position.set(11.25, 6.4, 0);
  g.add(box, lid, cab, win);
  for (const [x, z] of [[-8, 4.4], [-8, -4.4], [8, 4.4], [8, -4.4], [-1, 4.4], [-1, -4.4]]) {
    const w = new THREE.Mesh(new THREE.CylinderGeometry(2.1, 2.1, 1.4, 12).rotateX(Math.PI / 2), dark); w.position.set(x, 2.1, z); g.add(w);
  }
  g.scale.setScalar(0.8); scene.add(g); addShadow(g, 24, 10);

}
function place(m, p, dir, alpha) {
  m.obj.position.copy(p);
  if (dir) m.obj.rotation.y = Math.atan2(-dir.z, dir.x);           // the models face +x
  const s = m.obj.userData.shadow; s.position.set(p.x + 2, 0.05, p.z + 1.5); s.rotation.y = m.obj.rotation.y;

// a journey: legs of a route, each at its own pace; it repeats after a rest
function journey(m, legs, { start = 0, rest = 8, fadeIn = true, fadeOut = true } = {}) {
  const ls = legs.map((l) => ({ ...l, dur: l.curve.L / l.speed })), total = ls.reduce((a, l) => a + l.dur, 0);
  movers.push({ m, step(t) {
    let tau = (t - start) % (total + rest); if (tau < 0) tau += total + rest;
    if (tau > total) { place(m, m.obj.position, null, 0); return; }

    for (const l of ls) {

        const u = (tau - acc) / l.dur, p = l.curve.getPointAt(u), d = l.curve.getTangentAt(u);

async function loadModel(dir, name) {
  const text = (f) => fetch(`${dir}/${f}`).then((r) => { if (!r.ok) throw new Error(f + " " + r.status); return r.text(); });
  const json = await text(`${name}.json`), b64 = (await text(`${name}-geometry.txt`)).trim();
  const raw = atob(b64), bin = new Uint8Array(raw.length); for (let i = 0; i < raw.length; i++) bin[i] = raw.charCodeAt(i);
  const pad = (n) => (n + 3) & ~3, jb = new TextEncoder().encode(json), jl = pad(jb.length), bl = pad(bin.length);
  const glb = new Uint8Array(28 + jl + bl), dv = new DataView(glb.buffer);
  dv.setUint32(0, 0x46546c67, true); dv.setUint32(4, 2, true); dv.setUint32(8, glb.length, true);
  dv.setUint32(12, jl, true); dv.setUint32(16, 0x4e4f534a, true); glb.fill(0x20, 20, 20 + jl); glb.set(jb, 20);
  dv.setUint32(20 + jl, bl, true); dv.setUint32(24 + jl, 0x004e4942, true); glb.set(bin, 28 + jl);
  return new Promise((res, rej) => new GLTFLoader().parse(glb.buffer, dir + "/", res, rej));
}

async function startLife() {
  renderer = new THREE.WebGLRenderer({ canvas, alpha: true, antialias: true, premultipliedAlpha: true });
  renderer.outputColorSpace = THREE.SRGBColorSpace; renderer.setClearColor(0x000000, 0);
  fit();

  horseProto = g; silkList = cat.silks;
  for (const a of g.animations) clipsByName[a.name] = a;
  maskTex = texLoader.load("assets/tint-mask.png"); maskTex.flipY = false; maskTex.colorSpace = THREE.NoColorSpace;
  const size = new THREE.Box3().setFromObject(g.scene).getSize(new THREE.Vector3());
  horseScale = 17 / Math.max(size.x, size.z);                      // a horse on the board is about 17 pixels nose to tail

  // Warren Hill: lots cantering up the hill every so often, and the morning string arriving from the yard
  const hill = P(HILL), walk = P(STRING_WALK), gallops = P(GALLOPS);
  const STRING = ["ballydoyle-navy", "ballydoyle-navy", "ballydoyle-navy", "ballydoyle-navy", "ballydoyle-navy", "ballydoyle-navy", "ballydoyle-navy"];
  STRING.forEach((sid, i) => journey(makeHorse(sid), [{ curve: walk, speed: 13, gait: "walk" }, { curve: hill, speed: 46, gait: "gallop" }], { start: i * 1.9, rest: 30 }));
  for (let lot = 0; lot < 2; lot++) for (let i = 0; i < 3; i++)
    journey(makeHorse(), [{ curve: P(HILL.map(([x, z]) => [x, z + (i % 2) * 7])), speed: 50 + i * 2, gait: "gallop" }], { start: 6 + lot * 22 + i * 0.9, rest: 38 });
  for (let i = 0; i < 3; i++) journey(makeHorse(), [{ curve: P(GALLOPS.map(([x, z]) => [x, z + i * 6])), speed: 62 - i * 3, gait: "gallop" }], { start: 3 + i * 0.7, rest: 16 });
  // the yards: walking round the parade ring, the lunge ring, the stable yard
  for (let i = 0; i < 3; i++) loop(makeHorse(), 967, 622, 43, 23, 9, i * 2.09, 0.21);
  loop(makeHorse(), 1080, 730, 37, 16, 15, 0, -0.07);
  for (let i = 0; i < 2; i++) loop(makeHorse(), 680, 738, 58, 19, 8, i * 3.14);
  // horseboxes on the roads
  VAN_ROUTES.forEach((r, i) => journey(makeVan(i), [{ curve: P(r), speed: 21 + (i % 3) * 3 }], { start: i * 9 - 20, rest: 6 + i * 2 }));

const clock = new THREE.Clock();
let cloudT = 0;
function frame() {
  const dt = Math.min(clock.getDelta(), 0.1), t = clock.elapsedTime;
  cloudT += dt; if (cloudT > 1 / 15) { drawClouds(cloudT); cloudT = 0; }
  if (renderer) {
    for (const mv of movers) { mv.step(t); if (mv.m.mixer && mv.m.obj.visible) mv.m.mixer.update(dt); }
    renderer.render(scene, cam);
  }
  requestAnimationFrame(frame);
}
fit(); drawClouds(0); frame();
