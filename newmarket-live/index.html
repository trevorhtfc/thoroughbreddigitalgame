<meta charset="utf-8">
<title>Thoroughbred Newmarket</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500;600&family=Nunito:wght@400;600;700;800&family=Crimson+Pro:ital,wght@0,600;0,700;1,600&display=swap" rel="stylesheet">
<style>
/* The Ascot game's look (ascot-game/index.html): the green band, green buttons, gold for what's chosen, cream boxes
   with square-ish corners, Jost for headings and Nunito for text. The board fills the rest. One look in every theme. */
:root{
  color-scheme:light;
  --tb-band:#446f66; --tb-band-dk:#365a52; --tb-green:#3d7153; --tb-green-hi:#346347; --tb-gold:#b79042; --tb-gold-hi:#cfa955;
  --tb-bg:#f3efe7; --tb-panel:#fbf9f4; --tb-line:#d8d2c4; --tb-ink:#33332b; --tb-muted:#6b6a60; --tb-on-dark:#f2eee7;
  --tb-radius:3px;
  --tb-display:"Jost","Futura","Avenir Next",system-ui,sans-serif; --tb-body:"Nunito",system-ui,-apple-system,"Segoe UI",sans-serif;
  --tb-serif:"Crimson Pro",Georgia,serif;
  --bar-h:58px;
}
html,body{height:100%;margin:0;overflow:hidden;background:var(--tb-band-dk);color:var(--tb-ink);font-family:var(--tb-body);-webkit-font-smoothing:antialiased}
button{font:inherit;cursor:pointer;color:inherit}
button:focus-visible{outline:2px solid var(--tb-gold);outline-offset:3px}

/* the band: game name and the stable's standing */
.bar{position:fixed;inset:0 0 auto;height:var(--bar-h);padding-top:env(safe-area-inset-top,0px);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;align-items:center;gap:22px;background:var(--tb-band);color:var(--tb-on-dark);z-index:20;box-shadow:0 2px 10px rgba(20,35,30,.3)}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.brand .mark{width:44px;height:29px;background:var(--tb-on-dark);-webkit-mask:var(--horse) center/contain no-repeat;mask:var(--horse) center/contain no-repeat;flex:none}
.brand b{display:block;font-family:var(--tb-display);font-weight:500;font-size:19px;letter-spacing:.22em;line-height:1}
.brand i{display:block;font-style:normal;font-family:var(--tb-display);font-size:11.5px;letter-spacing:.3em;line-height:1;margin-top:5px;opacity:.8;text-transform:uppercase}
.stats{display:flex;margin-left:auto;font-size:15px;white-space:nowrap}
.stats > span{padding:0 16px;border-left:1px solid rgba(242,238,231,.28);display:flex;align-items:center;gap:8px;opacity:.92}
.stats svg{width:17px;height:17px;color:var(--tb-on-dark);opacity:.8;flex:none}
.stats em{font-style:normal;font-weight:700;font-variant-numeric:tabular-nums}

/* the board */
.view{position:fixed;inset:var(--bar-h) 0 0;overflow:hidden;background:var(--tb-band-dk);display:flex}
.view.pan{overflow-x:auto;overflow-y:hidden;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.view.pan::-webkit-scrollbar{display:none}
.holder{position:relative;flex:none;margin:auto}   /* auto margins centre it, and never push it out of scroll reach */
.stage{position:absolute;left:0;top:0;width:1448px;height:1086px;transform-origin:0 0;box-shadow:0 10px 40px rgba(10,25,20,.45)}
.stage > img{position:absolute;inset:0;width:1448px;height:1086px;display:block;max-width:none;user-select:none;-webkit-user-drag:none}
#life,#clouds,#glow{position:absolute;inset:0;width:1448px;height:1086px;pointer-events:none}
#wisps{position:absolute;left:0;top:0;width:1448px;height:300px;pointer-events:none}
#life{filter:saturate(.85) sepia(.1)}
#clouds{mix-blend-mode:multiply;opacity:.9}
/* the places' light: a soft rim always, warming up when the pointer is over a place or it is chosen */
#glow .site{cursor:pointer;pointer-events:fill}
#glow .site .hit{fill:transparent}
#glow .halo{fill:none;stroke:#ffb54a;stroke-width:16;stroke-linejoin:round;opacity:.3;filter:url(#halo);transition:opacity .45s,stroke-width .45s}
#glow .rim{fill:none;stroke:#ffe7a6;stroke-width:2.4;stroke-linejoin:round;opacity:.5;filter:url(#rim);transition:opacity .45s,stroke-width .45s}
#glow .line{fill:none;stroke:#fff6dc;stroke-width:1.1;stroke-linejoin:round;opacity:.5;transition:opacity .45s}
#glow .wash{fill:url(#washGrad);opacity:0;mix-blend-mode:screen;transition:opacity .45s}
#glow .spark{fill:none;stroke:#fffaf0;stroke-width:2.6;stroke-linecap:round;stroke-dasharray:14 260;opacity:0;filter:url(#rim);transition:opacity .45s}
#glow .site.hot .halo{opacity:.85;stroke-width:26}
#glow .site.hot .rim{opacity:1;stroke-width:3.4}
#glow .site.hot .line{opacity:.95}
#glow .site.hot .wash{opacity:.55}
#glow .site.hot .spark{opacity:.9}
@media (prefers-reduced-motion:no-preference){
  #glow .site .rim{animation:breathe 4.5s ease-in-out infinite}
  #glow .site:nth-child(2n) .rim{animation-delay:-1.6s} #glow .site:nth-child(3n) .rim{animation-delay:-3s}
  #glow .site.hot .rim{animation:none}
  #glow .spark{animation:run 5s linear infinite}
}
@keyframes breathe{0%,100%{opacity:.5}50%{opacity:.85}}
@keyframes run{to{stroke-dashoffset:-548}}

/* the places: a green disc with its sign over a cream label; gold when lit or chosen */
.loc{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;border:0;background:none;padding:0;z-index:2}
.loc .medal{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;margin-bottom:-6px;position:relative;z-index:1;
  background:var(--tb-green);border:2px solid var(--tb-panel);box-shadow:0 2px 6px rgba(20,30,20,.4);transition:background .25s}
.loc .medal svg{width:25px;height:25px;color:var(--tb-on-dark)}
.loc .medal .jc{font-family:var(--tb-display);font-weight:600;font-size:15px;letter-spacing:.06em;color:var(--tb-on-dark)}
.loc .medal .hz{width:30px;height:20px;background:var(--tb-on-dark);-webkit-mask:var(--horse) center/contain no-repeat;mask:var(--horse) center/contain no-repeat}
.loc .pill{position:relative;z-index:1;font-family:var(--tb-display);font-weight:600;font-size:13.5px;letter-spacing:.12em;text-transform:uppercase;line-height:1.2;text-align:center;color:var(--tb-green);
  padding:8px 13px 7px;border-radius:var(--tb-radius);background:var(--tb-panel);border:1px solid var(--tb-line);box-shadow:0 3px 8px rgba(20,30,20,.3);white-space:nowrap;transition:background .25s,color .25s,border-color .25s}
.loc .ring{position:absolute;left:50%;top:100%;width:90px;height:22px;margin:-8px 0 0 -45px;border-radius:50%;border:2px solid rgba(255,231,166,.8);opacity:0;pointer-events:none}
.loc:hover .pill,.loc.lit .pill{border-color:var(--tb-gold);color:var(--tb-ink)}
.loc.on .pill{background:var(--tb-gold);border-color:var(--tb-gold);color:#fff}
.loc:hover .medal,.loc.lit .medal,.loc.on .medal{background:var(--tb-gold)}
@media (prefers-reduced-motion:no-preference){
  .loc .ring{animation:ripple 3.2s ease-out infinite}
  .loc:nth-of-type(2n) .ring{animation-delay:1.1s} .loc:nth-of-type(3n) .ring{animation-delay:2.1s}
}
@keyframes ripple{0%{transform:scale(.55);opacity:.85}100%{transform:scale(1.5);opacity:0}}

/* To the Races: the way out of town, always in the top right */
.races{position:fixed;top:calc(var(--bar-h) + 14px);right:max(18px,env(safe-area-inset-right,0px));z-index:16;display:flex;align-items:center;gap:12px;
  border:none;border-radius:var(--tb-radius);background:var(--tb-green);color:var(--tb-on-dark);padding:10px 20px 10px 14px;box-shadow:0 0 0 2px var(--tb-panel),0 6px 16px rgba(20,35,25,.4)}
.races .hz{width:38px;height:25px;background:var(--tb-on-dark);-webkit-mask:var(--horse) center/contain no-repeat;mask:var(--horse) center/contain no-repeat}
.races .pill{font-family:var(--tb-display);font-weight:600;font-size:16px;letter-spacing:.16em;text-transform:uppercase;white-space:nowrap}
.races:hover{background:var(--tb-green-hi)}
.races.on{background:var(--tb-gold)}
@media (prefers-reduced-motion:no-preference){ .races{animation:beckon 3.4s ease-in-out infinite} }
@keyframes beckon{0%,100%{box-shadow:0 0 0 2px var(--tb-panel),0 6px 16px rgba(20,35,25,.4)}50%{box-shadow:0 0 0 2px var(--tb-panel),0 0 22px rgba(255,214,140,.75)}}

/* the card for the chosen place */
.card{position:fixed;right:max(18px,env(safe-area-inset-right,0px));top:calc(var(--bar-h) + 84px);width:330px;z-index:15;padding:18px 18px 20px;border-radius:var(--tb-radius);
  background:var(--tb-panel);border:1px solid var(--tb-line);box-shadow:0 14px 40px rgba(20,35,25,.4);transform-origin:80% 0;transition:opacity .25s,transform .25s}
.card[hidden]{display:block!important;opacity:0;transform:scale(.94) translateY(-6px);pointer-events:none}
.card header{display:flex;align-items:center;gap:10px}
.card h2{margin:0;font-family:var(--tb-display);font-weight:600;font-size:21px;letter-spacing:.18em;text-transform:uppercase;line-height:1.15;color:var(--tb-green);text-wrap:balance;flex:1}
.card .x{width:34px;height:34px;border-radius:var(--tb-radius);border:1px solid var(--tb-line);background:var(--tb-panel);font-size:20px;line-height:1;color:var(--tb-muted);display:grid;place-items:center;flex:none}
.card .x:hover{border-color:var(--tb-green);color:var(--tb-green)}
.card .pic{margin-top:14px;height:170px;border-radius:var(--tb-radius);border:1px solid var(--tb-line);background:url(assets/newmarket-board.webp) no-repeat;background-color:var(--tb-bg)}
.card p{margin:12px 2px 16px;font-size:16px;line-height:1.45;color:var(--tb-muted)}
.card .go{width:100%;display:flex;align-items:center;justify-content:center;gap:10px;padding:13px 22px;border:none;border-radius:var(--tb-radius);
  background:var(--tb-green);color:var(--tb-on-dark);font-family:var(--tb-body);font-weight:600;font-size:17px;letter-spacing:.03em}
.card .go:hover{background:var(--tb-green-hi)}
.card .go svg{width:12px;height:12px;fill:currentColor}
.card .soon{margin:10px 0 0;font-size:14px;color:var(--tb-muted)}

.hint{position:fixed;left:max(18px,env(safe-area-inset-left,0px));bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:10;display:flex;align-items:center;gap:12px;padding:10px 16px 10px 12px;border-radius:var(--tb-radius);
  background:var(--tb-panel);border:1px solid var(--tb-line);color:var(--tb-ink);box-shadow:0 6px 18px rgba(20,35,25,.35);pointer-events:none}
.hint svg{width:20px;height:28px;fill:none;stroke:var(--tb-green);stroke-width:1.6}
.hint b{display:block;font-family:var(--tb-display);font-weight:600;font-size:14px;letter-spacing:.14em;text-transform:uppercase;color:var(--tb-green)}
.hint small{display:block;font-size:13px;color:var(--tb-muted);margin-top:2px}
.credit{position:fixed;right:max(10px,env(safe-area-inset-right,0px));bottom:calc(6px + env(safe-area-inset-bottom,0px));z-index:10;font-size:11px;color:rgba(242,238,231,.6);font-family:var(--tb-body)}

@media (max-width:980px){ .stats > span:not(.funds){display:none} }
@media (max-width:640px){
  :root{--bar-h:52px}
  .bar{gap:10px} .brand{gap:8px} .brand .mark{width:34px;height:23px} .brand b{font-size:15px;letter-spacing:.16em} .brand i{font-size:10px}
  .stats{font-size:14px} .stats > span{padding:0 0 0 10px} .stats .funds .lbl{display:none}
  .card{left:max(12px,env(safe-area-inset-left,0px));right:max(12px,env(safe-area-inset-right,0px));top:auto;bottom:calc(12px + env(safe-area-inset-bottom,0px));width:auto;transform-origin:50% 100%}
  .card .pic{height:130px}
  .hint{display:none}
  .races{padding:8px 14px 8px 10px;gap:8px} .races .hz{width:28px;height:19px} .races .pill{font-size:13px}
}
</style>

  const occ = await new Promise((res, rej) => texLoader.load("assets/occlusion.png", res, undefined, rej));
  occ.flipY = false; occ.colorSpace = THREE.NoColorSpace; occ.minFilter = occ.magFilter = THREE.NearestFilter; occ.generateMipmaps = false; occ.needsUpdate = true;
  OCC.occ.value = occ;
  const size = new THREE.Box3().setFromObject(g.scene).getSize(new THREE.Vector3());
  horseScale = 20 / Math.max(size.x, size.z);                      // a horse on the board is about 20 pixels nose to tail
  personScale = 12 / 1.8;                                          // and a person about 12 pixels tall

  // strings walking out to the heath, off the left edge, then round again
  for (const s of STRINGS) { const c = P(s.route); for (let i = 0; i < s.n; i++) { const h = makeHorse({ silk: s.silk }); h.keepLeft = 4; journey(h, [{ curve: c, speed: 15, gait: "walk" }], { start: s.start + i * 1.7, rest: 26 }); } }
  // the Gallops and Warren Hill: lots working in a line
  const gal = P(GALLOPS), war = P(WARREN), lone = P(LONER);
  for (let i = 0; i < 5; i++) journey(makeHorse(), [{ curve: P(GALLOPS.map(([x, z]) => [x, z + (i % 2) * 8])), speed: 70 - i, gait: "gallop" }], { start: 4 + i * 1.1, rest: 24 });
  for (let i = 0; i < 4; i++) journey(makeHorse(), [{ curve: P(WARREN.map(([x, z]) => [x, z + (i % 2) * 7])), speed: 54, gait: "gallop" }], { start: 14 + i * 1.0, rest: 22 });
  journey(makeHorse(), [{ curve: lone, speed: 46, gait: "gallop" }], { start: 9, rest: 16 });
  // horseboxes in from the top and the bottom of the board, out along Bury Road and Old Station Road
  VANS.forEach((r, i) => journey(makeVan(i), [{ curve: P(r), speed: 26 + (i % 3) * 4 }], { start: i * 16 + 4, rest: 14 + i * 5 }));
  // the paddocks: loose horses wandering along, a rest, and back
  for (const pd of PADDOCK) { const c = P(pd.pts), b = P(rev(pd.pts));
    journey(makeHorse({ rider: false, coat: pd.coat }), [{ curve: c, speed: 6, gait: "walk" }, { pause: 7 }, { curve: b, speed: 6, gait: "walk" }, { pause: 9 }], { start: Math.random() * 20, rest: 0, fadeIn: false, fadeOut: false }); }
  journey(makeHorse({ rider: false, coat: 4 }), [{ curve: P([[1333, 431], [1390, 452], [1466, 482]]), speed: 7, gait: "walk" }], { start: 5, rest: 12 });
  // the yards: horses led from one stable to another, a horse ridden round the lunge ring, people about
  YARD_TRIPS.forEach((tr, i) => { const h = makeHorse({ rider: false }); h.lead = makePerson();
    journey(h, [{ curve: P(tr), speed: 9, gait: "walk" }], { start: 3 + i * 14, rest: 10 + i * 4 }); });
  circuit(makeHorse(), P([[1281, 847], [1241, 870], [1242, 883], [1260, 908], [1346, 896], [1370, 887], [1345, 852], [1305, 843]], true), 13, 0);
  const parade = P(oval(1168, 752, 53, 26, 0.26), true);
  for (let i = 0; i < 3; i++) { const h = makeHorse({ rider: false }); h.lead = makePerson(); circuit(h, parade, 9, i / 3); }
  PEOPLE_TRIPS.forEach((tr, i) => journey(makePerson(), [{ curve: P(tr), speed: 7, gait: "walk" }, { pause: 3 }, { curve: P(rev(tr)), speed: 7, gait: "walk" }], { start: i * 2.3, rest: 4 + i, fadeIn: false, fadeOut: false }));

  window.__ready = true;
  // a check hook: stand a horse at a board point (it shows whether buildings in front of it hide it)
  window.__probe = (x, y) => { const h = makeHorse(); setGait(h, "walk", 5); place(h, new THREE.Vector3(x, 0, y), new THREE.Vector3(1, 0, 0), 1, 0); h.mixer.update(0.1); };
}

if (location.hash === "#routes") {                                  // a check view: every route drawn over the board
  const line = (pts, col, closed) => { const e = document.createElementNS(svgNS, closed ? "polygon" : "polyline"); e.setAttribute("points", pts.map((q) => q.join(",")).join(" "));
    e.setAttribute("fill", "none"); e.setAttribute("stroke", col); e.setAttribute("stroke-width", "2.5"); e.style.pointerEvents = "none"; glow.appendChild(e); };
  Object.values(ROAD).forEach((r) => line(r, "#1060ff"));
  STRINGS.forEach((s) => line(s.route, "#e0102a")); [GALLOPS, WARREN, LONER].forEach((r) => line(r, "#00a040"));
  [...PADDOCK.map((p) => p.pts), ...YARD_TRIPS, ...PEOPLE_TRIPS].forEach((r) => line(r, "#ff30d0"));
  line(oval(1168, 752, 53, 26, 0.26), "#ff8000", true);
  setTimeout(() => document.querySelectorAll("#glow .site").forEach((z) => z.classList.add("hot")), 50);
}

const clock = new THREE.Clock();
let skyT = 0;
function frame() {
  const dt = Math.min(clock.getDelta(), 0.1), t = clock.elapsedTime;
  skyT += dt; if (skyT > 1 / 15) { drawSky(skyT); skyT = 0; }
  if (renderer) {
    for (const mv of movers) { mv.step(t, dt); if (mv.m.mixer && mv.m.obj.visible) mv.m.mixer.update(dt); }
    renderer.render(scene, cam);
  }
  requestAnimationFrame(frame);
}
fit(); drawSky(0); frame();
window.__state = () => ({ movers: movers.length, scale, scroll: view.scrollLeft, w: view.clientWidth });
window.__choose = choose;
window.__hover = hover;
startLife().catch((e) => { console.warn("Newmarket life didn't start", e); });
</script>
