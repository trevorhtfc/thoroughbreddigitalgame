<style>
/* One painted world, one look in every theme: a dark leather header, the board filling the rest,
   brass medallions on the places, a claret card when you pick one. */
:root{
  color-scheme:light;
  --leather:#1d1912; --leather-2:#2a241a; --brass:#c6a15a; --brass-hi:#ecd497; --parch:#f4e8c9; --parch-2:#e8d7ae;
  --ink:#2c2418; --ink-soft:#5a4c36; --claret:#7b1e2b; --claret-hi:#a02c3b; --board:#d9cfa9;
  --display:"Cinzel","Trajan Pro",Georgia,serif; --serif:"Cormorant Garamond","Iowan Old Style",Georgia,serif;
  --bar-h:58px;
}
html,body{height:100%;margin:0;overflow:hidden;background:var(--leather);color:var(--ink);font-family:var(--serif);-webkit-font-smoothing:antialiased}
button{font:inherit;cursor:pointer;color:inherit}
button:focus-visible{outline:2px solid var(--brass-hi);outline-offset:3px}

/* the header: game name and the stable's standing */
.bar{position:fixed;inset:0 0 auto;height:var(--bar-h);padding-top:env(safe-area-inset-top,0px);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;align-items:center;gap:22px;background:linear-gradient(var(--leather-2),var(--leather));border-bottom:1px solid #4a3d26;box-shadow:0 2px 0 #0e0c08,0 6px 18px rgba(0,0,0,.45);z-index:20;color:var(--parch)}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.brand .mark{width:46px;height:30px;background:var(--brass);-webkit-mask:var(--horse) center/contain no-repeat;mask:var(--horse) center/contain no-repeat;flex:none}
.brand b{display:block;font-family:var(--display);font-weight:700;font-size:23px;letter-spacing:.08em;line-height:1;color:var(--brass-hi)}
.brand i{display:block;font-size:16px;line-height:1.1;color:var(--parch-2);text-align:center;letter-spacing:.04em}
.stats{display:flex;gap:0;margin-left:auto;font-size:17px;white-space:nowrap}
.stats > span{padding:0 18px;border-left:1px solid #4a3d26;display:flex;align-items:center;gap:8px}
.stats svg{width:18px;height:18px;color:var(--brass);flex:none}
.stats em{font-style:normal;color:var(--brass-hi);font-variant-numeric:tabular-nums}

/* the board */
.view{position:fixed;inset:var(--bar-h) 0 0;overflow:hidden;background:var(--leather);display:flex}
.view.pan{overflow-x:auto;overflow-y:hidden;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.view.pan::-webkit-scrollbar{display:none}
.holder{position:relative;flex:none;margin:auto}   /* auto margins centre it, and never push it out of scroll reach */
.stage{position:absolute;left:0;top:0;width:1200px;height:900px;transform-origin:0 0;box-shadow:0 0 0 1px #4a3d26,0 10px 40px rgba(0,0,0,.6)}
.stage > img{position:absolute;inset:0;width:1200px;height:900px;display:block;max-width:none;user-select:none;-webkit-user-drag:none}
#life,#clouds,#glow{position:absolute;inset:0;width:1200px;height:900px;pointer-events:none}
#life{filter:saturate(.85) sepia(.1)}
#clouds{mix-blend-mode:multiply;opacity:.9}
#glow .zone{opacity:0;transition:opacity .35s}
#glow .zone.on{opacity:1}

/* the places: a brass medallion over a parchment label, pulsing softly */
.loc{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;border:0;background:none;padding:0;z-index:2}
.loc .medal{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;margin-bottom:-6px;position:relative;z-index:1;
  background:radial-gradient(circle at 50% 35%,#4a3a26,#231b11 70%);border:2px solid var(--brass);box-shadow:0 0 0 2px #2a2016,0 3px 8px rgba(0,0,0,.45)}
.loc .medal svg{width:27px;height:27px;color:var(--brass-hi)}
.loc .medal .jc{font-family:var(--display);font-weight:700;font-size:17px;color:var(--brass-hi);letter-spacing:-.04em}
.loc .medal .hz{width:32px;height:22px;background:var(--brass-hi);-webkit-mask:var(--horse) center/contain no-repeat;mask:var(--horse) center/contain no-repeat}
.loc .pill{position:relative;z-index:1;font-family:var(--display);font-weight:700;font-size:14.5px;letter-spacing:.05em;line-height:1.15;text-align:center;color:var(--ink);
  padding:8px 15px 7px;border-radius:7px;background:linear-gradient(var(--parch),var(--parch-2));border:1.5px solid var(--brass);box-shadow:0 0 0 1.5px #3a2e1c,0 4px 10px rgba(0,0,0,.4);white-space:nowrap}
.loc .ring{position:absolute;left:50%;top:100%;width:90px;height:22px;margin:-8px 0 0 -45px;border-radius:50%;border:2px solid rgba(236,212,151,.75);opacity:0;pointer-events:none}
.loc:hover .pill,.loc.on .pill{background:linear-gradient(var(--claret-hi),var(--claret));color:#fbefd3;border-color:var(--brass-hi)}
.loc:hover .medal,.loc.on .medal{border-color:var(--brass-hi);box-shadow:0 0 0 2px #2a2016,0 0 16px rgba(236,212,151,.8)}
@media (prefers-reduced-motion:no-preference){
  .loc .ring{animation:ripple 3.2s ease-out infinite}
  .loc:nth-of-type(2n) .ring{animation-delay:1.1s} .loc:nth-of-type(3n) .ring{animation-delay:2.1s}
}
@keyframes ripple{0%{transform:scale(.55);opacity:.85}100%{transform:scale(1.5);opacity:0}}

/* the card for the chosen place */
.card{position:fixed;right:max(18px,env(safe-area-inset-right,0px));top:calc(var(--bar-h) + 18px);width:330px;z-index:15;padding:16px 16px 18px;border-radius:10px;
  background:linear-gradient(#f8eed4,#efe0ba);border:2px solid var(--brass);box-shadow:0 0 0 3px #3a2e1c,0 14px 40px rgba(0,0,0,.55);transform-origin:80% 0;transition:opacity .25s,transform .25s}
.card[hidden]{display:block!important;opacity:0;transform:scale(.92) translateY(-6px);pointer-events:none}
.card header{display:flex;align-items:center;gap:10px}
.card h2{margin:0;font-family:var(--serif);font-style:italic;font-weight:600;font-size:34px;line-height:1;color:var(--claret);text-wrap:balance;flex:1}
.card .x{width:34px;height:34px;border-radius:50%;border:1.5px solid var(--brass);background:var(--parch);font-size:20px;line-height:1;color:var(--ink);display:grid;place-items:center;flex:none}
.card .pic{margin-top:12px;height:170px;border-radius:6px;border:1.5px solid #8a7146;box-shadow:inset 0 0 30px rgba(40,25,10,.45);background:url(assets/newmarket-board.webp) no-repeat;background-color:var(--board)}
.card p{margin:12px 2px 14px;font-style:italic;font-size:19px;line-height:1.3;color:var(--ink-soft);text-align:center}
.card .go{width:100%;display:flex;align-items:center;justify-content:center;gap:12px;padding:12px 16px;border-radius:30px;border:2px solid var(--brass);
  background:linear-gradient(var(--claret-hi),var(--claret));color:#fbefd3;font-family:var(--serif);font-weight:600;font-size:24px;box-shadow:0 0 0 2px #3a1810,0 6px 14px rgba(60,10,15,.45)}
.card .go:hover{filter:brightness(1.1)}
.card .go svg{width:14px;height:14px;fill:currentColor}
.card .soon{margin:10px 0 0;font-size:15px;font-style:normal;color:var(--ink-soft)}

.hint{position:fixed;left:max(18px,env(safe-area-inset-left,0px));bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:10;display:flex;align-items:center;gap:12px;padding:10px 18px 10px 14px;border-radius:12px;
  background:rgba(29,25,18,.9);border:1.5px solid var(--brass);color:var(--parch);box-shadow:0 6px 18px rgba(0,0,0,.45);pointer-events:none}
.hint svg{width:22px;height:30px;fill:none;stroke:var(--brass-hi);stroke-width:1.6}
.hint b{display:block;font-style:italic;font-weight:600;font-size:21px;line-height:1.1}
.hint small{display:block;font-family:var(--display);font-size:10.5px;letter-spacing:.14em;color:var(--brass);margin-top:2px}
.credit{position:fixed;right:max(10px,env(safe-area-inset-right,0px));bottom:calc(6px + env(safe-area-inset-bottom,0px));z-index:10;font-size:11px;color:rgba(244,232,201,.55);font-family:system-ui,sans-serif}

@media (max-width:980px){ .stats > span:not(.funds){display:none} }
@media (max-width:640px){
  :root{--bar-h:52px}
  .bar{gap:10px} .brand{gap:8px} .brand .mark{width:36px;height:24px} .brand b{font-size:16px} .brand i{font-size:13px}
  .stats{font-size:15px} .stats > span{padding:0 0 0 10px} .stats .funds .lbl{display:none}
  .card{left:max(12px,env(safe-area-inset-left,0px));right:max(12px,env(safe-area-inset-right,0px));top:auto;bottom:calc(12px + env(safe-area-inset-bottom,0px));width:auto;transform-origin:50% 100%}
  .card .pic{height:130px} .card h2{font-size:29px}
  .hint{display:none}
}
</style>

    let tau = (t - start) % (total + rest); if (tau < 0) tau += total + rest;
    if (tau > total) { place(m, m.obj.position, null, 0); return; }
    let acc = 0;
    for (const l of ls) {
      if (tau <= acc + l.dur) {
        const u = (tau - acc) / l.dur, p = l.curve.getPointAt(u), d = l.curve.getTangentAt(u);
        const a = Math.min(fadeIn ? Math.min(1, tau / 1.2) : 1, fadeOut ? Math.min(1, (total - tau) / 1.2) : 1);
        if (m.act) setGait(m, l.gait, l.speed);
        place(m, p, d, a); return;
      }
      acc += l.dur;
    }
  } });
}
function loop(m, cx, cz, rx, rz, speed, phase, turn = 0) {
  const per = Math.PI * (3 * (rx + rz) - Math.sqrt((3 * rx + rz) * (rx + 3 * rz))), c = Math.cos(turn), s = Math.sin(turn);
  const at = (a) => { const x = rx * Math.cos(a), z = rz * Math.sin(a); return new THREE.Vector3(cx + x * c - z * s, 0, cz + x * s + z * c); };
  movers.push({ m, step(t) {
    const a = phase + t * speed / per * 6.283, p = at(a), q = at(a + 0.02);
    if (m.act) setGait(m, "walk", speed);
    place(m, p, q.sub(p), 1);
  } });
}

async function loadModel(dir, name) {
  const text = (f) => fetch(`${dir}/${f}`).then((r) => { if (!r.ok) throw new Error(f + " " + r.status); return r.text(); });
  const json = await text(`${name}.json`), b64 = (await text(`${name}-geometry.txt`)).trim();
  const raw = atob(b64), bin = new Uint8Array(raw.length); for (let i = 0; i < raw.length; i++) bin[i] = raw.charCodeAt(i);
  const pad = (n) => (n + 3) & ~3, jb = new TextEncoder().encode(json), jl = pad(jb.length), bl = pad(bin.length);
  const glb = new Uint8Array(28 + jl + bl), dv = new DataView(glb.buffer);
  dv.setUint32(0, 0x46546c67, true); dv.setUint32(4, 2, true); dv.setUint32(8, glb.length, true);
  dv.setUint32(12, jl, true); dv.setUint32(16, 0x4e4f534a, true); glb.fill(0x20, 20, 20 + jl); glb.set(jb, 20);
  dv.setUint32(20 + jl, bl, true); dv.setUint32(24 + jl, 0x004e4942, true); glb.set(bin, 28 + jl);
  return new Promise((res, rej) => new GLTFLoader().parse(glb.buffer, dir + "/", res, rej));
}

async function startLife() {
  renderer = new THREE.WebGLRenderer({ canvas, alpha: true, antialias: true, premultipliedAlpha: true });
  renderer.outputColorSpace = THREE.SRGBColorSpace; renderer.setClearColor(0x000000, 0);
  fit();
  const [g, cat] = await Promise.all([loadModel("assets/model", "racehorse"), fetch("assets/silks-catalogue.json").then((r) => r.json())]);
  horseProto = g; silkList = cat.silks;
  for (const a of g.animations) clipsByName[a.name] = a;
  maskTex = texLoader.load("assets/tint-mask.png"); maskTex.flipY = false; maskTex.colorSpace = THREE.NoColorSpace;
  const size = new THREE.Box3().setFromObject(g.scene).getSize(new THREE.Vector3());
  horseScale = 17 / Math.max(size.x, size.z);                      // a horse on the board is about 17 pixels nose to tail

  // Warren Hill: lots cantering up the hill every so often, and the morning string arriving from the yard
  const hill = P(HILL), walk = P(STRING_WALK), gallops = P(GALLOPS);
  const STRING = ["ballydoyle-navy", "ballydoyle-navy", "ballydoyle-navy", "ballydoyle-navy", "ballydoyle-navy", "ballydoyle-navy", "ballydoyle-navy"];
  STRING.forEach((sid, i) => journey(makeHorse(sid), [{ curve: walk, speed: 13, gait: "walk" }, { curve: hill, speed: 46, gait: "gallop" }], { start: i * 1.9, rest: 30 }));
  for (let lot = 0; lot < 2; lot++) for (let i = 0; i < 3; i++)
    journey(makeHorse(), [{ curve: P(HILL.map(([x, z]) => [x, z + (i % 2) * 7])), speed: 50 + i * 2, gait: "gallop" }], { start: 6 + lot * 22 + i * 0.9, rest: 38 });
  for (let i = 0; i < 3; i++) journey(makeHorse(), [{ curve: P(GALLOPS.map(([x, z]) => [x, z + i * 6])), speed: 62 - i * 3, gait: "gallop" }], { start: 3 + i * 0.7, rest: 16 });
  // the yards: walking round the parade ring, the lunge ring, the stable yard
  for (let i = 0; i < 3; i++) loop(makeHorse(), 967, 622, 43, 23, 9, i * 2.09, 0.21);
  loop(makeHorse(), 1080, 730, 37, 16, 15, 0, -0.07);
  for (let i = 0; i < 2; i++) loop(makeHorse(), 680, 738, 58, 19, 8, i * 3.14);
  // horseboxes on the roads
  VAN_ROUTES.forEach((r, i) => journey(makeVan(i), [{ curve: P(r), speed: 21 + (i % 3) * 3 }], { start: i * 9 - 20, rest: 6 + i * 2 }));

  window.__ready = true;
}

const clock = new THREE.Clock();
let cloudT = 0;
function frame() {
  const dt = Math.min(clock.getDelta(), 0.1), t = clock.elapsedTime;
  cloudT += dt; if (cloudT > 1 / 15) { drawClouds(cloudT); cloudT = 0; }
  if (renderer) {
    for (const mv of movers) { mv.step(t); if (mv.m.mixer && mv.m.obj.visible) mv.m.mixer.update(dt); }
    renderer.render(scene, cam);
  }
  requestAnimationFrame(frame);
}
fit(); drawClouds(0); frame();
window.__state = () => ({ movers: movers.length, scale, scroll: view.scrollLeft, w: view.clientWidth });
window.__choose = choose;
startLife().catch((e) => { console.warn("Newmarket life didn't start", e); });
</script>
